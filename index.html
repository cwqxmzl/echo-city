};

function renderScene(n){
  const v = $('view-scene');
  v.innerHTML = `
    <div class="panel">
      <div class="scene-chap">${esc(n.chap||'')}</div>
      <div class="scene-title">${esc(n.title||'')}</div>
      <div class="scene-tagline">${esc((n.tagline||'').replace('{run}',S.run))}</div>
      ${S._pendingTransit? `<div class="scene-transit">${esc(S._pendingTransit)}</div>`:''}
      <div class="dice-log" id="dice-log"></div>
      <div class="story">${fillText(n.text)}</div>
      <div class="choices" id="scene-choices"></div>
    </div>`;
  if(S._pendingDice){ const dl0 = $('dice-log'); if(dl0){ dl0.innerHTML=S._pendingDice; dl0.classList.add('show'); } S._pendingDice=null; }
  S._pendingTransit = null;
  const box = $('scene-choices');
  const choices = filterChoices(n.choices);
  choices.forEach((c,idx)=>{
    const b = document.createElement('div');
    b.className='choice'+(c.hidden?' hidden-mystery':'');
    let tag = c.tag? `<span class="c-tag">【${esc(c.tag)}】</span>`:'';
    let desc = c.desc? `<div class="c-desc">${esc(c.desc)}</div>`:'';
    if(c.kind==='check' && !/难度/.test(desc)){ desc += `<div class="c-desc">难度：${dcWord(c.dc||50)}</div>`; }
    b.innerHTML = `${tag}${esc(c.text)}${desc}`;
    b.onclick = ()=>resolveChoice(c);
    box.appendChild(b);
  });
  if(S._rerollPending){
    S._rerollPending=false;
    if(S._lastCheck && S.fate>0){
      const rb = document.createElement('div');
      rb.className='choice';
      rb.innerHTML = `<span class="c-tag">【命运】</span>消耗 1 点命运点，重掷一次<span class="c-desc">失败之后，命运还想再给你一次机会 · 你的命运点：${S.fate}</span>`;
      rb.onclick = ()=>{
        S.fate--; updateHUD();
        const ck = S._lastCheck;
        const res2 = runCheck(ck.stat, ck.dc, ck.label);
        diceLog(res2);
        const t2 = res2.crit ? (ck.succCrit||ck.succ) : res2.success ? ck.succ : res2.fumb ? (ck.failFumb||ck.fail) : ck.fail;
        S._rerollPending = (!res2.success) && S.fate>0;
        gotoNode(t2);
      };
      box.appendChild(rb);
    }
  }
  showView('scene');
  $('view').scrollTop = 0; window.scrollTo({top:0});
}
function dcWord(dc){
  if(dc<=20) return '轻而易举，闭着眼都能成';
  if(dc<=35) return '略有难度，小心点就好';
  if(dc<=50) return '五五开，看运气';
  if(dc<=65) return '相当困难，需要全力以赴';
  if(dc<=80) return '九死一生，几乎不可能';
  return '近乎不可能，除非命运垂青';
}
function filterChoices(choices){
  return (choices||[]).filter(c=>{
    if(c.need==='old_key' && !S.flag.old_key) return false;
    if(c.need==='gm' && !S.flag.gm) return false;
    if(c.need==='terminal' && !S.flag.touched_terminal) return false;
    if(c.need==='mystery' && !S.flag.mystery_key) return false;
    return true;
  });
}

/* ---------- 选项结算 ---------- */
function resolveChoice(c){
  const dl=$('dice-log');
  if(c.kind==='next'){ gotoNode(c.goto); return; }
  if(c.kind==='effect'){
    try{ if(c.apply) c.apply(S); }catch(e){}
    if(c.addNote){ const n=NODES[S.nodeId]; if(n){ n._note=c.addNote; } }
    if(c.goto && c.goto!=='__stay__') gotoNode(c.goto);
    return;
  }
  if(c.kind==='check'){
    const res = runCheck(c.stat, c.dc, c.tag||'判定');
    diceLog(res);
    // 记录判定上下文（供剧情下方【命运】重掷使用）
    S._lastCheck = {stat:c.stat, dc:c.dc, label:c.tag||'判定', succ:c.succ, fail:c.fail, succCrit:c.succCrit||c.succ, failFumb:c.failFumb||c.fail};
    // 四档剧情路由：大成功/普通成功/普通失败/大失败
    let target;
    if(res.crit) target = c.succCrit || c.succ;
    else if(res.success) target = c.succ;
    else if(res.fumb) target = c.failFumb || c.fail;
    else target = c.fail;
    // 失败且有命运点 → 在剧情下方提供重掷（不再挡在剧情前）
    S._rerollPending = (!res.success) && S.fate>0;
    gotoNode(target);
    return;
  }
  if(c.kind==='combat'){ startCombat(c.enemy, c.win, c.lose); return; }
  if(c.kind==='ending'){ goEnding(c.ending); return; }
}
function renderCheckFailWithReroll(res, c){
  const v=$('view-scene');
  const panel = v.querySelector('.panel');
  const bar = document.createElement('div');
  bar.className='choices'; bar.style.marginTop='10px';
  bar.innerHTML = `
    <div class="choice" id="reroll-btn"><span class="c-tag">【命运】</span>消耗 1 点命运点，重掷一次<span class="c-desc">你的命运点：${S.fate}</span></div>
    <div class="choice" id="accept-btn">接受这个结果，继续前行</div>`;
  panel.appendChild(bar);
  $('reroll-btn').onclick=()=>{
    S.fate--; updateHUD();
    const res2 = runCheck(c.stat, c.dc, c.tag||'判定');
    diceLog(res2);
    bar.remove();
    const target = res2.success ? c.succ : c.fail;
    setTimeout(()=>gotoNode(target), 650);
  };
  $('accept-btn').onclick=()=>{
    const target = c.fail;
    setTimeout(()=>gotoNode(target), 250);
  };
}

/* ---------- 战斗 ---------- */
let CB=null;
/* ---------- 星铁式队友战斗（队友像主角一样：独立HP/能量/战技/终结技） ---------- */
function initTeam(){
  CB.team = [{id:'player', name:'你', kind:'player', hp:S.hp, maxHp:S.maxHp, en:0, down:false}];
  S.party.forEach(pid=>{
    const m = teammateById(pid); if(!m) return;
    const hp = Math.max(20, Math.round(S.maxHp * ((ALLY_COMBAT[pid]||{}).hp||0.6)));
    CB.team.push({id:pid, name:m.name, kind:'ally', hp:hp, maxHp:hp, en:0, down:false});
  });
}
function teamMember(id){ return CB && CB.team ? CB.team.find(t=>t.id===id) : null; }
function aliveAllies(){ return CB && CB.team ? CB.team.filter(t=>t.kind==='ally' && !t.down) : []; }
function teamEn(id, v){ const t=teamMember(id); if(t){ t.en=Math.max(0,Math.min(100,t.en+v)); } }
function allyCombatConf(id){ return ALLY_COMBAT[id] || {hp:.6, skill:{name:'协击',desc:''}, ult:{name:'协力',desc:''}}; }
function allyTakeDamage(id, dmg){
  const t = teamMember(id);
  if(!t || t.kind!=='ally' || t.down) return;
  t.hp -= dmg;
  teamEn(id, 10); // 星铁式：受击回能
  combatLog(`${t.name}受到 <b>${dmg}</b> 点伤害！（${Math.max(0,t.hp)}/${t.maxHp}）`, 'en');
  if(t.hp<=0){
    t.hp=0; t.down=true;
    // 撤销持续性的 flag 型开场被动（灵子/无名/凝光）
    if(t.id==='lingzi'){ S.flag._allyDoubleMp=false; }
    if(t.id==='wuming'){ S.flag._allyMit=0; }
    if(t.id==='ningguang'){ S.flag._allyGold=0; }
    combatLog(`—— ${t.name}倒下了！其被动支援暂时失效。`, 'crit');
  }
  updateHUD();
}
function pickEnemyTarget(){
  const allies = aliveAllies();
  if(!allies.length) return 'player';
  if(S.talents.includes('warder') || CB.buff.taunt) return 'player';
  const roll = rand(100);
  const playerW = 50 + allies.length*3; // 主角承伤 56%-62%，队友分担其余
  if(roll < playerW) return 'player';
  return allies[rand(allies.length)].id;
}
/* 队友战技 / 终结技（星铁式：必中，终结技更强） */
function combatAllySkill(allyId, kind, fromAI){
  if(!CB) return;
  const t = teamMember(allyId);
  if(!t || t.kind!=='ally' || t.down) return;
  const conf = allyCombatConf(allyId);
  const sk = kind==='ult' ? conf.ult : conf.skill;
  if(!sk || !sk.name) return;
  if(kind==='ult' && t.en<100){ combatLog(`${t.name}的终结技能量不足！`, 'fumb'); return; }
  if(kind==='skill' && t.en<30){ combatLog(`${t.name}的战技能量不足！`, 'fumb'); return; }
  if(!fromAI && CB.auto) combatAutoStop(); // 玩家手动操作接管
  CB.turn++;
  t.en -= kind==='ult'?100:30;
  const nm = t.name;
  const deal = (crit)=>{ if(CB.hp<=0) return 0; let d=0; if(crit){ d=Math.max(1,Math.round(raw)); } return d; };
  switch(allyId){
    case 'maomao':
      if(kind==='skill'){ teamHealAll(.12); combatLog(`${nm}施展【${sk.name}】——全队回复 12% 生命。`, 'ally'); }
      else { teamHealAll(.25); reviveOneAlly(); combatLog(`${nm}施展【${sk.name}】——全队回复 25%，并复活一名倒地队友。`, 'ally'); }
      break;
    case 'lan':
      if(kind==='skill'){ healTarget('player',.20); const mv=Math.min(S.maxMp-S.mp,15); S.mp+=mv; updateHUD(); combatLog(`${nm}施展【${sk.name}】——治疗主角 20%，法力 +${mv}。`, 'ally'); }
      else { allyDmg(t, S.stats.int*2.0, true); combatLog(`${nm}施展【${sk.name}】——海渊之怒席卷敌人！`, 'ally'); }
      break;
    case 'tiebi':
      allyDmg(t, S.stats.str*(kind==='ult'?2.6:1.8), kind==='ult');
      combatLog(`${nm}施展【${sk.name}】——${kind==='ult'?'毁灭齐射！':'能量炮击！'}`, 'ally');
      break;
    case 'luolan':
      if(kind==='skill'){ allyDmg(t, S.stats.str*1.5, false); t.hp=Math.min(t.maxHp, t.hp+Math.round(t.maxHp*0.15)); combatLog(`${nm}施展【${sk.name}】——圣光斩并回复自身 15% 生命。`, 'ally'); }
      else { CB.buff.guard=Math.max(CB.buff.guard,2); teamHealAll(.15); combatLog(`${nm}施展【${sk.name}】——全队获得 2 层护盾，回复 15%。`, 'ally'); }
      break;
    case 'lingzi':
      if(kind==='skill'){ allyDmg(t, S.stats.int*1.0, false); const mv=Math.min(S.maxMp-S.mp,20); S.mp+=mv; updateHUD(); combatLog(`${nm}施展【${sk.name}】——造成伤害并恢复法力 +${mv}。`, 'ally'); }
      else { allyDmg(t, S.stats.int*2.2, true); combatLog(`${nm}施展【${sk.name}】——全知协议，必定暴击！`, 'ally'); }
      break;
    case 'wuming':
      if(kind==='skill'){ CB.buff.rage=Math.max(CB.buff.rage,2); combatLog(`${nm}施展【${sk.name}】——主角进入狂暴（暴击 +50%）。`, 'ally'); }
      else { allyDmg(t, S.stats.str*3.0, true); combatLog(`${nm}施展【${sk.name}】——故事终章，终局一击！`, 'ally'); }
      break;
    case 'ningguang':
      if(kind==='skill'){ CB.buff.guard=Math.max(CB.buff.guard,1); allyDmg(t, S.stats.int*0.8, false); combatLog(`${nm}施展【${sk.name}】——岩晶护盾 +1，并造成伤害。`, 'ally'); }
      else { allyDmg(t, S.stats.int*1.8, true); S.gold+=15; updateHUD(); combatLog(`${nm}施展【${sk.name}】——琼玑天权，金币 +15！`, 'ally'); }
      break;
    case 'venti':
      if(kind==='skill'){ CB.buff.haste=true; allyDmg(t, S.stats.int*0.9, false); combatLog(`${nm}施展【${sk.name}】——千风四起！`, 'ally'); }
      else { allyDmg(t, S.stats.int*1.6, false); const mv=Math.min(S.maxMp-S.mp,15); S.mp+=mv; updateHUD(); combatLog(`${nm}施展【${sk.name}】——风神之诗，法力 +${mv}！`, 'ally'); }
      break;
    case 'huangdi':
      if(kind==='skill'){ allyDmg(t, S.stats.str*2.0, false); combatLog(`${nm}施展【${sk.name}】——人皇一斩！`, 'ally'); }
      else { CB.buff.atkup=Math.max(CB.buff.atkup,2); teamHealAll(.15); combatLog(`${nm}施展【${sk.name}】——全队攻击力 +50%（2 回合），回复 15%。`, 'ally'); }
      break;
    default:
      allyDmg(t, S.stats.str*1.2, false); combatLog(`${nm}施展【${sk.name}】——协击！`, 'ally');
  }
  renderCombat();
  if(CB.hp<=0){ combatVictory(); return; }
  combatEnemyTurn();
}
function allyDmg(t, raw, crit){
  if(CB.hp<=0) return 0;
  let dmg = Math.max(1, Math.round(raw));
  if(CB.buff.atkup>0) dmg = Math.round(dmg*(crit?1.5:1.5)); // 战吼加成
  if(crit) dmg = Math.round(dmg*1.3);
  CB.hp -= dmg;
  combatLog(`${t.name}对${ENEMIES[CB.id].name}造成 <b>${dmg}</b> 点伤害！`, 'ally');
  updateHUD();
  return dmg;
}
function teamHealAll(ratio){
  const hv = Math.round(S.maxHp*ratio);
  S.hp = Math.min(S.maxHp, S.hp+hv);
  CB.team.forEach(t=>{ if(t.kind==='ally'&&!t.down){ t.hp=Math.min(t.maxHp, t.hp+hv); } });
  updateHUD();
}
function healTarget(id, ratio){
  if(id==='player'){ const hv=Math.round(S.maxHp*ratio); S.hp=Math.min(S.maxHp,S.hp+hv); updateHUD(); }
  else { const t=teamMember(id); if(t){ const hv=Math.round(t.maxHp*ratio); t.hp=Math.min(t.maxHp,t.hp+hv); } }
}
function reviveOneAlly(){
  const down = CB.team.filter(t=>t.kind==='ally'&&t.down);
  if(!down.length) return false;
  const t = down[0];
  t.down=false; t.hp=Math.max(1, Math.round(t.maxHp*0.3));
  combatLog(`「系统重启」把 ${t.name} 从数据废墟中拉了回来！`, 'ally');
  return true;
}

function startCombat(enemyId, winNode, loseNode, opts){
  const e = ENEMIES[enemyId];
  CB = {id:enemyId, hp:e.hp, max:e.hp, atk:e.atk, dc:e.dc, spd:e.spd,
        winNode, loseNode, turn:0, guard:false, guardUsed:false, fatalGuard:true,
        opMode:!!(opts&&opts.opMode), opBonus:(opts&&opts.opBonus)||0,
        buff:{guard:0,atkup:0,rage:0,aim:false,haste:false,taunt:false}, frozen:false,
        tough:Math.max(20,Math.round(e.hp*0.12)), _toughMax:Math.max(20,Math.round(e.hp*0.12)), _broken:false};
  S.bp=0;
  initTeam();
  S.nodeId = 'combat';
  updateHUD();
  applyAllyPassives();
  if(CB.opMode && OP && OP.world && OP.world.id==='pet' && OP._pet){
    const pd = 8 + OP.world.diff*4;
    CB.hp = Math.max(1, CB.hp - pd);
    CB.tough = Math.max(0, CB.tough - Math.round(pd/2));
    combatLog(`🐾 灵兽·雷光幼犬抢先扑出，一记雷光爪撕在守卫身上——伤害 ${pd}，韧性 -${Math.round(pd/2)}。`);
  }
  renderCombat();
  /* 机制：敌人 spd 参与先手判定——spd 越高越可能抢先进攻
     搜打撤模式走它自己的「被伏击先手」逻辑，不重复判定 */
  if(!CB.opMode){
    const f = roll100() + S.stats.agi;
    const need = 50 + Math.round((e.spd-10)*2.5);
    if(f < need){
      combatLog(`${e.name}身法更快，抢先进攻！`, 'en');
      setTimeout(()=>{ if(CB) combatEnemyTurn(); }, 700);
    }
  }
}

        </div>
      </div>
      ${(function(){ const al=CB.team.filter(t=>t.kind==='ally'); if(!al.length) return ''; return '<div class="ally-bar">'+al.map(t=>{ const conf=allyCombatConf(t.id); const hpp=Math.max(0,Math.round(t.hp/t.maxHp*100)); const en=t.en; return '<div class="ally-card'+(t.down?' down':'')+'">'+
        '<div class="ally-row"><span class="ally-nm">'+esc(t.name)+'</span><span class="ally-hpt">'+t.hp+'/'+t.maxHp+'</span></div>'+
        '<div class="ally-hpbar"><div class="ally-fill" style="width:'+hpp+'%"></div></div>'+
        '<div class="ally-row"><span class="ally-enlbl">能量 '+en+'/100</span></div>'+

          :'<div class="ally-btns"><button class="cact ally-btn" '+(en>=30?'':'disabled')+' onclick="combatAllySkill(\''+t.id+'\',\'skill\')">战技 · '+esc(conf.skill.name)+'</button><button class="cact ally-btn ult" '+(en>=100?'':'disabled')+' onclick="combatAllySkill(\''+t.id+'\',\'ult\')">终结技 · '+esc(conf.ult.name)+'</button></div>')+
      '</div>'; }).join('')+'</div>'; })()}
      <div class="battle-log" id="battle-log">${logEntries.join('<br>')}</div>
      <div class="skill-slot">
        <div style="font-size:12px;color:var(--cyan);letter-spacing:.15em">技能 · 携带 ${S.skills.length}/3</div>

  const sg=$('skill-grid');

function combatLog(html, cls){
  if(!CB._log) CB._log=[];
  CB._log.push(`<span class="${cls}">${html}</span>`);
  const el = $('battle-log'); if(el){ el.innerHTML=CB._log.join('<br>'); el.scrollTop=el.scrollHeight; }
}
function combatPlayerAttack(heavy){
  if(!CB) return;
  CB.turn++;
  // 斩杀天赋
  if(S.talents.includes('feast') && CB.hp <= CB.max*0.30){
    combatLog(`「致命盛宴」发动！对低血量目标执行斩杀！`, 'crit');
    CB.hp=0; combatVictory(); return;
  }
  const fateForce = S.flag._fateForce || false;
  let roll = roll100();
  let crit = roll<=critRange();
  if(S.talents.includes('blink') && CB.turn===1){ crit = true; }
  if(fateForce){ crit=true; roll=100; S.flag._fateForce=false; }
  if(CB.buff.aim){ CB.buff.aim=false; }
  const mod = combatBonus();
  const total = roll + mod;
  let need = CB.dc + (heavy?15:0) - (CB.opBonus||0);
  if(CB.buff.haste) need -= 20;
  if(CB.buff.aim===false && total<need && false){} // no-op
  const hit = crit || total>=need || (CB.buff.aim===false && roll>=0 && roll===100);
  combatLog(`你${heavy?'运足气力，把全身的重量都压进这一记重击':'抢步上前，刃光如虹，直取要害'}——<small>【1d100 = ${roll} ${mod>0?'+'+mod:''} = ${total} ／ 命中 ${need}】</small>`, 'pl');
  if(!hit){
    combatLog(`你这一击扑了个空——${ENEMIES[CB.id].name}的残影散开，毫发无伤。<small>【未命中】</small>`, 'fumb');
    combatEnemyTurn(); return;
  }
  if(crit) combatLog(`——暴击！金色的光纹在${ENEMIES[CB.id].name}身上炸裂，连空气都被灼得发烫！`, 'crit');
  let dmg = S.stats.str*2 + rint(2,10);
  if(heavy) dmg = Math.round(dmg*2.0);
  if(CB.buff.atkup>0) dmg = Math.round(dmg*1.6);
  if(crit) dmg = Math.round(dmg*(S.talents.includes('blink')?2.0:1.6));  // 十步一杀：暴击伤害 +100%
  if(CB.buff.rage>0) dmg = Math.round(dmg*1.25);
  if(S.talents.includes('eye')) dmg += 10;
  CB.hp -= dmg;
  combatLog(`${ENEMIES[CB.id].name}闷哼着被击退，数据碎屑如墨般溅开——<b>${dmg}</b> 点伤害！`, 'pl');
  if(hasTagFx('vamp')){ const hv=Math.max(1,Math.round(dmg*0.2)); S.hp=Math.min(S.maxHp,S.hp+hv); updateHUD(); combatLog(`【词条·噬魂】你汲取了 ${hv} 点生命。`,'ok'); }
  // 普通攻击回蓝（灵子：数据洪流翻倍）
  let mpGain = S.flag._allyDoubleMp ? 24 : 12;
  if(hasBooster('mp')) mpGain += 8;  // 「修炼加速」：普攻额外回蓝
  S.mp = Math.min(S.maxMp, S.mp+mpGain); updateHUD();
  if(S.flag._allyDoubleMp && mpGain===24) combatLog('灵子将攻击数据回路化——法力 +24！','ally');
  if(CB.hp<=0){ combatVictory(); return; }
  if(afterHit(dmg, crit)) return;
  combatEnemyTurn();
}
function combatUseSkill(sid){
  if(!CB) return;
  const sk = skillById(sid); if(!sk) return;
  if(S.mp < sk.mp){ combatLog(`法力不足，无法施放「${sk.name}」（需要 ◆${sk.mp}）`, 'fumb'); return; }
  CB.turn++;
  S.mp -= sk.mp; updateHUD();
  if(sk.type==='atk'){
    let roll = roll100();
    let crit = roll<=critRange();
    if(CB.buff.aim){ CB.buff.aim=false; }
    const mod = combatBonus();
    const total = roll + mod;
    let need = CB.dc - (CB.opBonus||0);
    if(CB.buff.haste) need -= 20;
    const hit = crit || total>=need || (CB.buff.aim===false && roll>=0);
    combatLog(`你凝神施展「${sk.name}」——${sk.int?'灵光自指尖倾泻而出':'气劲沿刃脊奔涌而起'}。<small>【1d100 = ${roll} ${mod>0?'+'+mod:''} = ${total} ／ 命中 ${need}】</small>`, 'pl');
    if(!hit){ combatLog(`「${sk.name}」的势头落了空——${ENEMIES[CB.id].name}侧身让过要害，毫发无伤。<small>【未命中】</small>`, 'fumb'); combatEnemyTurn(); return; }
    if(crit) combatLog(`——法术暴击！元素灵光炸成漫天星屑，${ENEMIES[CB.id].name}的嘶吼都变了调！`, 'crit');
    const base = sk.int? S.stats.int : S.stats.str;
    const gain = (CB.buff.atkup>0?1.6:1) * (crit?1.7:1) * (CB.buff.rage>0?1.25:1) * (1 + (S.bp||0)*0.5) * (1 + Math.min(0.6, S.level*0.02));  // 等级带来成长，越战越强
    S.bp = 0; updateHUD();
    let dmg=0;
    if(sk.hits){
      let totalDmg=0;
      for(let i=0;i<sk.hits;i++){
        const h = Math.max(1, Math.round(base*sk.power*gain));
        CB.hp -= h; totalDmg += h;
      }
      dmg=totalDmg;
      combatLog(`「${sk.name}」如虹连斩 ${sk.hits} 段，刀光接连炸裂，数据碎屑漫天飞溅——共 <b>${dmg}</b> 点伤害！`, 'pl');
    } else {
      dmg = Math.max(1, Math.round(base*sk.power*gain));
      CB.hp -= dmg;
      combatLog(`「${sk.name}」贯穿了${ENEMIES[CB.id].name}的防线——<b>${dmg}</b> 点伤害！`, 'pl');
    }
    if(hasTagFx('vamp')){ const hv=Math.max(1,Math.round(dmg*0.2)); S.hp=Math.min(S.maxHp,S.hp+hv); updateHUD(); combatLog(`【词条·噬魂】你汲取了 ${hv} 点生命。`,'ok'); }
    if(sk.freeze && rand(100)<30){
      CB.frozen=true;
      combatLog(`${ENEMIES[CB.id].name}被【寒冰】冻结，下一回合无法行动！`, 'ok');
    }
    if(sk.steal){
      const hv=Math.round(dmg*sk.steal);
      S.hp=Math.min(S.maxHp,S.hp+hv); updateHUD();
      combatLog(`你汲取了 <b>${hv}</b> 点生命。`, 'ok');
    }
    if(sk.rage){ CB.buff.rage=2; combatLog('「能量爆发」的余波让你进入狂暴状态！', 'ok'); }
    if(CB.hp<=0){ combatVictory(); return; }
    if(afterHit(dmg, crit)) return;
    combatEnemyTurn(); return;
  }
  if(sk.type==='heal'){
    const hv=Math.round(S.maxHp*sk.heal);
    S.hp=Math.min(S.maxHp,S.hp+hv); updateHUD();
    combatLog(`「${sk.name}」回复 <b>${hv}</b> 点生命！（${S.hp}/${S.maxHp}）`, 'pl');
    combatEnemyTurn(); return;
  }
  if(sk.type==='def'){
    CB.buff.guard=2;
    combatLog(`「${sk.name}」！接下来两回合受到伤害 -60%。`, 'pl');
    combatEnemyTurn(); return;
  }
  if(sk.type==='buff'){
    if(sk.atkup){ CB.buff.atkup=2; combatLog(`「${sk.name}」！攻击力 +50%，持续 2 回合。`, 'pl'); }
    if(sk.haste){ CB.buff.haste=true; combatLog(`「${sk.name}」！本回合先手，闪避 +30。`, 'pl'); }
    if(sk.aim){ CB.buff.aim=true; combatLog(`「${sk.name}」！下一次攻击必定命中。`, 'pl'); }
    if(sk.taunt){ CB.buff.taunt=true; combatLog(`「${sk.name}」！下回合受击伤害 -40%。`, 'pl'); }
    if(sk.rage){ CB.buff.rage=2; combatLog(`「${sk.name}」！暴击率 +50%，持续 2 回合。`, 'pl'); }
    combatEnemyTurn(); return;
  }
  combatEnemyTurn();
}
function combatGuard(){
  CB.turn++;
  CB.buff.guard=Math.max(CB.buff.guard,1);
  combatLog(`你摆出防御姿态，本回合受到的伤害减半。`, 'pl');
  combatEnemyTurn();
}
function combatItem(itemId){
  CB.turn++;
  const idx=S.items.indexOf(itemId);
  if(idx<0) return;
  S.items.splice(idx,1);
  const it=itemById(itemId);
  if(it.use==='heal'){ S.hp=Math.min(S.maxHp,S.hp+it.val); updateHUD(); combatLog(`你饮下${it.name}，恢复 ${it.val} 点生命！（${S.hp}/${S.maxHp}）`, 'pl'); }
  else if(it.use==='mp'){ S.mp=Math.min(S.maxMp,S.mp+it.val); updateHUD(); combatLog(`你饮下${it.name}，恢复 ${it.val} 点法力！（${S.mp}/${S.maxMp}）`, 'pl'); }
  combatEnemyTurn();
}
function combatFate(){
  CB.turn++;
  S.fate--; updateHUD();
  S.flag._fateForce = true;
  combatLog(`你燃尽一枚命运点，下一次攻击必定命中且暴击！`, 'crit');
  renderCombat();
  combatPlayerAttack(false);
}
function foeMove(e){
  const map={'回响幽灵':'尖啸着挥出半透明的利爪','数据腐化者':'乱码眼瞳一闪，甩出狰狞的数据锁链','归档者·K':'机械臂嗡鸣，弹出一柄数据长刀当头劈落','黑塔帮暴徒':'抡起乱码钢管直砸你的面门','黑塔帮枪手':'端起能量枪，三点连射封锁你的退路','守望者·裁决':'圣光在剑锋上凝成白焰，一剑斩落','回响之核':'无数只眼睛同时睁开，光芒如潮水向你压下','灰袍商人':'慢条斯理地掸了掸袖子，指尖却凝出一道寒光'};
  return map[e.name] || '低吼着扑了上来';
}
function combatEnemyTurn(){
  if(!CB) return;
  if(CB.frozen){ CB.frozen=false; combatLog(`${ENEMIES[CB.id].name}被冻结，无法行动！`, 'ok'); endEnemyTurn(); return; }
  const e = ENEMIES[CB.id];
  let roll = roll100();
  const mod = e.atk;
  const total = roll + mod;
  let need = 50 + Math.round(S.stats.agi*0.8) + (S.talents.includes('blink')&&CB.turn<=1?8:0);
  if(CB.buff.haste) need += 20;
  let hit = total>=need;
  combatLog(`${e.name}${foeMove(e)}——<small>【1d100 = ${roll} + ${mod} = ${total} ／ 闪避 ${need}】</small>`, 'en');
  if(!hit){
    combatLog(`你侧身让开——${e.name}的攻击擦着衣角掠过，掀起一片数据尘埃。<small>【闪避成功】</small>`, 'ok');
    endEnemyTurn(); return;
  }
  const target = pickEnemyTarget();
  let dmg = e.atk + rint(1,4);
  if(target==='player'){
    dmg -= Math.round(S.stats.con*0.3);
    if(CB.buff.guard>0){ dmg = Math.round(dmg*0.4); }
    if(CB.buff.taunt){ dmg = Math.round(dmg*0.6); CB.buff.taunt=false; }
    const eb=equipBonus();
    if(eb.mit>0) dmg = Math.round(dmg*(1-eb.mit));
    if(S.flag._allyMit) dmg = Math.round(dmg*(1-S.flag._allyMit));
    if(hasTagFx('mit')) dmg = Math.round(dmg*0.8);
    if(hasTagFx('omni')) dmg = Math.round(dmg*0.9);
    if(hasBooster('body')){ const bh=Math.max(1,Math.round(S.maxHp*0.05)); S.hp=Math.min(S.maxHp,S.hp+bh); combatLog('【肉身成圣】金身自动回血 +'+bh+'。','ok'); }
    if(S.talents.includes('iron')) dmg = Math.round(dmg*0.6);  // 铁壁之躯：受击 -40%
    if(S.items.includes('artifacts')) dmg = Math.round(dmg*0.95);   // 「圣遗物」：神遗圣物庇护
    if(S.talents.includes('eternal')) dmg = Math.round(dmg*0.5);     // 「永恒防御 · 钢铁之躯·金」：受击 -50%
    dmg = Math.max(1, dmg);
    S.hp -= dmg;
    gainEcho(8); gainBp(1); updateHUD();
    combatLog(`${e.name}的攻势咬进你的防线，你闷哼着后退半步——<b>${dmg}</b> 点伤害！（生命 ${Math.max(0,S.hp)}/${S.maxHp}）`, 'en');
    if(S.talents.includes('eternal')){ const rb = Math.max(1, Math.round(e.atk*0.3)); CB.hp -= rb; combatLog(`【反甲·金】「永恒防御」把 ${e.name} 的攻击原样弹了回去——反弹 ${rb} 点伤害！`, 'crit'); if(CB.hp<=0){ combatVictory(); return; } }
    // 老爷爷护体
    if(S.hp<=0 && S.talents.includes('grandpa') && CB.fatalGuard){
      CB.fatalGuard=false;
      S.hp = 1;
      updateHUD();
      combatLog(`——关键时刻，一道苍老的声音在灵魂深处响起：「小子，把这条命，交给老夫！」\n老爷爷替你挡下了致命一击！（生命 1/${S.maxHp}）`, 'crit');
    }
    if(S.hp<=0 && S.talents.includes('eternal') && !CB._eternalInv && rand(100)<40){
      CB._eternalInv=true; S.hp = 1; updateHUD();
      combatLog(`——「永恒防御 · 无敌·金」：金色的光罩在你身上一闪，致命一击被 100% 挡下！（生命 1/${S.maxHp}）`, 'crit');
    }
    if(S.hp<=0){ renderDeath(); return; }
  } else {
    dmg = Math.max(1, dmg);
    allyTakeDamage(target, dmg);
  }
  endEnemyTurn();
}
function endEnemyTurn(){
  if(!CB) return;
  if(CB.buff.guard>0) CB.buff.guard--;
  if(CB.buff.atkup>0) CB.buff.atkup--;
  if(CB.buff.rage>0) CB.buff.rage--;
  CB.buff.haste=false;
  if(S.talents.includes('eternal')){ const h=Math.max(1,Math.round(S.maxHp*0.08)); S.hp=Math.min(S.maxHp,S.hp+h); updateHUD(); combatLog(`【狂徒·金】「永恒防御」自动修复战损，生命 +${h}。`,'ok'); }
  CB.team.forEach(t=>{ if(t.kind==='ally'&&!t.down) teamEn(t.id, 8); }); // 星铁式：每轮回能
  allyPerTurn();
  renderCombat();
}
/* ---------- 自动战斗（流畅度优化：AI 代打，可随时接管） ---------- */
function combatAuto(){
  if(!CB) return;
  if(CB.auto){ combatAutoStop(); renderCombat(); return; }
  CB.auto = true;
  combatLog('—— 你切到自动挡，让技能自己飞。点「停止」或任一操作即可接管。', 'ok');
  renderCombat();
  CB._autoTimer = setInterval(combatAutoStep, 300);
}
function combatAutoStop(){
  if(!CB) return;
  CB.auto = false;
  if(CB._autoTimer){ clearInterval(CB._autoTimer); CB._autoTimer=null; }
}
function combatAutoStep(){
  if(!CB){ combatAutoStop(); return; }
  // 0) 队友 AI（星铁式）：终结技优先，其次战技；队友倒下/能量不足则跳过
  if(CB.team){
    for(const t of CB.team){
      if(t.kind!=='ally'||t.down) continue;
      if(t.en>=100 && CB.hp>0){ combatAllySkill(t.id,'ult',true); return; }
    }
    for(const t of CB.team){
      if(t.kind!=='ally'||t.down) continue;
      if(t.en>=30 && CB.hp>0){ combatAllySkill(t.id,'skill',true); return; }
    }
  }
  // 1) 增益技能起手（瞄准/疾风/战吼/狂暴/嘲讽）
  for(const sid of S.skills){
    const sk = skillById(sid); if(!sk || sk.type!=='buff') continue;
    const want = (sk.aim && !CB.buff.aim) || (sk.haste && !CB.buff.haste) ||
                 (sk.atkup && CB.buff.atkup===0) || (sk.rage && CB.buff.rage===0) ||
                 (sk.taunt && !CB.buff.taunt);
    if(want && S.mp>=sk.mp){ combatUseSkill(sid); return; }
  }
  // 2) 生命告急 → 喝药
  if(S.hp <= Math.max(1, Math.round(S.maxHp*0.4)) && countItem('potion')>0){ combatItem('potion'); return; }
  // 3) 最高效攻击技能
  let best=null, bestScore=-1;
  for(const sid of S.skills){
    const sk = skillById(sid); if(!sk || sk.type!=='atk') continue;
    if(S.mp < sk.mp) continue;
    const base = sk.int ? S.stats.int : S.stats.str;
    const score = base*sk.power*(sk.hits||1) / sk.mp;
    if(score>bestScore){ bestScore=score; best=sid; }
  }
  if(best){ combatUseSkill(best); return; }
  // 4) 平A
  combatPlayerAttack(false);
}
function combatVictory(){
  const e = ENEMIES[CB.id];
  combatLog(`你击败了 ${e.name}！`, 'crit');
  if(CB.opMode){
    // 箱庭探索遭遇战：胜利后返回探索界面，可继续搜或撤
    combatAutoStop();
    victoryRewards(false);
    gainXp(e.xp||0);
    updateHUD();
    CB=null;
    if(OP){
      const w = OP.world;
      // 遭遇战胜利额外掉落
      const t = drawTreasure(w);
      let bonusTxt = grantTreasure(t, w);
      OP.collected.push(t.n);
      setTimeout(()=>{
        OP.phase='explore';
        OP.log.push(`你击败了「${w.name}」的守卫，它掉落了战利品——${bonusTxt}`);
        OP.log.push('战斗结束。你仍在这片箱庭里——继续搜索，或者带着收获撤离。');
        renderOperation();
      }, 900);
      return;
    }
  }
  combatAutoStop();
  victoryRewards(true);
  gainXp(e.xp||0);
  updateHUD();
  const winNode = CB.winNode;
  CB=null;
  setTimeout(()=>gotoNode(winNode), 900);
}
function victoryRewards(withLoot){
  const e = ENEMIES[CB.id];
  S.gold += Math.round((e.gold||0)*2.5);
  gainXp(Math.round((e.xp||0)*2.5));
  S.echoes = (S.echoes||0)+1; saveSave(); combatLog('残响凝结——回响碎片 +1（击杀奖励）','ok');
  if(hasTagFx('echo')){ S.echoes+=2; saveSave(); combatLog('【词条·回响】残响共鸣——回响碎片再 +2！','ok'); }
  if(S.flag._allyGold){ S.gold += S.flag._allyGold; combatLog('凝光的琼玑阁为你拉来一笔赏金：金币 +'+S.flag._allyGold+'。','ally'); }
  if(e.reward){ combatLog(e.reward,'ok'); S.gold+=8; }
  if(rand(100)<30){ S.fate=(S.fate||0)+1; combatLog('以战养战，气运翻涌——命运点 +1！','gold'); }
  // 天赋成长/回复
  if(S.talents.includes('growth')){
    const keys=['str','agi','int','cha','con','per'];
    const k=keys[rand(keys.length)];
    S.stats[k]++; combatLog(`「无限成长」发动！${k} +1（当前 ${S.stats[k]}）`, 'ok');
  }
  if(S.talents.includes('dragon')){ S.hp=Math.min(S.maxHp,S.hp+5); combatLog(`「龙裔血脉」龙血自愈 +5。`, 'ok'); }
  if(S.talents.includes('body')){
    S.hp=Math.min(S.maxHp,S.hp+15); combatLog(`「纯阳之体」阳气灌顶，回复 15 点生命。`, 'ok');
  }
  updateHUD();
  if(!withLoot) return;
  const gifts = [];
  if(!S.items.includes('potion') && rand(100)<75) { S.items.push('potion'); gifts.push('回响药剂'); }
  if(rand(100)<65) { S.items.push('coin'); gifts.push('命运币'); }
  if(rand(100)<25){ const _own=S.tagBag||[]; const _miss=TAG_POOL.map(t=>t.id).filter(id=>!_own.includes(id)); if(_miss.length){ const _t=_miss[rand(_miss.length)]; S.tagBag.push(_t); gifts.push(tagById(_t).n); } }
  if(gifts.length){ combatLog(`战利品：${gifts.join('、')}`, 'ok'); updateHUD(); }
}

function worldTreasure(w){ return WORLD_TREASURE[w.id] || []; }
function drawTreasure(w){
  const pool = worldTreasure(w);
  if(!pool.length) return {n:'一枚残响', kind:'gold', min:5, max:12};
  return pool[rand(pool.length)];
}
function grantTreasure(t, w){
  /* 按特色产物类型发奖，已拥有则折算金币 */
  const wName = w? '（'+w.name+'）' : '';
  if(t.kind==='gold'){ const g = t.min + rand(t.max-t.min+1); S.gold += g; return `获得 ${t.n}${wName} —— 金币 +${g}`; }
  if(t.kind==='fate'){ const f = t.min + rand((t.max||t.min)-(t.min)+1); S.fate += f; return `获得 ${t.n}${wName} —— 命运点 +${f}`; }
  if(t.kind==='echo'){ const e = t.min + rand((t.max||t.min)-(t.min)+1); S.echoes += e; return `获得 ${t.n}${wName} —— 回响碎片 +${e}`; }
  if(t.kind==='item'){
    const it = itemById(t.id);
    if(S.items.includes(t.id)){ const g = 12 + rand(8); S.gold += g; return `「${it? it.name : t.n}」已拥有，折换金币 +${g}`; }
    S.items.push(t.id); return `获得 ${t.n}${wName} —— 「${it? it.name : t.n}」已收入背包`;
  }
  if(t.kind==='skill'){
    const sk = skillById(t.id);
    if(S.skillPool.includes(t.id) || S.skills.includes(t.id)){ const g = 14 + rand(10); S.gold += g; return `「${sk? sk.name : t.n}」已习得，折换金币 +${g}`; }
    S.skillPool.push(t.id); return `获得 ${t.n}${wName} —— 习得技能「${sk? sk.name : t.n}」（可在角色面板更换携带）`;
  }
  const g = t.min + rand((t.max||t.min)-t.min+1); S.gold += g; return `获得 ${t.n} —— 金币 +${g}`;
}

function wsTraitOf(tag){
  if(!tag) return null;
  const g='善义和诚谦承醒悟', b='战强夺救闯劫武雷盾', w='巧谋潜析演棋联换付稳拓';
  if(g.indexOf(tag)>=0) return 'good';
  if(b.indexOf(tag)>=0) return 'brave';
  if(w.indexOf(tag)>=0) return 'wise';
  if('莽狂赌偷盗猎捞易'.indexOf(tag)>=0) return 'wild';
  return null;
}
function wsResetVars(wid){ if(!S.wsVars) S.wsVars={}; S.wsVars[wid]={good:0,brave:0,wise:0,wild:0,last:''}; }
function wsTopTrait(wid){
  const v=(S.wsVars&&S.wsVars[wid])||{good:0,brave:0,wise:0,wild:0};
  let top='good', mx=v.good;
  [['brave',v.brave],['wise',v.wise],['wild',v.wild]].forEach(function(e){
    if(e[1]>mx){ top=e[0]; mx=e[1]; }
  });
  return mx>0?top:null;
}
function wsCausalLine(wid, idx){
  const top=wsTopTrait(wid); if(!top) return '';
  const s={
    good:'你以善待人，名声像风一样先你一步传开——有人为你铺路，也有人记住了你的脸。',
    brave:'你的勇名在前方炸响，守卫们握紧了武器——敬你是条硬汉，也防着你三分。',
    wise:'你的筹谋无声落子，暗处的眼睛已经开始留意你的一举一动。',
    wild:'你手快心野，巡卫与商人已经盯上了你这张不守规矩的新面孔。'
  };
  const s2={
    good:'这一路，你始终没忘为何而来——人心所向，比什么都珍贵。',
    brave:'到了这一步，你已经没了退路，也从不打算退——刀在手，心就定。',
    wise:'真相越近，你越冷静——每一步都踩在算计好的位置上。',
    wild:'局势越是危险，你越是兴奋——这就是你要的冒险。'
  };
  return (idx<=1?s:s2)[top];
}
function renderWorldStory(wid){
  S.nodeId = 'worldstory:'+wid;
  updateHUD();
  const w = worldById(wid) || WORLDS[0];
  const st = WORLD_STORIES[wid];
  if(!st) return renderWorldIntro(wid);
  if(!S.worldStory) S.worldStory = {};
  const idx = S.worldStory[wid] || 0;
  if(idx===0) wsResetVars(wid);
  const step = st.steps[idx];
  const v = $('view-worlds');
  const optsHtml = step.opts.map((o,i)=>
    `<div class="choice" id="wso-${i}"><span class="c-tag">【${esc(o.tag||'选择')}】</span>${esc(o.text)}</div>`
  ).join('');
  const msg = S.lastWsMsg || '';
  const causal = (idx>0 && idx<st.steps.length-1) ? wsCausalLine(wid, idx) : '';
  const vv = (S.wsVars&&S.wsVars[wid])||{good:0,brave:0,wise:0,wild:0};
  const bar = '善'+'▮'.repeat(Math.min(3,vv.good))+'·勇'+'▮'.repeat(Math.min(3,vv.brave))+'·谋'+'▮'.repeat(Math.min(3,vv.wise))+'·狂'+'▮'.repeat(Math.min(3,vv.wild));
  v.innerHTML = `
    <div class="panel">
      <div class="scene-chap">${esc(st.name)} · 世界剧情（${esc(st.src||'')}）</div>
      <div class="scene-title">${esc(step.t)}</div>
      <div class="story">${esc(step.text)}${causal?'\n\n——'+esc(causal):''}</div>
      ${msg?`<div class="notice" style="color:#ffd777">${esc(msg)}</div>`:''}
      <div class="choices">${optsHtml}</div>
      <div class="hint" style="color:#889;margin-top:10px">第 ${idx+1}/${st.steps.length} 幕 ｜ 倾向：${bar} ｜ 判定基于属性（属性×2+1d100 对比 DC），你的每一个选择都会影响最终结局 ｜ 已完成：${(S.storyDone||[]).indexOf(wid)>=0?'是':'否'}</div>
    </div>`;
  showView('worlds');
  $('view').scrollTop=0; window.scrollTo({top:0});
  step.opts.forEach((o,i)=>{ const b=$('wso-'+i); if(b) b.onclick=()=>wsChoose(wid,i); });
}
function wsChoose(wid, i){
  const st = WORLD_STORIES[wid]; if(!st) return;
  if(!S.worldStory) S.worldStory = {};
  const idx = S.worldStory[wid] || 0;
  const step = st.steps[Math.min(idx, st.steps.length-1)];
  const opt = step.opts[i]; if(!opt) return;
  let msg = opt.log || '你做出了选择。';
  const _voice = voiceById(S.voice);
  // 倾向累积
  const tr = opt.trait || wsTraitOf(opt.tag);
  if(tr){
    if(!S.wsVars) S.wsVars={};
    if(!S.wsVars[wid]) S.wsVars[wid]={good:0,brave:0,wise:0,wild:0,last:''};
    S.wsVars[wid][tr]+=1; S.wsVars[wid].last=tr;
    if(_voice && _voice.trait===tr){ S.wsVars[wid][tr]+=1; msg += '\n【'+_voice.q+'】推了你一把：'+({good:'善',brave:'勇',wise:'谋',wild:'狂'})[tr]+' 再 +1'; }
    msg += '（剧情倾向：'+({good:'善',brave:'勇',wise:'谋',wild:'狂'})[tr]+' +1）';
  }
  if(opt.check){
    let s = S.stats[opt.check.stat]||0; let dc = opt.check.dc;
    const roll = Math.floor(Math.random()*100)+1;
    if(_voice && _voice.attr===opt.check.stat){ s += _voice.vbonus||0; msg += '\n【'+_voice.q+'】'+_voice.line+'（检定加成 +'+(_voice.vbonus||0)+'）'; }
    if(_voice && _voice.critN) dc = Math.max(1, dc - _voice.critN);
    const pass = (s*2 + roll) >= dc;
    const branch = pass ? opt.check.ok : opt.check.bad;
    if(branch.fx) wsApplyFx(wid, branch.fx);
    msg = (pass?'【判定通过】':'【判定失败】') + '（'+opt.check.stat.toUpperCase()+' '+s+' · 检定 '+roll+' / DC '+dc+'）' + (branch.log||opt.log||'') + (tr?('（倾向：'+({good:'善',brave:'勇',wise:'谋',wild:'狂'})[tr]+' +1）'):'');
  }
  if(opt.fx) wsApplyFx(wid, opt.fx);
  if(opt.done){ S.lastWsMsg = msg; finishWorldStory(wid, opt.done); return; }
  const nidx = (opt.next!=null) ? opt.next : idx+1;
  if(nidx >= st.steps.length){ S.lastWsMsg = msg; finishWorldStory(wid, '剧情落幕，你带着这一路的收获继续前行。'); return; }
  S.worldStory[wid] = nidx;
  S.lastWsMsg = msg;
  renderWorldStory(wid);
}
function wsApplyFx(wid, fx){
  if(!fx) return;
  fx.forEach(function(e){
    const t = e[0], n = e[1];
    if(t==='gold'){ S.gold = Math.max(0, S.gold + n); }
    else if(t==='xp'){ gainXp(n); }
    else if(t==='fate'){ S.fate = Math.max(0, S.fate + n); }
    else if(t==='echo'){ S.echoes = Math.max(0, S.echoes + n); }
    else if(t==='hp'){ S.hp = Math.max(1, Math.min(S.maxHp, S.hp + n)); }
    else if(t==='mp'){ S.mp = Math.max(0, Math.min(S.maxMp, S.mp + n)); }
  });
}
function finishWorldStory(wid, msg){
  const w = worldById(wid) || WORLDS[0];
  if(!S.storyDone) S.storyDone = [];
  if(S.storyDone.indexOf(wid)<0) S.storyDone.push(wid);
  const bonusGold = 60 + (w.diff||1)*40;
  const bonusXp = 60 + (w.diff||1)*30;
  S.gold += bonusGold; gainXp(bonusXp);
  S.fate = (S.fate||0)+1;
  S.echoes = (S.echoes||0)+2; saveSave();
  const _tf = grantBreakthroughTag()||'';
  const _vFin = voiceById(S.voice);
  if(_vFin && _vFin.echoFx){ S.echoes = (S.echoes||0) + _vFin.echoFx; }
  // 多结局结算：按倾向匹配
  const st = WORLD_STORIES[wid];
  const top = wsTopTrait(wid);
  let endTitle='幕落', endText=msg, endNote='';
  if(st && st.endings && top && st.endings[top]){
    const eg = st.endings[top];
    endTitle = eg.t; endText = eg.text;
    if(eg.fx){ wsApplyFx(wid, eg.fx); }
    endNote = '结局·'+({good:'善',brave:'勇',wise:'谋',wild:'狂'})[top]+' ｜ 剧情奖励已结算';
  }
  function wsSunnyLine(tp){
    const L = {
      good:'【光之回响】旅程的终点是光。你回望来路——每一份善意都开了花，伙伴们笑着站在你身边。这个故事，是暖的。',
      brave:'【光之回响】风还在吹，路还在脚下。你握紧剑，朝下一个世界迈步——热血不凉，冒险不止。',
      wise:'【光之回响】迷雾散尽，前路清明。你用智慧接住了命运的骰子——原来答案，一直都在你心里。',
      wild:'【光之回响】没有谁规定王座的样子。你以自己的方式赢下这一局，天地大笑，与你击掌——做自己，最畅快。'
    };
    return L[tp] || '【光之回响】故事结束，但冒险还长。每一次选择，都让回响之城的光，更亮一分。';
  }
  const cleared = (S.worldsCleared||[]).indexOf(wid)>=0;
  const v = $('view-worlds');
  v.innerHTML = `
    <div class="panel">
      <div class="scene-chap">${esc(w.name)} · 剧情完结</div>
      <div class="scene-title">${esc(endTitle)}</div>
      <div class="story">${esc(endText)}</div>
      <div class="story" style="color:var(--gold);margin-top:8px">${wsSunnyLine(top)}</div>
      <div class="notice" style="color:#7fe0d0">${endNote?esc(endNote):''} ｜ 基础奖励：${bonusGold} 金币 · ${bonusXp} 经验 · 命运点 +1 · 回响碎片 +2 · 觉醒词条：${_tf}</div>
      <div class="hint" style="color:#889;margin-top:10px">该世界${cleared?'已通关':'尚未通关'} ｜ 换了选择，结局也会变——重游可再刷不同结局</div>
      <div class="choices">
        <div class="choice" id="wse-back"><span class="c-tag">【返回】</span>回到世界介绍</div>
        <div class="choice" id="wse-enter"><span class="c-tag">【进入】</span>选择外挂 · 进入该世界</div>
      </div>
    </div>`;
  showView('worlds');
  $('view').scrollTop=0; window.scrollTo({top:0});
  $('wse-back').onclick=function(){ renderWorldIntro(wid); };
  $('wse-enter').onclick=function(){ renderBooster(wid); };
  saveSave();
}

}
function aiSaveSet(){
  const ep=$('ai-ep').value.trim(), key=$('ai-key').value.trim(), model=$('ai-model').value.trim();
  if(ep||key){ S.aiApi={endpoint:ep,key:key,model:model||'gpt-4o-mini'}; }
  else { S.aiApi=null; }
  saveSave(); renderAI();
}
function aiWorldPick(){
  const box=$('ai-scenepick');
  const list=Object.keys(AI_META).map(k=>{
    const m=AI_META[k];
    return '<div class="ai-witem" onclick="aiStart('+JSON.stringify(k)+')"><b>'+esc(m.name)+'</b><span>'+esc(m.style)+' · '+(S.aiCleared&&S.aiCleared.indexOf(k)>=0?'已通关':'未通关')+'</span></div>';
  }).join('');
  box.innerHTML='<h3>选择叙事场景（21 个）</h3><div class="ai-wlist">'+list+'</div><button onclick="aiWorldPickHide()">收起</button>';

function aiWorldPickHide(){ $('ai-scenepick').style.display='none'; }
function aiReset(){
  S.ai.on=false; S._returnNode='hub'; renderHub();
}
function aiQuick(cmd){ aiSubmitStr(cmd); }
async function aiSubmit(){ const el=$('ai-in'); aiSubmitStr(el.value); }
async function aiSubmitStr(raw){
  if(!S.ai.on) return;
  const text=String(raw||'').trim(); if(!text) return;
  S.ai.turns=(S.ai.turns||0)+1;
  S.ai.log.push({role:'me', text:text});
  const api=S.aiApi;
  const useLLM = !!(api && api.key && api.endpoint);
  if(useLLM){
    S.ai.log.push({role:'ai', text:'（AI 叙事思考中……）'});
    renderAI();
    try{
      const t=await aiLLM(text);
      S.ai.log[S.ai.log.length-1]={role:'ai', text:t};
    }catch(e){
      S.ai.log[S.ai.log.length-1]={role:'ai', text:'（远程 AI 连接失败，已切换本地引擎）'};
      const r=aiLocal(text);
      if(r&&r.text) S.ai.log.push({role:'ai', text:r.text});
      aiApply(r);
    }
  }else{
    const r=aiLocal(text);
    if(r&&r.text) S.ai.log.push({role:'ai', text:r.text});
    aiApply(r);
  }
  autoSave(); updateHUD(); renderAI();
  if(S.hp<=0){ S.hp=0; renderDeath(); }
}
function aiLLMPrompt(){
  const meta=AI_META[S.ai.world]||AI_META.free;
  const w = S.ai.world==='free'?null:worldById(S.ai.world);
  let sp='你是《赢赢赢，骰子中间窜窜窜之文游大冒险》的 AI 叙事主持（DM），用简体中文、第二人称（你）写 3-5 句沉浸式叙事推进剧情，结尾给 1-3 个建议动作（用【】括起来）。';
  sp+='当前场景：'+meta.name+'（'+meta.style+'），叙事阶段：'+meta.stages[Math.min(S.ai.stage||0,2)]+'。';
  if(w){ sp+='场景特色：'+w.special+'；可能遭遇的敌人：'+(ENEMIES[w.enemy]?ENEMIES[w.enemy].name:w.enemy)+'；当地特产：'+w.loot+'；剧情背景：'+(WORLD_STORIES[w.id]?WORLD_STORIES[w.id].intro:'')+'。'; }
  sp+='玩家状态：生命 '+S.hp+'/'+S.maxHp+'、法力 '+S.mp+'/'+S.maxMp+'、金币 '+S.gold+'、命运点 '+S.fate+'、属性 '+JSON.stringify(S.stats)+'。';
  sp+='规则：接受玩家任何合理指令（行动/说话/剧情/观察），有起承转合；不要替玩家做决定；危险与收益并存；三阶段推进后给本场景一个结局。';
  return sp;
}
async function aiLLM(raw){
  const api=S.aiApi;
  const url=(api.endpoint||'').replace(/\/+$/,'')+'/chat/completions';
  const hist=(S.ai.log||[]).slice(-24).map(l=>({role:l.role==='me'?'user':'assistant', content:l.text}));
  const res=await fetch(url,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+(api.key||'')},
    body:JSON.stringify({model:api.model||'gpt-4o-mini', messages:[{role:'system',content:aiLLMPrompt()}].concat(hist)})
  });
  if(!res.ok) throw new Error('HTTP '+res.status);
  const j=await res.json();
  const c=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
  return c||'（AI 没有回应，试试换个说法。）';
}
function aiApply(r){
  if(!r) return;
  if(r.gold) S.gold=Math.max(0,S.gold+r.gold);
  if(r.xp) gainXp(r.xp);
  if(r.fate) S.fate=(S.fate||0)+r.fate;
  if(r.hp) S.hp=Math.min(S.maxHp,S.hp+r.hp);
  if(r.mp) S.mp=Math.min(S.maxMp,S.mp+r.mp);
  if(r.dmg) S.hp=Math.max(0,S.hp-r.dmg);
  if(r.progress) S.ai.stage=Math.min(2,(S.ai.stage||0)+r.progress);
  if(r.stolen) S.ai.mem.stolen=true;
  if(r.saved) S.ai.mem.saved=true;
  if(r.item) S.ai.mem.items=(S.ai.mem.items||0)+r.item;
  if(r.fight) S.ai.mem.fights=(S.ai.mem.fights||0)+1;
  if(r.win) S.ai.mem.wins=(S.ai.mem.wins||0)+1;
  if(r.clear && S.aiCleared.indexOf(S.ai.world)<0){ S.aiCleared.push(S.ai.world); S.fate=(S.fate||0)+r.fate||0; }
}
function aiIntent(raw){
  const m=String(raw||'').match(/^(行动|do|说|say|剧情|story|看|see)\s*[:：]?\s*(.*)$/i);
  if(m){ const pre=m[1].toLowerCase(), t=m[2];
    if(pre==='行动'||pre==='do') return {type:'do',t};
    if(pre==='说'||pre==='say') return {type:'say',t};
    if(pre==='剧情'||pre==='story') return {type:'story',t};
    if(pre==='看'||pre==='see') return {type:'see',t};
  }
  const t=String(raw||'');
  if(/(逃|跑|撤|躲|溜|离开|撤离|撤退)/.test(t)) return {type:'flee',t};
  if(/(偷|潜|偷袭|暗杀|窃|摸走)/.test(t)) return {type:'steal',t};
  if(/(攻击|打|杀|砍|战|战斗|揍|猎杀|放技能|释放)/.test(t)) return {type:'attack',t};
  if(/(去|走向|进入|探索|前进|搜索|前往|闯|推门|开门|迈步|深入)/.test(t)) return {type:'move',t};
  if(/(看|观察|检查|查看|调查|环顾|望|审视|打量|搜索|侦测)/.test(t)) return {type:'look',t};
  if(/(问|交谈|询问|对话|和|跟|找|打听|聊聊|求|拜见|喊)/.test(t) && !/(杀|打|抢|偷)/.test(t)) return {type:'talk',t};
  if(/(捡|拿|搜刮|拾取|取走|摸尸|搜身|收刮|搬)/.test(t)) return {type:'take',t};
  if(/(喝|吃|用|使用|装备|施展|念咒|喝药|服药|拿药)/.test(t)) return {type:'use',t};
  return {type:'do',t};
}
function aiRoll(stat,dc){
  const st=S.stats[stat]||0;
  const d=Math.floor(Math.random()*100)+1;
  const total=st*2+d;
  const grade=total>=dc+30?'great':(total>=dc?'pass':(total>=dc-20?'fail':'fumble'));
  return {total:d, grade};
}
function aiLocal(raw){
  const meta=AI_META[S.ai.world]||AI_META.free;
  const w=S.ai.world==='free'?null:worldById(S.ai.world);
  const stage=Math.min(S.ai.stage||0,2);
  const stageName=meta.stages[stage];
  const enemy=w?w.enemy:'未知存在';
  const loot=w?w.loot:'未知宝物';
  const special=w?w.special:'无限可能';
  const mem=S.ai.mem||{};
  const rnd=a=>a[Math.floor(Math.random()*a.length)];
  const it=aiIntent(raw);
  if(mem.stolen && Math.random()<0.15 && (it.type==='move'||it.type==='look'||it.type==='do'||it.type==='take')){
    return {text:'你刚动手，一声唿哨炸开'+rnd(['寂静','喧闹','暮色'])+'——「站住！就是那个偷了货的小子！」守卫竟一眼认出了你。偷过的东西，迟早是要还的。',dmg:6,xp:4};
  }
  if(mem.saved && Math.random()<0.12 && (it.type==='move'||it.type==='do'||it.type==='look')){
    return {text:'一个身影从暗处闪出，把一包东西塞进你手里：「那天你救了我一命，这个你拿着。」——善缘结善果。',gold:8,xp:3,hp:10,saved:false};
  }
  switch(it.type){
    case 'move': return aiL_move(meta,w,stage,stageName,enemy,special,rnd,it.t);
    case 'look': return aiL_look(meta,w,stage,stageName,loot,enemy,rnd,it.t);
    case 'talk': return aiL_talk(meta,w,stage,stageName,special,rnd,it.t);
    case 'attack': return aiL_attack(meta,w,stage,stageName,enemy,rnd,it.t);
    case 'steal': return aiL_steal(meta,w,stage,stageName,rnd,it.t);
    case 'take': return aiL_take(meta,w,stage,stageName,loot,rnd,it.t);
    case 'use': return aiL_use(meta,w,stage,stageName,rnd,it.t);
    case 'flee': return aiL_flee(meta,w,stage,stageName,rnd,it.t);
    case 'say': return aiL_say(meta,w,stage,stageName,special,rnd,it.t);
    case 'story': case 'see': case 'do':
    default: return aiL_do(meta,w,stage,stageName,enemy,loot,special,rnd,it.t);
  }
}
function aiL_move(meta,w,stage,stageName,enemy,special,rnd,t){
  const r=aiRoll('per',60);
  if(stage>=2 && r.grade!=='fumble'){
    return aiFinish(meta,w);
  }
  if(r.grade==='great'||r.grade==='pass'){
    if(Math.random()<0.6){
      const next=Math.min(2,stage+1);
      const txt=r.grade==='great'
        ? rnd(['你循着'+meta.mood[stage]+'一路向前，拨开迷雾，前方豁然开朗——已踏入「'+meta.stages[next]+'」。','脚下'+meta.mood[stage]+'，你走得极稳，一条前人留下的路标把你引向「'+meta.stages[next]+'」。'])
        : rnd(['你谨慎前行，穿过重重障碍，抵达了「'+meta.stages[next]+'」。','绕过了几处险地，你终于摸到了「'+meta.stages[next]+'」的入口。']);
      return {text:txt, progress:1, xp:6, gold:4};
    }
    return {text:rnd(['你稳步前行，'+meta.mood[stage]+'中一切如常。','你向前推进了一段路，'+rnd(['发现了新的线索','听见了远处'+enemy+'的动静','脚印通向更深处'])+'。']), xp:3};
  }
  return {text:rnd(['你冒进了一步，脚下'+rnd(['一滑','一软','一陷'])+'，'+meta.mood[stage]+'中传来危险的声响，你只得退回。','前路被'+rnd(['落石','荆棘','机关'])+'挡住，你撞了个灰头土脸。']), dmg:4, xp:1};
}
function aiL_look(meta,w,stage,stageName,loot,enemy,rnd,t){
  const r=aiRoll('per',55);
  if(r.grade==='great'||r.grade==='pass'){
    const finds=rnd([
      '你凑近细看，在'+rnd(['墙缝','石板下','残骸中'])+'发现一包'+loot+'！',
      '你的目光扫过'+stageName+'，捕捉到'+enemy+'留下的'+rnd(['爪痕','足迹','标记'])+'，循迹必有所获。',
      '你敏锐地察觉到'+rnd(['一处暗门','一道机关','一个隐秘夹层'])+'——这正是'+special+'的线索。'
    ]);
    return {text:finds+'（感知检定成功）', gold:6, xp:5, hp:6};
  }
  return {text:rnd(['你看了半天，'+meta.mood[stage]+'里什么异常都没有。','视线被'+rnd(['雾气','阴影','乱石'])+'挡住，你看不真切。']), xp:1};
}
function aiL_talk(meta,w,stage,stageName,special,rnd,t){
  const r=aiRoll('cha',55);
  if(r.grade==='great'||r.grade==='pass'){
    const info=r.grade==='great'
      ? rnd(['对方被你的人格魅力折服，压低声音说了个惊天秘密：'+special+'就藏在「'+stageName+'」深处。','你三言两语套出了关键情报，还收获一份厚礼。'])
      : rnd(['对方半信半疑，但还是透露了些有用的消息。','聊了几句，你知道了这里最近不太平——有'+rnd(['陌生人','怪事','宝贝'])+'出没。']);
    return {text:info, gold:5, xp:4};
  }
  return {text:rnd(['对方警惕地打量你，什么也不肯说。','话不投机，对方甩手就走，你只碰了一鼻子灰。']), dmg:1};
}
function aiL_attack(meta,w,stage,stageName,enemy,rnd,t){
  const r=aiRoll('str',65);
  if(r.grade==='great'||r.grade==='pass'){
    const txt=r.grade==='great'
      ? rnd(['你一击制敌，'+enemy+'轰然倒地，爆出'+(stage>=2?'大把财宝':'一堆战利品')+'！','你的出手快若惊雷，'+enemy+'连惨嚎都没来得及发出。'])
      : rnd(['你与'+enemy+'缠斗数合，最终将它击退，捡到了战利品。','一番苦战，'+enemy+'倒下了，你也微微喘着气。']);
    return {text:txt, gold:9, xp:9, win:true, fight:true, hp:stage>=2? -4:0};
  }
  if(r.grade==='fail'){
    return {text:rnd([''+enemy+'反手一击，你躲闪不及，被狠狠撂倒。','你贸然出手，'+enemy+'早有防备，你吃了大亏。']), dmg:8, fight:true};
  }
  return {text:rnd(['你刚举起手，'+enemy+'先发制人，把你按在地上——附近还有人虎视眈眈，此地不宜久留。','对手太强，你被打得连连后退，差点栽进'+meta.mood[stage]+'里。']), dmg:14, fight:true};
}
function aiL_steal(meta,w,stage,stageName,rnd,t){

  }
  return {text:rnd(['你的手刚伸出去，就被当场抓住！「好你个贼！」你被臭骂一顿，赔了点钱。','偷鸡不成蚀把米——你被抓了个现行，狼狈逃窜。']), gold:-6, dmg:5, stolen:true};

function aiFinish(meta,w){
  const first=(S.aiCleared||[]).indexOf(S.ai.world)<0;
  let text='你一路走到了「'+meta.stages[2]+'」的尽头。';
  if(w){ text+=' '+w.special+'在这一刻彻底属于你——'+w.name+'的传说里，刻下了你的名字。'; }
  else { text+=' 梦境归于平静，但你知道，故事才刚刚开始。'; }
  text+= first?' 你已走完本场景的主线叙事，命运点 +2。':'（本场景你早已通关，仍可自由探索。）';
  return {text:text, clear:true, fate:2, xp:20, gold:15};
}

  const evHtml = sv.event ? (
    '<div class="surv-ev"><div class="ev-name">⚡ '+esc(sv.event.name)+'</div><div class="ev-desc">'+esc(sv.event.desc)+'</div>'+
    sv.event.opts.map((o,idx)=>'<div class="surv-opt" id="sv-opt-'+idx+'">'+esc(o.text)+'</div>').join('')+'</div>'
  ) : '';

      ${evHtml}

}
function survStart(wid){
  S.surv={world:wid, day:1, stamina:SURV_LIM.stamina, food:6, mind:SURV_LIM.mind, depth:0, state:'alive', event:null};
  if(!S.wsVars) S.wsVars={};
  if(!S.wsVars[wid]) S.wsVars[wid]={good:0,brave:0,wise:0,wild:0,last:''};
  const w=worldById(wid);
  S.surv.intro = (w&&w.intro)?w.intro:('你踏入了'+w.name+'。活下去，就是一切。');
  renderSurvival(wid);
}
function survBack(){ const _w=S.surv?S.surv.world:(S._survBackWid||WORLDS[0].id); S.surv=null; renderWorldIntro(_w); }
function survAct(type){
  const sv=S.surv; if(!sv||sv.event) return;
  const w=worldById(sv.world)||WORLDS[0];
  const costs={explore:2, gather:1, fight:2, social:1, craft:1, rest:0};
  const cost=costs[type]||1;
  sv.stamina=Math.max(0,sv.stamina-Math.max(1,Math.floor(cost/2)));  // 体力消耗减半，探索更尽兴
  // 触发随机事件：行动类型加权 + 世界专属优先
  const pool = Math.random()<0.62 ? (WORLD_SURV[sv.world]||WORLD_SURV.free) : SURV_COMMON;
  let evt;
  if(type==='rest'){ evt=survRestEvent(); }
  else if(type==='fight'){ evt=survFightEvent(w); }
  else if(type==='explore' && sv.depth>=3 && Math.random()<0.8){ survDestiny(); return; }
  else if(type==='explore'){ evt=survExploreEvent(w); }
  else if(type==='gather'){ evt=survGatherEvent(w); }
  else if(type==='social'){ evt=survSocialEvent(w); }
  else if(type==='craft'){ evt=survCraftEvent(); }
  if(!evt) evt = pool[Math.floor(Math.random()*pool.length)];
  sv.event = evt;
  renderSurvival(sv.world);
}

function survDestiny(){
  const sv=S.surv;
  const w=worldById(sv.world);
  const top=wsTopTrait(sv.world);
  const ending=(WORLD_ENDINGS&&WORLD_ENDINGS[sv.world]&&top&&WORLD_ENDINGS[sv.world][top])||(WORLD_ENDINGS&&WORLD_ENDINGS[sv.world]&&WORLD_ENDINGS[sv.world].good);
  let txt='你终于走到了「'+w.name+'」的尽头。';
  if(ending&&ending.text) txt+=' '+ending.text;
  const first=(S.survCleared||[]).indexOf(sv.world)<0;
  if(first) S.survCleared.push(sv.world);
  S.fate=(S.fate||0)+(first?3:0);
  S.surv.state='cleared';
  S.surv.destinyTxt=txt;
  renderSurvival(sv.world);

function survChoose(idx){
  const sv=S.surv; const evt=sv.event; if(!evt) return;
  const o=evt.opts[idx]; if(!o) return;
  sv.event=null;
  const notes=[];
  if(o.trait){ const t=wsTraitOf(o.trait); if(t){ if(!S.wsVars[sv.world])S.wsVars[sv.world]={good:0,brave:0,wise:0,wild:0,last:''}; S.wsVars[sv.world][t]++; S.wsVars[sv.world].last=o.trait; notes.push('倾向·'+t+'+1'); } }
  let fx=o.fx||{};
  if(o.stat){
    const r=survRoll(o.stat, o.dc||60);
    if(r==='pass'||r==='great'){ fx=o.ok||{}; notes.push(r==='great'?'大成功':'成功'); }
    else { fx=o.bad||{}; notes.push(r==='fumble'?'大失败':'失败'); }
  }
  survApply(fx, notes);
  survNight();
}
function survRoll(stat, dc){
  const st=S.stats[stat]||0;
  const d=Math.floor(Math.random()*100)+1;
  const total=st*2+d;
  return total>=dc+30?'great':(total>=dc?'pass':(total>=dc-20?'fail':'fumble'));
}
function survApply(fx, notes){
  const sv=S.surv; if(!fx) return;
  if(fx.gold) S.gold=Math.max(0,S.gold+fx.gold);
  if(fx.xp) gainXp(fx.xp);
  if(fx.fate) S.fate=(S.fate||0)+fx.fate;
  if(fx.hp) S.hp=Math.min(S.maxHp,S.hp+fx.hp);
  if(fx.dmg){ S.hp=Math.max(0,S.hp-fx.dmg); notes.push('受伤 -'+fx.dmg); }
  if(fx.stamina) sv.stamina=Math.max(0,Math.min(SURV_LIM.stamina,sv.stamina+fx.stamina));
  if(fx.food) sv.food=Math.max(0,Math.min(SURV_LIM.food,sv.food+fx.food));
  if(fx.mind) sv.mind=Math.max(0,Math.min(SURV_LIM.mind,sv.mind+fx.mind));
  if(fx.depth) sv.depth=Math.max(0,Math.min(3,sv.depth+fx.depth));
  if(fx.item) S.items=(S.items||[]).concat(['神秘收获']);
  if(fx.stolen) sv.mem=(sv.mem||{}), sv.mem.stolen=true;
  if(notes.length) sv.lastNote=notes.join(' · ');
  if(S.hp<=0){ survDie(); }
}
function survNight(){
  const sv=S.surv;
  if(!sv||sv.state!=='alive') return;
  // 夜晚结算：扣饱食、体力微回
  sv.food=Math.max(0,sv.food-1);
  sv.stamina=Math.min(SURV_LIM.stamina, sv.stamina+1);
  if(sv.food<=0){ sv.lastNote=(sv.lastNote?sv.lastNote+' · ':'')+'饥肠辘辘——但异世界的风喂饱了你的意志，无碍。'; }
  if(sv.mind<=0){ sv.mind=1; sv.lastNote=(sv.lastNote?sv.lastNote+' · ':'')+'精神濒临极限——深呼吸，黎明总会来。'; }
  sv.day++;
  if(S.hp<=0){ survDie(); return; }
  renderSurvival(sv.world);
}
function survRetire(){
  const sv=S.surv; if(!sv) return;
  const days=Math.max(1,sv.day-1);
  const fate=Math.max(1,Math.floor(days/3));
  S.fate=(S.fate||0)+fate;
  if(!S.survBest) S.survBest={};
  S.survBest[sv.world]=Math.max(S.survBest[sv.world]||0, days);
  const oldW=sv.world;
  const txt='你在「'+(worldById(oldW)||{}).name+'」安稳度过了 '+days+' 天。归隐结算：命运点 +'+fate+'（可永久保留）。';
  S.surv=null;
  S._survBackWid=oldW;
  S._survMsg=txt;
  renderWorldIntro(oldW);
}
function survDie(){
  const sv=S.surv; if(!sv) return;
  const days=Math.max(1,sv.day-1);
  if(!S.survBest) S.survBest={};
  S.survBest[sv.world]=Math.max(S.survBest[sv.world]||0, days);
  S.gold=Math.floor(S.gold*0.8);
  const oldW=sv.world;
  S.surv=null;
  S._survBackWid=oldW;
  S._survMsg='你在「'+(worldById(oldW)||{}).name+'」坚持了 '+days+' 天，虽倒在异世界，金币却几乎全数护在怀中（仅失两成），回响碎片与生存纪录完整保留——死亡不是终点，是下一次轮回的开场。';
  renderWorldIntro(oldW);
}

function startOperation(worldId){
  const w = worldById(worldId) || WORLDS[0];
  // 出征补给：状态全满（每次进入世界状态恢复正常）
  S.hp = S.maxHp; S.mp = S.maxMp;
  if(hasBooster('cheat')){ S.hp = Math.min(S.maxHp, S.hp + Math.round(S.maxHp*0.3)); }
  updateHUD();
  const limit = 6 + w.diff*2;
  const log = [
    `—— 万界冒险 · ${w.name} ——`,
    `目标世界：${w.style}「${w.name}」`,
    '黑塔帮替你备好了出征补给：生命、法力全满。',
    '这个世界是一座敞开的箱庭——想搜几处搜几处，想搜多久搜多久。但搜得越深，世界越凶。',
    `探索上限 ${limit} 次：搜满即自动撤离，收获几乎全数保得住。`
  ];
  if(S.externals && S.externals.length){
    log.push('✨ 携带外挂：'+S.externals.map(id=>{const b=boosterById(id);return b?b.icon+b.name:id;}).join('、'));
  }
  if(w.intro) log.push(w.intro);
  log.push(w.search);
  OP = {
    phase:'explore', steps:0, hot:0, found:0, collected:[], tags:[], world:w,
    limit: limit, _san:100,
    log: log
  };
  if(hasBooster('word') && !OP.tags.includes('词条·丰收')) OP.tags.push('词条·丰收');
  // 词条工作台：已装备的「丰收/警觉/洞察」词条在本场探索生效
  equippedTagsList().forEach(t=>{
    if(t.fx==='gold' && !OP.tags.includes('词条·丰收')) OP.tags.push('词条·丰收');
    if(t.fx==='calm' && !OP.tags.includes('词条·警觉')) OP.tags.push('词条·警觉');
    if(t.fx==='insight' && !OP.tags.includes('词条·洞察')) OP.tags.push('词条·洞察');
  });
  S.nodeId='operation';
  updateHUD();
  renderOperation();
}
function opPhaseIndex(){
  if(OP.phase==='explore'||OP.phase==='combat') return 0;
  if(OP.phase==='withdraw'||OP.phase==='withdrawing') return 1;
  return 2;
}
function renderOperation(){

      ${OP.found>0? `<div class="op-treasure" style="color:var(--cyan)">🔍 已锁定残响线索 ×${OP.found}（撤离奖励加成）</div>`:''}
      ${OP.tags.length? `<div class="op-treasure" style="color:#d7a7ff;border-color:rgba(215,167,255,.35);background:rgba(90,50,140,.15)">🧬 临时词条：${OP.tags.join('、')}（本次探索内生效）</div>`:''}
      <div class="choices" id="op-choices">
        <div class="choice" id="op-search"><span class="c-tag">${danger?'【强制撤离】':'【搜索】'}</span>${danger? '立刻离开这个愤怒的世界' : '探索一处区域<span class="c-desc">随机：收获 / 遭遇 / 风险 · 剩 '+(OP.limit-OP.steps)+' 次</span>'}</div>
        ${!danger? `<div class="choice" id="op-withdraw"><span class="c-tag">【撤离】</span>带着收获离开<span class="c-desc">敏捷判定 · 结算本次收获</span></div>`:''}

  }
  v.innerHTML = `
    <div class="panel">
      <div class="scene-chap">箱庭探索 · ${esc(w.style)} · 第 ${S.run} 周目</div>
      <div class="scene-title">箱庭 · ${esc(w.name)}</div>
      <div class="scene-tagline">这个世界的碎片散落在各处——搜索，收获，或者被它咬一口。搜到极限还不撤？后果自负。</div>

  _bindOp('op-withdraw', ()=>opWithdraw());

function opExplore(){
  OP.steps++;
  OP.hot++;
  const w = OP.world;
  OP.log.push(`—— 探索 第 ${OP.steps}/${OP.limit} 处 ——`);
  // 词条流玩法：持有的临时词条会改写探索规则（词条即力量）
  const tagCalm = OP.tags.includes('词条·警觉');
  const tagInsight = OP.tags.includes('词条·洞察');
  // 随机结果：随警觉度（搜索次数）调整，搜得越深，遭遇与损失概率越高；「词条·警觉」可压制风险
  const r = rand(100);
  if(w.id==='guimi'){ OP._san = Math.max(0, OP._san - 4); if(OP._san<70 && !OP._loSanWarn){ OP._loSanWarn=true; OP.log.push('【诡秘之都】理智跌破 70——你开始“看见”雾里那些不该存在的东西。灵视开启：宝物更近，疯狂也更近。'); } }   // 「诡秘·灵视」
  const encRate = tagCalm ? Math.floor((24 + OP.hot*2)/2) : (24 + OP.hot*2);   // 遭遇战：24%→46%
  const trapRate = tagCalm ? Math.floor((6 + OP.hot)/2) : (6 + OP.hot);         // 损失陷阱：6%→16%
  const loSan = w.id==='guimi' && OP._san<70;
  if(r < encRate + (loSan?15:0)){
    if(w.id==='sekiro' && rand(100)<35){
      // 【苇名国 · 忍义潜杀】：阴影中一击毙命，不触发战斗
      const g = 10 + w.diff*4; S.gold += g; updateHUD();
      OP.log.push(`【忍义潜杀】你自阴影中现身，割喉而回——「${w.name}」的守卫甚至没来得及反应。战利品 +${g} 金币。`);
      renderOperation();
    } else { opExploreFight(); }
    return;
  }
  if(r < encRate + trapRate){ opExploreTrap(); return; }
  opExploreLoot(tagInsight);
}
function opExploreLoot(tagInsight){
  const w = OP.world;
  const loSan = w.id==='guimi' && OP._san!==undefined && OP._san<70;
  const r = tagInsight ? rand(70) : (loSan ? rand(85) : rand(100));  // 「词条·洞察」/诡秘「灵视」把收获区扩大
  let line='';
  if(w.id==='pet' && rand(100)<30){
    // 【精灵大陆 · 御兽收服】：遭遇野生灵兽，掷骰收服
    if(rand(100)<60){
      OP._pet = true;
      line = '一只雷光幼犬从草丛里探出脑袋，好奇地蹭了蹭你的裤脚——【御兽成功】它决定跟着你！本世界战斗开场，它会先助你一记雷光爪。';
      OP.collected.push('灵兽·雷光幼犬');
    } else {
      OP.log.push('你惊动了草丛里酣睡的野生灵兽——它龇牙朝你扑了过来！');
      updateHUD(); renderOperation(); opExploreFight(); return;
    }
  }
  if(r < (hasBooster('drop') ? 75 : 42)){
    // 特色世界产物（「无限掉落」外挂：收获概率从 42% 提到 62%）
    let t = drawTreasure(w);
    if(hasBooster('gold') && t.kind!=='item' && rand(100)<60){ const eqs = worldTreasure(w).filter(x=>x.kind==='item'); if(eqs.length) t = eqs[rand(eqs.length)]; } // 「金色传说」外挂：更易掉落装备
    line = grantTreasure(t, w);
    OP.collected.push(t.n);
    if(hasBooster('drop')){ S.gold += 8; updateHUD(); line += ' 【无限掉落】满地宝光，额外 +8 金币。'; }
    if(hasBooster('sign')){ S.gold += 12; gainXp(5); updateHUD(); line += ' 【签到系统】收获再 +12 金币、+5 经验。'; }
  } else if(r < 64){
    let g = 6 + rand(10) + w.diff*3;
    if(hasBooster('sign')){ g += 12; line = '【签到系统】触发签到奖励：'; }
    if(OP.tags.includes('词条·丰收')){ g = Math.floor(g*2); line = '【词条·丰收】发动：'; }
    S.gold += g; updateHUD();
    line = (line||'') + `你在一处废墟里翻出一些值钱的东西——金币 +${g}。`;
  } else if(r < 78){
    const it = rand(100)<50? 'potion' : 'mpotion';
    const itName = it==='potion'? '回响药剂' : '灵气药剂';
    if(S.items.includes(it)){ const g=8+rand(6); S.gold+=g; line = `你找到一瓶${itName}，但背包里已有——折换成金币 +${g}。`; }
    else { S.items.push(it); line = `你在一处隐蔽角落找到一瓶${itName}。`; }
  } else if(r < 90){
    if(rand(100)<60){ S.fate++; updateHUD(); line = `你在残骸中拾到一枚命运币——命运点 +1。`; }
    else if(tagInsight){ S.fate++; updateHUD(); line = `【词条·洞察】你一眼看破了此处的气运流向——命运点 +1。`; }
    else { const g=10+rand(10); S.gold+=g; updateHUD(); line = `你摸到一个装满金币的旧钱袋——金币 +${g}。`; }
  } else if(r < 96){
    // 词条流：随机获得一枚「词条」——存入词条工作台背包（死亡不掉落），可在角色面板【词条工作台】装备生效
    const tagPool = ['harvest','alert','insight','tough','rage'];
    const pick = tagPool[rand(tagPool.length)];
    const tg = tagById(pick);
    if(grantTag(pick, true)){
      line = `你触碰到一处规则裂缝，获得词条「${tg.n}」——${tg.desc}！已存入词条工作台背包（死亡不掉落）。`;
      if(OP.tags.indexOf(tg.n)<0 && (tg.fx==='gold'||tg.fx==='calm'||tg.fx==='insight')) OP.tags.push(tg.n);
    } else {
      const g=10+rand(8); S.gold+=g; updateHUD();
      line = `词条背包已满，规则裂缝化作金币洒落——金币 +${g}。`;
    }
  } else {
    // 残响线索：积累可提升撤离奖励（联动）
    OP.found += (S.talents.includes('mem')? 2 : 1);   // 「过目不忘」额外看破 1 条隐藏情报
    line = `你在这片区域的深处，锁定了一道「残响线索」——这是「${w.name}」独有的秘密，记下了。`;
    if(S.talents.includes('mem')) line += ' 「过目不忘」：你连残响的底层代码都读到了，额外记下 1 条情报！';
  }
  OP.log.push(line);
  updateHUD();
  renderOperation();
}

function opExploreTrap(){

function opWorldReward(){
  const w = OP.world;
  const first = !S.worldsCleared.includes(w.id);
  if(first) S.worldsCleared.push(w.id);
  const got=[];
  if(w.reward.type==='skill'){
    if(!S.skillPool.includes(w.reward.id)){ S.skillPool.push(w.reward.id); got.push(`技能「${w.reward.name}」`); }
  } else if(w.reward.type==='equip'){
    if(!S.items.includes(w.reward.id)){ S.items.push(w.reward.id); got.push(`装备「${w.reward.name}」`); }
  }
  if(w.mate && first && recruitTeammate(w.mate)){
    const m = teammateById(w.mate);
    got.push(`强力队友「${m? m.name : w.mate}」`);
  }
  return {got, first};
}

function opWithdraw(){
  OP.phase = 'withdrawing';
  renderOperation();

  const dc = 42 + Math.min(OP.steps*2, 20);
  const res = runCheck('agi', dc, '撤离 · 离开战区');
  setTimeout(()=>{
    OP.log.push(`【骰】撤离：1d100 = ${res.roll}${res.mod>0?'+'+res.mod:''} = ${res.total} ／ 难度 ${dc} ${res.success?'　判定成功':'　判定失败'}`);

function opForceWithdraw(){
  OP.phase = 'withdrawing';
  renderOperation();
  const w = OP.world;
  const dc = 58 + Math.min(OP.steps, 12);
  const res = runCheck('agi', dc, '强制撤离 · 强行突围');

    else { opWithdrawFail(true); }
    OP.phase = 'done';
    renderOperation();
  }, 700);
}
/* 撤离结算：主动 / 强制 */
function opWithdrawSuccess(forced){
  const w = OP.world;
  const rw = opWorldReward();
  let goldGain = 25 + (rw.first? w.base : 0);
  // 联动：搜得越深、残响线索越多，奖励越厚
  goldGain += OP.found * 4;
  // 副本流评分：探索深度 × 残响线索 → 副本评级，及时撤离吃满加成；强制撤离评级降档
  const rateMap = {S:15, A:10, B:5, C:0};
  const rating = OP.found>=3 ? 'S' : OP.steps>=Math.ceil(OP.limit*0.7) ? 'A' : OP.steps>=Math.ceil(OP.limit*0.4) ? 'B' : 'C';
  const finalRating = forced ? (rating==='S'?'A': rating==='A'?'B': rating==='B'?'C':'C') : rating;
  const rateBonus = rateMap[finalRating];
  goldGain += rateBonus;
  if(forced) goldGain = Math.floor(goldGain*0.92);  // 强制撤离也只折损一成，绝大多数战利品安全带回家
  if(hasBooster('gold')) goldGain = Math.floor(goldGain*1.4);  // 「金色传说」外挂：撤离奖励 +40%
  if(hasTagFx('loot')) goldGain = Math.floor(goldGain*1.5);      // 「词条·聚宝」：撤离奖励 +50%
  if(hasTagFx('omni')) goldGain = Math.floor(goldGain*1.15);      // 「词条·万般」：撤离奖励 +15%
  if(S.talents.includes('panel')) goldGain = Math.floor(goldGain*2);   // 「任务面板」：支线（跨世界任务）奖励翻倍
  if(hasBooster('sign')) goldGain += 20;                                // 「签到系统」：坚持撤离也有签到奖金
  S.gold += goldGain;
  gainXp(Math.round(10 + w.base*0.4));                                  // 撤离获得世界经验（受「升级加速」外挂 +50%）
  const got=[];
  if(w.id==='hollow' && S._hollowSoul){ const back=Math.floor(S._hollowSoul/2); S.gold+=back; S._hollowSoul=0; got.push('失落的魂 · 回魂 +'+back); }   // 【圣巢深渊 · 回魂】：魂归原位
  if(w.id==='guimi' && OP._san!==undefined && OP._san<100){ const ins=Math.floor((100-OP._san)/8); goldGain+=ins; S.gold+=ins; got.push('灵视情报 +'+ins+' 金'); }   // 【诡秘之都 · 理智结算】：用掉的理智换来的灵视情报
  if(rw.got.length) got.push(rw.got[0]);
  if(!S.items.includes('memcard') && rand(100)<60){ S.items.push('memcard'); got.push('记忆卡'); }
  if(rand(100)<45){ S.items.push('coin'); got.push('命运币'); }
  updateHUD();
  OP.log.push(w.loot);
  if(rw.first && rw.got.length) OP.log.push(`【首次完成「${w.name}」】获得 ${rw.got.join('、')}！`);
  let guoyunTxt='';
  if(w.guoyun){ const gy=guoyunDraw(); guoyunTxt='\n'+gy; OP.log.push(gy); }
  if(OP.found>0) OP.log.push(`残响线索 ${OP.found} 条，撤离奖励加成 ${OP.found*4} 金币。`);
  OP.log.push(`【副本评分】${finalRating} 级 —— 探索 ${OP.steps}/${OP.limit} 处，评级奖金 +${rateBonus} 金币。`);
  OP.log.push('你带着战利品扬长而去，身后传来世界残响的低鸣。');
  const collectedTxt = OP.collected.length? '\n【特色收获】'+OP.collected.join('、') : '';
  const clueTxt = OP.found? '\n【残响线索】'+OP.found+' 条 → 撤离奖励加成' : '';
  OP.result = {
    title:(forced? '仓皇突围 · ':'行动圆满 · ')+w.name, good:true,
    text:`【奖励】金币 +${goldGain}${got.length?' · 获得 '+got.join('、'):''}${collectedTxt}${clueTxt}\n${rw.first&&rw.got.length?'【世界奖励】'+rw.got.join('、')+' 已入库（可在「角色」面板查看/装备/更换携带）。\n':''}${forced?'（强制撤离——只折损一成，绝大多数收获已稳稳入袋）\n':''}${guoyunTxt}\n黑塔帮接头人满意地点头：“干净利落。下次还找你。”`
  };
}
function opWithdrawFail(forced){
  const w = OP.world;
  const lost = Math.floor(S.gold/4);
  S.gold -= lost;
  S.hp = Math.max(1, S.hp-3);
  updateHUD();
  OP.log.push('撤离途中遭遇世界残响截击——你丢下部分战利品，负伤冲出重围。');
  const lostTxt = OP.collected.length? ' · 你慌乱间丢下了「'+OP.collected.splice(0, Math.max(1, Math.ceil(OP.collected.length*0.5))).join('、')+'」' : '';
  OP.result = {
    title: forced? '仓皇逃出' : '惊险撤离', good:false,
    text:`【损失】金币 -${lost} · 生命 -3${lostTxt}\n${forced? '你几乎是被这个世界扔出来的——没能带走的东西，都化作了残响。':'“东西丢了可以再抢，人没了可就真没了。”接头人难得严肃起来。'}`
  };
}

    <div class="shard-bar">
      <span class="sb-label">真相碎片</span>

    </div>

      ${un? `<div class="lc-spots">探索点 ×${l.spots.filter(s=>!spotLocked(l,s)).length} ｜ ${S._locDone[l.id]? Object.keys(S._locDone[l.id]).length:0} 已探索</div>` : `<div class="lc-lock">🔒 ${esc(l.lockTxt)}</div>`}

      <div class="choice" id="map-save"><span class="c-tag">【存档】</span>存档 / 读档</div>

    </div></div>`;
  v.innerHTML = html;

    cd.onclick=()=>{
      const l=locById(cd.dataset.loc);

      enterLocation(l.id);
    };
  });
  $('map-char').onclick=()=>{ renderChar(); };
  $('map-hub').onclick=()=>{ renderHub(); };
  $('map-save').onclick=()=>{ renderSave(); };
  $('map-back').onclick=()=>{
    const back = S._returnNode;
    if(back==='loc'){ const l=locById(S._location); if(l){ renderLocation(l); return; } }
    if(NODES[back]) gotoNode(back);
    else renderTitle();
  };

}
function enterLocation(locId){
  const l = locById(locId); if(!l) return;
  S._location = locId;
  renderLocation(l);
}
function renderLocation(l){
  S._returnNode = S.nodeId;
  S.nodeId='loc';
  autoSave();
  updateHUD();
  const v=$('view-loc');
  let html = `<div class="panel">
    <div class="scene-chap">箱庭区域 · 第 ${S.run} 周目</div>
    <div class="scene-title">${l.icon} ${esc(l.name)}</div>
    <div class="scene-tagline">${esc(l.desc)}</div>
    <div class="spot-list">`;
  l.spots.forEach(s=>{
    const done = spotDone(l,s);
    const locked = spotLocked(l,s);
    html += `<div class="spot-item ${done?'done':''}" data-spot="${s.key||s.node||s.repeat}">
      <div class="sp-ic">${s.ic}</div>
      <div class="sp-main">
        <div class="sp-name">${esc(s.name)}</div>
        <div class="sp-desc">${done? '· 已探索 ·' : esc(s.desc)}</div>
      </div>
      ${locked? `<span class="sp-tag">🔒 ${esc(s.needTxt||'')}</span>` : (done? '<span class="sp-tag">✓</span>' : (s.once? '<span class="sp-tag">一次性</span>' : (s.repeat? '<span class="sp-tag">可反复</span>' : '<span class="sp-tag">探索</span>')))}
    </div>`;
  });
  html += `</div>
    <div class="choices">
      <div class="choice" id="loc-back"><span class="c-tag">【地图】</span>返回箱庭地图</div>
    </div></div>`;
  v.innerHTML = html;
  showView('loc');
  document.querySelectorAll('#view-loc .spot-item').forEach(el=>{
    el.onclick=()=>{
      const key = el.dataset.spot;
      const s = l.spots.find(x=>(x.key||x.node||x.repeat)===key);
      if(!s || spotDone(l,s) || spotLocked(l,s)) return;
      activateSpot(l,s);
    };
  });
  $('loc-back').onclick=()=>{ renderMap(); };
  $('view').scrollTop=0; window.scrollTo({top:0});
}
function activateSpot(l, s){
  if(s.node){ if(s.transit) S._pendingTransit = s.transit; gotoNode(s.node); return; }
  if(s.repeat==='loot'){ openLoot(l, s); return; }
  if(s.repeat==='event'){ renderRandomEvent(l); return; }
  if(s.repeat && ENEMIES[s.repeat]){
    S._locReturn = l.id;
    startCombat(s.repeat, '__loc__', 'death', {opMode:false});
    return;
  }
}
function applyEventReward(ev, success){
  const r = success? ev.succ : ev.fail;
  if(!r) return;
  if(r.gold) S.gold += r.gold;
  if(r.hp){ S.hp = Math.max(1, Math.min(S.maxHp, S.hp + r.hp)); }
  if(r.mp){ S.mp = Math.max(0, Math.min(S.maxMp, S.mp + r.mp)); }
  if(r.fate) S.fate += r.fate;
  if(r.xp) gainXp(r.xp);
  if(r.item) S.items.push(r.item);
  updateHUD();
}
function renderRandomEvent(l){
  const pool = EVENTS[l.id] || EVENTS.street;
  const ev = pool[rand(pool.length)];
  const v=$('view-scene');
  v.innerHTML = `<div class="panel">
    <div class="scene-chap">随机际遇 · ${esc(l.name)} · 第 ${S.run} 周目</div>
    <div class="scene-title">${ev.ic} ${esc(ev.name)}</div>
    <div class="dice-log" id="dice-log"></div>
    <div class="story">${esc(ev.desc)}</div>
    <div class="choices">
      <div class="choice" id="ev-go"><span class="c-tag">【${ev.check? '判定' : '行动'}】</span>${esc(ev.action||'上前试一试')}${ev.check? `<span class="c-desc">难度 ${ev.check.dc} · ${ev.check.stat==='str'?'力量':ev.check.stat==='agi'?'敏捷':ev.check.stat==='int'?'智力':ev.check.stat==='cha'?'魅力':ev.check.stat==='con'?'体质':'感知'}</span>`:''}</div>
      <div class="choice" id="ev-leave">绕开走人，不管闲事</div>
    </div></div>`;
  showView('scene');
  $('view').scrollTop=0; window.scrollTo({top:0});
  $('ev-leave').onclick=()=>{ renderLocation(locById(l.id)); };
  $('ev-go').onclick=()=>{
    if(!ev.check){ applyEventReward(ev, true); showEventResult(ev, ev.succ, l); return; }
    const res = runCheck(ev.check.stat, ev.check.dc, '际遇判定');
    diceLog(res);
    const success = res.success;
    applyEventReward(ev, success);
    showEventResult(ev, success? ev.succ : ev.fail, l);
  };
}
function showEventResult(ev, r, l){
  const v=$('view-scene');
  const panel = v.querySelector('.panel');
  const bar = document.createElement('div');
  bar.className='notice'; bar.style.marginTop='14px';
  bar.textContent = r.text;
  panel.appendChild(bar);
  const back = document.createElement('div');
  back.className='choice'; back.style.marginTop='10px'; back.id='ev-done';
  back.innerHTML = `<span class="c-tag">【返回】</span>回到「${esc(l.name)}」`;
  back.onclick=()=>{ renderLocation(locById(l.id)); };
  panel.appendChild(back);
}
function openLoot(l, s){
  const key = s.key || 'loot';
  if(!S._locDone) S._locDone={};
  if(!S._locDone[l.id]) S._locDone[l.id]=[];
  S._locDone[l.id].push(key);
  const roll = rand(100);
  const got=[];
  if(roll<35){ S.items.push('potion'); got.push('回响药剂'); }
  else if(roll<55){ S.items.push('mpotion'); got.push('灵气药剂'); }
  else if(roll<80){ S.gold += 15+rand(16); got.push('金币 ×'+(15+rand(16))); }
  else { const p=['coin','memcard','coin'][rand(3)]; S.items.push(p); got.push({coin:'命运币',memcard:'记忆卡'}[p]); }
  updateHUD();
  const v=$('view-scene');
  v.innerHTML = `<div class="panel">
    <div class="scene-chap">箱庭 · ${esc(l.name)}</div>
    <div class="scene-title">🎁 补给箱</div>
    <div class="story">你撬开了这只补给箱——\n\n【获得】${got.join('、')}\n\n（箱底刻着一行小字：“已经没有更多好东西了。别贪心，去别处看看吧。”）</div>
    <div class="choices"><div class="choice" id="loot-back"><span class="c-tag">【返回】</span>回到「${esc(l.name)}」</div></div></div>`;
  showView('scene');
  $('loot-back').onclick=()=>{ renderLocation(locById(l.id)); };
}


function renderChar(){
  S._returnNode = S.nodeId;
  S.nodeId='char';
  updateHUD();
  const v=$('view-char');
  const eb = equipBonus();
  const c = S.cls? classById(S.cls):null;
