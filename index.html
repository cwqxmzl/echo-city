  const statNames = {str:'力量',agi:'敏捷',int:'智力',cha:'魅力',con:'体质',per:'感知'};
  let html = `<div class="panel">
    <div class="scene-chap">角色 · 第 ${S.run} 周目</div>
    <div class="scene-title">${esc(c? c.name : '未定')} · Lv.${S.level}</div>
    <div class="scene-tagline">${esc(c? c.role : '')} ｜ 经验 ${S.xp}/${xpNeed(S.level)} ｜ 已完成世界 ${S.worldsCleared.length}/${WORLDS.length}</div>
    <div class="char-top">
      <div class="char-block"><div class="cb-k">生命</div><div class="cb-v">${S.hp}/${S.maxHp}</div></div>
      <div class="char-block"><div class="cb-k">法力</div><div class="cb-v">${S.mp}/${S.maxMp}</div></div>
      <div class="char-block"><div class="cb-k">金币</div><div class="cb-v">◎ ${S.gold}</div></div>
      <div class="char-block"><div class="cb-k">命运点</div><div class="cb-v">◆ ${S.fate}</div></div>
    </div>
    <div class="char-block" style="margin-top:10px">
      <div class="cb-k">经验值（升级全属性+1，可习得新技能）</div>
      <div class="xp-bar"><div class="xp-fill" style="width:${Math.min(100,S.xp/xpNeed(S.level)*100)}%"></div></div>
    </div>
    ${S.voice? (function(){const _v=voiceById(S.voice);return `<div class="voice-card"><div style="font-size:12px;color:var(--cyan);letter-spacing:.15em">内心声音 · ${esc(_v.name)}</div><div class="story" style="margin:6px 0 0">${esc(_v.line)}</div><div style="font-size:12px;color:#889;margin-top:4px">${esc(_v.desc)} ｜ 剧情判定与倾向会得到它的助力</div></div>`;})():''}
    <div class="stat-grid">
      ${stats.map(k=>`<div class="stat-cell">${statNames[k]}${eb[k]? ` <span style="color:var(--gold)">+${eb[k]}</span>`:''}<b>${statValue(k)}</b></div>`).join('')}
    </div>`;
  html += `<div style="font-size:12px;color:var(--cyan);letter-spacing:.15em;margin-top:16px">装备</div>
    <div class="equip-grid">
      ${['weapon','armor','trinket'].map(slot=>{
        const it = S.equip[slot]? itemById(S.equip[slot]):null;
        const slotName = {weapon:'武器',armor:'防具',trinket:'饰品'}[slot];
        return `<div class="equip-cell">${slotName}<b>${it? esc(it.name):'空'}</b>${it? `<div class="btn btn-small" data-uneq="${slot}">卸下</div>`:''}</div>`;
      }).join('')}
    </div>`;
  html += `<div class="mate-sec">
    <div class="ms-title">队伍 · 上阵 ${S.party.length}/3（点击队友切换上阵 / 后备）</div>
    <div class="mate-grid">`;
  TEAMMATES.forEach(m=>{
    const rec = S.roster.includes(m.id);
    const on = S.party.includes(m.id);
    if(rec){
      html += `<div class="mate-card${on?' m-on':''}">
        <div class="m-name">${esc(m.name)}</div>
        <div class="m-title">${esc(m.title)}</div>
        <div class="m-desc">${esc(m.desc)}</div>
        <div class="m-pass">被动：${esc(m.pass)}</div>
        <div class="btn btn-small m-btn ${on?'on':''}" data-mate="${m.id}">${on?'⚔ 上阵中 · 点击转后备':'后备 · 点击上阵'}</div>
      </div>`;
    } else {
      html += `<div class="mate-card m-lock">
        <div class="m-name">？？？</div>
        <div class="m-title">未结识</div>
        <div class="m-where">${esc(m.where)}</div>
      </div>`;
    }
  });
  html += `</div></div>`;
  html += `<div style="font-size:12px;color:var(--cyan);letter-spacing:.15em;margin-top:16px">技能库 · 携带 ${S.skills.length}/3（点击切换携带）</div>
    <div class="skill-edit">`;
  if(!S.skillPool.length) html += `<div class="notice">尚未习得任何技能。选择职业后获得初始技能，升级或完成世界可习得新技能。</div>`;
  S.skillPool.forEach(sid=>{
    const sk = skillById(sid); if(!sk) return;
    const eq = S.skills.includes(sid);
    html += `<div class="skill-card ${eq?'equipped':''}" data-skill="${sid}">
      <span class="sk-name">${esc(sk.name)}</span><span class="sk-mp">◆ ${sk.mp}</span>
      <span class="sk-desc">${esc(sk.desc)}</span></div>`;
  });
  html += `</div>`;
  html += `<div style="font-size:12px;color:var(--cyan);letter-spacing:.15em;margin-top:16px">背包</div>`;
  const groups = [['consumable','消耗品'],['weapon','武器'],['armor','防具'],['trinket','饰品'],['key','任务道具']];
  let hasItem=false;
  groups.forEach(([type,tname])=>{
    const items = S.items.filter(id=>{ const it=itemById(id); return it && it.type===type; });
    if(!items.length) return;
    hasItem=true;
    html += `<div class="inv-group"><div class="ig-title">${tname}</div>`;
    const seen=[];
    items.forEach(id=>{
      if(seen.includes(id)) return;
      seen.push(id);
      const it=itemById(id);
      const num = countItem(id);
      let btn='';
      if(it.type==='consumable') btn = `<div class="btn btn-small" data-use="${id}">使用</div>`;
      else if(it.type==='weapon'||it.type==='armor'||it.type==='trinket'){
        const eq = S.equip[it.type]===id;
        btn = eq? '<span class="ii-num" style="color:var(--cyan)">已装备</span>' : `<div class="btn btn-small" data-equip="${id}">装备</div>`;
      }
      html += `<div class="inv-item"><div class="ii-main"><div class="ii-name">${esc(it.name)}</div><div class="ii-desc">${esc(it.desc)}</div></div><span class="ii-num">×${num}</span>${btn}</div>`;
    });
    html += `</div>`;
  });
  if(!hasItem) html += `<div class="notice">背包空空如也——去箱庭探索世界或打赢战斗，带点好东西回来。</div>`;
  html += `<div class="choices"><div class="choice" id="char-close"><span class="c-tag">【返回】</span>返回游戏</div></div></div>`;
  v.innerHTML = html;
  showView('char');
  v.querySelectorAll('[data-use]').forEach(b=>{
    b.onclick=()=>{ useItem(b.dataset.use); renderChar(); };
  });
  v.querySelectorAll('[data-equip]').forEach(b=>{
    b.onclick=()=>{ equipSlot(b.dataset.equip); renderChar(); };
  });
  v.querySelectorAll('[data-uneq]').forEach(b=>{
    b.onclick=()=>{ unequipSlot(b.dataset.uneq); renderChar(); };
  });
  v.querySelectorAll('[data-mate]').forEach(b=>{
    b.onclick=()=>{ toggleParty(b.dataset.mate); renderChar(); };
  });
  v.querySelectorAll('[data-skill]').forEach(b=>{
    b.onclick=()=>{
      const sid=b.dataset.skill;
      const i=S.skills.indexOf(sid);
      if(i>=0) S.skills.splice(i,1);
      else if(S.skills.length<3) S.skills.push(sid);
      else S.skills[0]=sid;
      renderChar();
    };
  });
  $('char-close').onclick=()=>{ closeChar(); };
}
function closeChar(){
  const back = S._returnNode||'c1_intro';
  if(back==='combat' && CB) renderCombat();
  else if(back==='operation' && OP) renderOperation();
  else if(back==='worlds') renderWorlds();
  else if(back==='class') renderClassSelect();
  else if(back==='map'||back==='hub') renderHub();
  else if(back==='loc') { const l=locById(S._location); if(l) renderLocation(l); else renderMap(); }
  else if(NODES[back]) gotoNode(back);
  else gotoNode('c1_intro');
}

/* ---------- 死亡与轮回 ---------- */
function renderDeath(){
  showGuide('die');
  combatAutoStop();
  S._keepGold = S.gold;  // 取消限制：死亡不再清空金币，全部带进下一轮
  if(hasBooster('cheat')){ S._keepGold += Math.floor(S.gold*0.5); }  // 「存档作弊」升级：再偷偷多带 50%
  if(OP && OP.world && OP.world.id==='hollow'){ S._hollowSoul = (S._hollowSoul||0) + Math.floor(S.gold*0.15); }  // 【圣巢深渊 · 魂】：死亡时仅一成半金币化作「魂」坠入深渊，余者仍护在怀中
  const v=$('view-death');
  v.innerHTML = `
    <div class="panel" style="text-align:center">
      <div class="scene-chap">轮回 · 小憩</div>
      <div class="scene-title" style="color:#7fe0d0">满血重启</div>
      <div class="story" style="margin-top:14px">你的意识在数据洪流中下沉、分解、重组……\n\n{echo}“哟，又见面了，老朋友。”{/echo}\n\n系统这次没冷着脸，反而像个熬夜加班的程序员，叹了口气：\n“本次轮回结束。别慌——金币我给你捂住了，天赋下周目照常觉醒。去，接着浪。”${hasBooster('cheat')? '\n\n【存档作弊】生效：你不仅捂住了全部金币，还偷偷多带 50% 进下一周目——作弊玩家从不吃亏。':''}</div>
      <div class="stats-sum">
        <div class="stat-card"><div class="k">轮回周目</div><div class="v">${S.run}</div></div>
        <div class="stat-card"><div class="k">累计回响碎片</div><div class="v">+1 → ${S.echoes+1}</div></div>
        <div class="stat-card"><div class="k">本局金币</div><div class="v">${S.gold}</div></div>
        <div class="stat-card"><div class="k">已轮回</div><div class="v">${S.totalRuns||0} 次</div></div>
      </div>
      <div class="notice">死亡不意味着终结——金币护住了，碎片也留着，下一世更猛。回响之城，永远有人替你留着一盏灯。</div>
      <div class="choices">
        <div class="choice" id="reincarnate"><span class="c-tag">【轮回】</span>再次轮回 · 觉醒新天赋</div>
        <div class="choice" id="back-title">返回主菜单</div>
      </div>
    </div>`;
  showView('death');
  $('reincarnate').onclick=()=>{ S.echoes+=1; S.totalRuns++; saveSave(); resetRun(); gotoTitleAfterRun(); };
  $('back-title').onclick=()=>{ S.echoes+=1; S.totalRuns++; saveSave(); renderTitle(); };
}
function gotoTitleAfterRun(){
  // 直接进入天赋抽取
  renderTalentSelect();
}

/* ---------- 结局 ---------- */
function goEnding(id){
  const e = ENDINGS[id];
  if(!e) return;
  S.nodeId='ending';
  if(!S.finishedEndings.includes(id)) S.finishedEndings.push(id);
  if(!S.flag._endedThisRun){ S.echoes += 3; S.totalRuns++; S.flag._endedThisRun=true; }
  saveSave();
  updateHUD();
  const v=$('view-ending');
  v.innerHTML = `
    <div class="panel">
      <div class="ending-banner">
        <div class="scene-chap">第 ${S.run} 周目 · 终局</div>
        <div class="ending-title ${e.cls}">${esc(e.title)}</div>
        <div class="ending-sub">${esc(e.sub)}</div>
      </div>
      <div class="dice-log" id="dice-log"></div>
      <div class="ending-text">${fillText(e.text)}</div>
      <div class="stats-sum">
        <div class="stat-card"><div class="k">轮回周目</div><div class="v">${S.run}</div></div>
        <div class="stat-card"><div class="k">回响碎片</div><div class="v">+3 → ${S.echoes}</div></div>
        <div class="stat-card"><div class="k">已解锁结局</div><div class="v">${S.finishedEndings.length}/4</div></div>
      </div>
      <div class="notice">你记住了这段轮回。这座城，会记得你的选择。</div>
      <div class="notice" style="color:#7fe0d0">主线已通关——你仍可留在这座城里，继续逛支线、刷世界、培养队友。</div>
      <div class="choices">
        <div class="choice" id="continue-map"><span class="c-tag">【继续】</span>留在当前周目 · 继续探索箱庭</div>
        <div class="choice" id="again"><span class="c-tag">【轮回】</span>开始新的轮回 · 觉醒新天赋</div>
        <div class="choice" id="back-title2">返回主菜单</div>
      </div>
    </div>`;
  showView('ending');
  $('continue-map').onclick=()=>{ renderMap(); };
  $('again').onclick=()=>{ resetRun(); renderTalentSelect(); };
  $('back-title2').onclick=()=>{ renderTitle(); };
}

/* ---------- 视图：标题 ---------- */
function renderTitle(){
  S.nodeId=null;
  updateHUD();
  const v=$('view-title');
  v.innerHTML = `
    <div class="title-mark">文字肉鸽 · 安科骰子 · 天赋构筑 · 跨万界箱庭探索</div>
    <h1 class="title-name">赢赢赢</h1>
    <div class="title-sub">骰 子 中 间 窜 窜 窜 之 文 游 大 冒 险</div>
    <div class="title-dice">⚄</div>
    <div class="title-worlds"><span>🏝</span><span>🗡</span><span>🧙</span><span>🌊</span><span>☢</span><span>🐲</span><span>🚀</span><span>📚</span><span>🏞</span><span>🕳</span><span>🌳</span><span>⚡</span><span>🍁</span><span>🔥</span><span>🏴</span><span>⚔️</span><span>🕯</span><span>⛰</span><span>🚪</span><span>🌌</span></div>
    <div class="title-desc">你在一款全息网游中苏醒——这不是被困住，而是一场<b class="hlc">盛大冒险</b>的开场。城市会重建，NPC 会重逢，只有烙在灵魂里的<b class="hlc">天赋</b>，像老朋友一样一直陪着你。<br>
    每点一个选择，都是替命运掷一次骰——<b class="hlc">大成功</b>爽到飞起，<b class="hlc">大失败</b>哈哈一笑再来，偶尔还藏着「？？？？」的惊喜。<br>
    开局选<b class="hlc">职业</b>、带<b class="hlc">三个技能</b>、穿<b class="hlc">装备</b>、拐<b class="hlc">强力队友</b>——冒险，从来不是一个人的事。进每个世界前还能挑 <b class="hlc">1-3 个外挂（金手指）</b>，网文主角的待遇，你也有。<br>
    回响之城是起点，门后还有 <b class="hlc">20 个</b>小说/游戏世界等你征服；搜刮到的<b class="hlc">词条</b>，在红色工作台里合成、分解、铸成力量。<br>
    找到真相，或者——把这破城抢过来，当城主！<b class="hlc">光在前方，伙伴在身旁——出发吧，旅者。</b></div>
    <div class="stats-sum" style="max-width:520px;margin:0 auto 26px">
      <div class="stat-card"><div class="k">总轮回</div><div class="v">${S.totalRuns}</div></div>
      <div class="stat-card"><div class="k">回响碎片</div><div class="v">${S.echoes}</div></div>
      <div class="stat-card"><div class="k">已解锁结局</div><div class="v">${S.finishedEndings.length}/4</div></div>
    </div>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <div class="btn btn-primary" id="btn-start">开始轮回</div>
      <div class="btn btn-ghost" id="btn-help">玩法说明</div>
      <div class="btn btn-ghost" id="btn-custom">✍ 自定义剧本</div>
      ${(hasSlot('auto')||hasSlot('slot1')||hasSlot('slot2')||hasSlot('slot3'))? '<div class="btn btn-ghost" id="btn-loadsave">读取存档</div>':''}
    </div>
    <div class="help-box" id="help-box" style="display:none;max-width:560px;margin:22px auto 0;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 22px">
      <b>玩法说明</b><br><br>
      ▸ <b>天赋</b>：每轮开局从 3 个随机天赋中选 1。天赋分 7 个品级（D→SSS），决定你的流派。<br>
      ▸ <b>职业</b>：选完天赋后再选职业（剑客/术师/刺客/医修）。职业决定属性偏向、初始装备与可习技能。<br>
      ▸ <b>技能</b>：职业自带 3 个技能。战斗每回合从携带的 <b>3 个技能</b>中选 1 个发动，消耗<b>法力</b>；普通攻击回蓝 12 点（带「修炼加速」再 +8）。升级/完成世界可习得新技能，在「角色」面板更换携带。<br>
      ▸ <b>装备与背包</b>：点 HUD 的「◫ 角色」打开背包——装备武器/防具/饰品、使用药剂、配置技能。装备提升属性与减伤。<br>
      ▸ <b>队伍与强力队友（星铁式回合制）</b>：塔顶救下<b>老猫</b>、首通各世界可招募强力队友（含凝光/温蒂/荒等共 <b>9 名</b>）。队友和主角一样战斗——独立生命条、能量条，点按施放<b>战技</b>与<b>终结技</b>，会受击倒地、也能被治疗拉回；敌人攻击分摊到队伍。<br>
      ▸ <b>战斗增强</b>：普攻/受击积攒<b>回响能量</b>，满 100 释放职业<b>终结技</b>（剑客八荒裂空斩、术师群星陨落、刺客终焉影袭、医修回响圣域）；<b>蓄力</b>积攒 BP（最多 3）强化技能伤害；持续攻击命中弱点可<b>破防</b>，触发<b>全队总攻击</b>并眩晕敌人。<br>
      ▸ <b>安科骰子</b>：关键抉择由 1d100 判定——大成功（1-8）必成、还更容易触发，大失败（98-100）只余 2% 极难翻车。失败时可用<b>命运点</b>重掷。<br>
      ▸ <b>轮回肉鸽</b>：死亡或通关即轮回。装备/等级不保留，但<b>金币全数带进下一轮</b>（死亡也不掉）——越轮回越富有；<b>回响碎片</b>永久累积，可提升下轮初始命运点。<br>
      ▸ <b>箱庭开放世界</b>：三片街区自由探索——巡逻战斗、随机际遇、真相碎片支线，主线不再是单行道。<br>
      ▸ <b>万界冒险（20 个特色世界）</b>：从万界冒险枢纽出发——回响之城是主线起点，另 <b>20 个</b>小说/游戏世界（空岛/仙山/国运/万族/旷野/圣巢/星渊……）每个都有<b>入场剧情</b>与<b>特色玩法</b>。进入前挑 <b>1-3 个外挂（金手指）</b>：签到系统、看广告变强、词条篡改、升级加速……网文主角的待遇，你也有。<br>
      ▸ <b>词条工作台（红色神器）</b>：探索中搜刮到的<b>词条</b>存入背包（死亡不掉落），在角色面板「词条工作台」里装备生效槽、3 个同品级词条<b>合成</b>更高品级、D 级词条<b>分解</b>成经验——万般词条尽在掌握。<br>
      ▸ <b>世界模拟器（搜打撤）</b>：不演剧情、不选外挂，进去就搜、搜完就撤——搜索 → 收获/遭遇/陷阱 → 撤离评级。练手、刷金币、刷特色产物、测新队友的好去处。<br>
      ▸ <b>生存沙盒（异世界活下去）</b>：不追主线，纯粹在选定的世界活下去——每天行动、探图、种田、砍怪、拜神、遇奇遇；体力饱食随缘，归隐或倒在异世界皆可，生存天数与最佳纪录永久留存。<br>
      ▸ <b>箱庭探索与搜打撤</b>：每个世界搜索上限（低危 8 / 中危 10 / 高危 12），搜得越深收获越肥；到上限自动<b>强制撤离</b>也只折损一成——见好就收，快乐加倍。国运战场撤离时还能<b>抽国运卡</b>，吉凶一念。每个世界有专属技能/装备/特色产物或强力队友，完成越多解锁越多。<br>
      ▸ <b>自定义剧本</b>：点「✍ 自定义剧本」，用简单 JSON 写一段你自己的多分支剧情，导入即玩——像 MarkdownGame 那样，人人都能当编剧。<br>
      ▸ <b>多剧情多结局</b>：箱庭主线 × 阵营抉择 × NPC 支线，通向 4 个结局（含隐藏结局）。你的每一个选择，都会留下“回响”。<br><br>
      <b>隐藏要素</b>：获得【回响水晶】或【真相透镜】后，第三章会解锁隐藏选项「？？？？」。
    </div>`;
  showView('title');
  $('btn-start').onclick=()=>renderTalentSelect();
  $('btn-help').onclick=()=>{ const h=$('help-box'); h.style.display = h.style.display==='none'?'block':'none'; };
  $('btn-custom').onclick=()=>renderCustomEditor();
  const lb=$('btn-loadsave'); if(lb) lb.onclick=()=>renderSave();
}
function renderTalentSelect(){
  S.nodeId='talent';
  newRun();
  const picks = pickTalents();
  S._talentPool = picks;
  updateHUD();
  const v=$('view-talent');
  v.innerHTML = `
    <div class="panel">
      <div class="scene-chap">轮回历第 ${S.run} 周目 · 觉醒</div>
      <div class="scene-title">选择你的天赋烙印</div>
      <div class="scene-tagline">天赋品级：劣品 D → 神话 SSS ｜ 天赋是你在轮回中唯一不灭的东西</div>
      <div class="story">系统提示音在你灵魂深处响起：\n\n“检测到可觉醒灵魂烙印。请从以下天赋中选择其一，作为本周目的‘金手指’。”\n\n天赋决定流派——谨慎选择。</div>
      <div class="talent-cards" id="talent-cards"></div>
      <div class="notice" id="talent-note">点击卡片，确认觉醒。</div>
    </div>`;
  const box=$('talent-cards');
  picks.forEach((t,idx)=>{
    const g=GRADE[t.grade];
    const card=document.createElement('div');
    card.className='tcard';
    card.style.borderColor = g.color+'55';
    card.innerHTML = `
      <div class="t-glow" style="background:${g.color}"></div>
      <div class="t-grade grade-${t.grade}">${t.grade} · ${g.name}</div>
      <div class="t-name" style="color:${g.color}">${esc(t.name)}</div>
      <div class="t-type">${esc(t.type)}</div>
      <div class="t-desc">${esc(t.desc)}</div>
      <div class="t-flavor">“${esc(t.flavor)}”</div>`;
    card.onclick=()=>{
      box.querySelectorAll('.tcard').forEach(c=>c.classList.remove('sel'));
      card.classList.add('sel');
      S._picked=t;
      $('talent-note').textContent = `已选定「${t.name}」。准备入世。`;
      setTimeout(()=>{
        applyTalent(t);
        S.hp = Math.min(S.maxHp, S.hp);
        updateHUD();
        renderClassSelect();
      }, 500);
    };
    box.appendChild(card);
  });
  showView('talent');
}

/* ---------- 启动 ---------- */
function boot(){
  loadSave();
  renderTitle();
}
document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
