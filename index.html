<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赢赢赢，骰子中间窜窜窜之文游大冒险</title>
<style>
/* ===== 主题令牌 ===== */
:root{
  --bg0:#0a0e18;
  --bg1:#0f1730;
  --bg2:#131d3a;
  --ink:#dbe3f2;
  --ink-dim:#8b95ad;
  --ink-faint:#5c6580;
  --gold:#e6a544;
  --gold-soft:#c9892f;
  --cyan:#54d2c0;
  --cyan-dim:#2d8f86;
  --red:#d5564a;
  --line:rgba(120,150,210,0.16);
  --line-strong:rgba(160,190,255,0.3);
  --panel:rgba(18,26,52,0.72);
  --panel-solid:#121b3a;
  --r-gold:linear-gradient(135deg,#ffd98a,#e6a544 55%,#b8792a);
  --r-sss:#ffd54a; --r-ss:#ff8a6b; --r-s:#f0a04c; --r-a:#b78df0; --r-b:#5aa7e8; --r-c:#cfd6e6; --r-d:#8a93a6;
  --serif:'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',Georgia,'Times New Roman',serif;
  --sans:'Noto Sans SC','Microsoft YaHei','PingFang SC','Segoe UI',system-ui,sans-serif;
  --mono:'Cascadia Mono','Consolas','Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);
  background:radial-gradient(1200px 800px at 70% -10%,#16234a 0%,var(--bg0) 55%),var(--bg0);
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
}
/* 背景网格（服务器质感） */
#bg-grid{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(84,210,192,0.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(84,210,192,0.05) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(900px 700px at 60% 20%,#000 30%,transparent 100%);
}
#app{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:18px 16px 60px}

/* ===== HUD ===== */
#hud{
  display:none;flex-wrap:wrap;align-items:center;gap:8px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 14px;
  margin-bottom:14px;
  backdrop-filter:blur(6px);
  position:sticky;top:10px;z-index:20;
  box-shadow:0 8px 30px rgba(0,0,0,0.35);
}
#hud.on{display:flex}
.hud-block{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink-dim);line-height:1.25}
.hud-block b{font-family:var(--mono);font-size:15px;color:var(--ink);font-weight:600}
.hud-block .hp-bar{width:90px;height:6px;background:#1c2546;border-radius:4px;overflow:hidden;margin-top:2px}
.hud-block .hp-fill{height:100%;background:linear-gradient(90deg,#e6a544,#ffd98a);border-radius:4px;transition:width .4s}
.hud-block .hp-fill.low{background:linear-gradient(90deg,#d5564a,#ff8a7a)}
.hud-right{margin-left:auto;display:flex;gap:14px;align-items:center}
.chip{
  font-family:var(--mono);font-size:13px;padding:4px 10px;border-radius:999px;
  border:1px solid var(--line-strong);background:rgba(84,210,192,0.08);color:var(--cyan);
}
.chip.gold{border-color:rgba(230,165,68,.5);background:rgba(230,165,68,.08);color:var(--gold)}
.chip.red{border-color:rgba(213,86,74,.5);background:rgba(213,86,74,.08);color:#ff8a7a}

/* ===== 视图 ===== */
.view{display:none;animation:fadein .5s ease}
.view.active{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes ghostpulse{0%,100%{opacity:.35;text-shadow:0 0 6px rgba(84,210,192,.5)}50%{opacity:.75;text-shadow:0 0 16px rgba(84,210,192,.9)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes glowpulse{0%,100%{box-shadow:0 0 10px rgba(230,165,68,.25)}50%{box-shadow:0 0 26px rgba(230,165,68,.55)}}

/* 标题页 */
#title-view{text-align:center;padding-top:8vh}
.title-mark{font-size:12px;letter-spacing:.6em;color:var(--cyan);margin-bottom:22px;text-transform:uppercase}
h1.title-name{
  font-family:var(--serif);font-size:56px;font-weight:900;line-height:1.1;
  background:linear-gradient(160deg,#ffe9bd,#e6a544 45%,#9a5f1e);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 18px rgba(230,165,68,.35));
  margin-bottom:6px;
}
.title-sub{font-family:var(--serif);font-size:17px;color:var(--ink-dim);letter-spacing:.35em;margin-bottom:30px}
.title-dice{font-size:40px;margin:8px 0 26px;animation:floaty 3s ease-in-out infinite;color:var(--gold)}
.title-worlds{
  font-size:15px;letter-spacing:.5em;margin:0 auto 22px;max-width:520px;
  color:rgba(84,210,192,.55);line-height:2.1;user-select:none;
  animation:fadein 1s ease;
}
.title-worlds span{display:inline-block;transition:transform .2s}
.title-worlds span:hover{transform:translateY(-3px) scale(1.25)}
.title-desc{max-width:520px;margin:0 auto 34px;color:var(--ink-dim);line-height:1.9;font-size:14px}
.btn{
  display:inline-block;cursor:pointer;user-select:none;
  border:1px solid var(--line-strong);background:rgba(30,42,84,.5);
  color:var(--ink);padding:12px 26px;border-radius:10px;font-size:15px;
  transition:all .18s;font-family:var(--sans);
}
.btn:hover{background:rgba(60,80,140,.6);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{
  background:var(--r-gold);color:#1a1206;font-weight:700;border:none;
  box-shadow:0 6px 20px rgba(230,165,68,.3);
}
.btn-primary:hover{filter:brightness(1.06);box-shadow:0 8px 26px rgba(230,165,68,.45)}
.btn-ghost{background:transparent;border-color:var(--line)}
.btn-small{padding:8px 16px;font-size:13px}
.btn[disabled]{opacity:.4;pointer-events:none}

/* 叙事面板 */
.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:22px 24px;backdrop-filter:blur(6px);
  box-shadow:0 14px 40px rgba(0,0,0,.35);
}
.scene-chap{
  font-size:12px;letter-spacing:.3em;color:var(--cyan);margin-bottom:12px;
  text-transform:uppercase;display:flex;align-items:center;gap:10px;
}
.scene-chap::after{content:"";flex:1;height:1px;background:var(--line)}
.scene-title{
  font-family:var(--serif);font-size:23px;font-weight:800;color:#f4ecdb;
  margin-bottom:4px;line-height:1.4;
}
.scene-tagline{font-size:12px;color:var(--ink-faint);margin-bottom:14px}
.story{
  font-family:var(--serif);font-size:16px;line-height:2;color:#d7dfef;
  white-space:pre-wrap;
}
.story .echo{
  color:var(--cyan);opacity:.8;
  animation:ghostpulse 4s ease-in-out infinite;
}
.story .hl{color:var(--gold);font-weight:700}
.story .hlr{color:#ff8a7a;font-weight:700}
.story .hlc{color:var(--cyan);font-weight:600}
.story em.mind{display:block;font-style:italic;color:#9aa7c0;margin:12px 0;padding-left:12px;border-left:2px solid rgba(154,167,192,.28);line-height:2}
.scene-transit{font-style:italic;color:#8b96ad;font-size:13px;margin:8px 0 4px;padding:8px 12px;border-left:2px solid rgba(139,150,173,.3);background:rgba(139,150,173,.05)}
.story small{color:#7c87a3;font-size:11px;opacity:.85}
.story p{margin:0 0 10px}

/* 安科骰子旁白 */
.dice-log{
  margin:14px 0;padding:12px 16px;border-left:3px solid var(--cyan-dim);
  background:rgba(84,210,192,.06);border-radius:0 8px 8px 0;
  font-family:var(--mono);font-size:13px;color:#a7e8df;line-height:1.9;
  white-space:pre-wrap;display:none;
}
.dice-log.show{display:block;animation:fadein .35s}
.dice-log .crit{color:#ffd98a}
.dice-log .fumb{color:#ff8a7a}
.dice-log .ok{color:#7fe0d0}

/* 选项 */
.choices{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.choice{
  cursor:pointer;user-select:none;text-align:left;
  background:rgba(24,36,72,.55);border:1px solid var(--line);border-radius:10px;
  padding:13px 16px;color:var(--ink);font-size:15px;line-height:1.6;
  transition:all .16s;font-family:var(--sans);
}
.choice:hover{border-color:var(--gold);background:rgba(60,46,20,.35);transform:translateX(3px)}
.choice .c-tag{font-size:11px;color:var(--gold);letter-spacing:.12em;margin-right:6px}
.choice .c-desc{font-size:12.5px;color:var(--ink-dim);margin-top:2px}
.choice.hidden-mystery{
  border-style:dashed;border-color:rgba(230,165,68,.6);color:#ffe3ad;
  background:rgba(60,46,20,.22);
}

/* 天赋卡 */
.talent-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:18px}
.tcard{
  cursor:pointer;user-select:none;position:relative;
  border:1px solid var(--line);border-radius:12px;padding:16px 16px 14px;
  background:var(--panel-solid);transition:all .18s;overflow:hidden;
}
.tcard:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,.4)}
.tcard.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 12px 34px rgba(230,165,68,.25);transform:translateY(-4px)}
.tcard .t-grade{font-family:var(--mono);font-size:12px;letter-spacing:.18em;margin-bottom:6px}
.tcard .t-name{font-family:var(--serif);font-size:18px;font-weight:800;margin-bottom:6px}
.tcard .t-type{font-size:11px;color:var(--ink-dim);margin-bottom:8px;letter-spacing:.1em}
.tcard .t-desc{font-size:12.5px;color:var(--ink-dim);line-height:1.7}
.tcard .t-flavor{font-family:var(--serif);font-size:12px;color:var(--ink-faint);font-style:italic;margin-top:8px;line-height:1.6}
.grade-D{color:var(--r-d)}.grade-C{color:var(--r-c)}.grade-B{color:var(--r-b)}
.grade-A{color:var(--r-a)}.grade-S{color:var(--r-s)}.grade-SS{color:var(--r-ss)}.grade-SSS{color:var(--r-sss)}
.tcard .t-glow{position:absolute;top:-40%;right:-30%;width:130px;height:130px;border-radius:50%;opacity:.12;pointer-events:none;filter:blur(10px)}

/* 属性面板 */
.voice-card{border:1px solid var(--gold);border-left:3px solid var(--gold);border-radius:9px;padding:9px 11px;margin-top:14px;background:rgba(60,52,20,.18)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat-cell{
  border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:rgba(16,24,52,.5);
  font-size:12.5px;color:var(--ink-dim);
}
.stat-cell b{display:block;font-family:var(--mono);font-size:17px;color:var(--ink);margin-top:2px}

/* 战斗 */
.combat-enemy{
  border:1px solid var(--line-strong);border-radius:12px;padding:14px 16px;margin:14px 0;
  background:linear-gradient(135deg,rgba(60,24,40,.5),rgba(24,18,46,.6));
}
.combat-enemy .e-name{font-family:var(--serif);font-size:20px;font-weight:800;color:#ffc9b8}
.combat-enemy .e-desc{font-size:13px;color:var(--ink-dim);line-height:1.7;margin-top:4px}
.combat-enemy .e-bar{width:100%;height:8px;background:#2a1030;border-radius:5px;overflow:hidden;margin-top:10px}
.combat-enemy .e-fill{height:100%;background:linear-gradient(90deg,#d5564a,#ff8a7a);transition:width .4s}
.combat-enemy .e-toughbar{width:100%;height:6px;background:#241a2e;border-radius:5px;overflow:hidden;margin-top:5px;position:relative}
.combat-enemy .e-fill.tough{background:linear-gradient(90deg,#6fb7ff,#c9a6ff)}
.combat-enemy .etb-lbl{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:9px;color:var(--ink-dim);font-family:var(--mono);letter-spacing:.1em}
.combat-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:14px}
.cact{
  cursor:pointer;user-select:none;text-align:center;
  border:1px solid var(--line);border-radius:10px;padding:12px 8px;
  background:rgba(24,36,72,.5);color:var(--ink);font-size:14px;transition:all .15s;
}
.cact:hover{border-color:var(--gold);transform:translateY(-2px)}
.cact .ca-sub{display:block;font-size:11px;color:var(--ink-dim);margin-top:3px}
.battle-log{
  margin-top:14px;padding:12px 14px;background:rgba(0,0,0,.25);border-radius:8px;
  font-size:13.5px;line-height:1.9;color:#c8d2e8;min-height:60px;max-height:180px;overflow-y:auto;
}
.battle-log .pl{color:#a7e8df}
.battle-log .en{color:#ffb3a0}
.battle-log .crit{color:#ffd98a}
.battle-log .fumb{color:#ff8a7a}

/* 搜打撤行动 */
.op-steps{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.op-step{
  flex:1;min-width:96px;text-align:center;font-size:13px;padding:8px 6px;border-radius:9px;
  border:1px solid var(--line);color:var(--ink-dim);background:rgba(16,24,52,.5);
}
.op-step.on{
  border-color:var(--gold);color:var(--gold);background:rgba(60,46,20,.3);
  box-shadow:0 0 14px rgba(230,165,68,.25);font-weight:700;
}
.op-step.done{border-color:var(--cyan);color:var(--cyan)}
.op-log{
  margin-top:12px;padding:12px 16px;border-left:3px solid var(--cyan-dim);
  background:rgba(84,210,192,.06);border-radius:0 8px 8px 0;
  font-family:var(--serif);font-size:14px;color:#d7dfef;line-height:2;white-space:pre-wrap;
}
.op-result{border:1px solid var(--line-strong);border-radius:12px;padding:16px;margin-top:14px}
.op-result.good{border-color:rgba(230,165,68,.5);background:rgba(60,46,20,.15)}
.op-result.bad{border-color:rgba(213,86,74,.5);background:rgba(60,24,24,.15)}
/* 箱庭探索 */
.op-progress{margin:12px 0 6px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:rgba(16,24,52,.45)}
.op-prog-row{display:flex;align-items:center;gap:10px;margin:4px 0}
.opr-label{width:36px;font-size:12px;color:var(--ink-dim);letter-spacing:.08em}
.opr-num{width:44px;text-align:right;font-size:12px;color:var(--gold);font-variant-numeric:tabular-nums}
.prog-bar{flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.prog-bar .prog-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--cyan),#6fd7c8);transition:width .3s}
.prog-bar.hot .prog-fill{background:linear-gradient(90deg,#e6a544,#d5564a)}
.op-treasure{margin:8px 2px;font-size:13px;color:var(--ink-dim);line-height:1.8;padding:8px 12px;border-radius:8px;background:rgba(60,46,20,.12);border:1px dashed rgba(230,165,68,.3)}
.op-warn{color:#ffd27a;border-color:rgba(230,165,68,.5);background:rgba(60,46,20,.25)}
.op-danger{color:#ff9a8a;border-color:rgba(213,86,74,.6);background:rgba(60,24,24,.3);animation:glowpulse 1.6s ease-in-out infinite}

/* 结局 */
.ending-banner{text-align:center;padding:34px 10px 10px}
.ending-title{font-family:var(--serif);font-size:40px;font-weight:900;line-height:1.3;animation:glowpulse 3s ease-in-out infinite}
.ending-title.good{background:linear-gradient(150deg,#ffe9bd,#e6a544);-webkit-background-clip:text;background-clip:text;color:transparent}
.ending-title.bad{background:linear-gradient(150deg,#ffb3a0,#d5564a);-webkit-background-clip:text;background-clip:text;color:transparent}
.ending-title.secret{background:linear-gradient(150deg,#a7e8df,#54d2c0);-webkit-background-clip:text;background-clip:text;color:transparent}
.ending-sub{color:var(--ink-dim);letter-spacing:.3em;font-size:12px;margin-top:8px}
.ending-text{font-family:var(--serif);font-size:16px;line-height:2.1;color:#d7dfef;white-space:pre-wrap;margin-top:20px}
.stats-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:22px 0}
.stat-card{border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;background:rgba(16,24,52,.5)}
.stat-card .k{font-size:11px;color:var(--ink-dim)}
.stat-card .v{font-family:var(--mono);font-size:20px;color:var(--gold);margin-top:4px}

/* 滚动日志/菜单 */
.help-box{font-size:13.5px;color:var(--ink-dim);line-height:1.9}
.help-box b{color:var(--cyan)}
.kbd{font-family:var(--mono);border:1px solid var(--line-strong);border-radius:5px;padding:1px 6px;font-size:12px;color:var(--gold)}
.notice{color:var(--gold);font-size:13px;margin-top:12px}

/* ===== 职业选择 ===== */
.class-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.ccard{cursor:pointer;user-select:none;border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--panel-solid);transition:all .18s}
.ccard:hover{transform:translateY(-4px);border-color:var(--cyan);box-shadow:0 10px 28px rgba(0,0,0,.4)}
.ccard .cl-name{font-family:var(--serif);font-size:19px;font-weight:800;color:var(--cyan);margin-bottom:4px}
.ccard .cl-role{font-size:11px;color:var(--gold);letter-spacing:.1em;margin-bottom:8px}
.ccard .cl-desc{font-size:12.5px;color:var(--ink-dim);line-height:1.7}
.ccard .cl-skill{font-size:12px;color:#a7e8df;margin-top:8px;line-height:1.7}
.ccard .cl-stat{font-size:11.5px;color:var(--ink-dim);margin-top:6px;line-height:1.6}

/* ===== 法力条 ===== */
.mp-bar{width:100%;height:6px;background:#1c2546;border-radius:4px;overflow:hidden;margin-top:2px}
.mp-fill{height:100%;background:linear-gradient(90deg,#54d2c0,#8fe8da);border-radius:4px;transition:width .4s}

/* ===== 技能栏（战斗） ===== */
.skill-slot{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.skill-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
.skill-card{cursor:pointer;user-select:none;text-align:left;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:rgba(24,36,72,.5);transition:all .15s;position:relative}
.skill-card:hover{border-color:var(--cyan);transform:translateY(-2px)}
.skill-card .sk-name{font-family:var(--serif);font-size:15px;font-weight:700;color:#a7e8df}
.skill-card .sk-mp{position:absolute;top:8px;right:10px;font-family:var(--mono);font-size:11px;color:var(--ink-dim)}
.skill-card .sk-desc{font-size:11px;color:var(--ink-dim);margin-top:3px;line-height:1.5}
.skill-card.locked{opacity:.4;pointer-events:none;filter:grayscale(.7)}

/* ===== 角色 / 背包 ===== */
.char-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.char-block{border:1px solid var(--line);border-radius:10px;padding:12px;background:rgba(16,24,52,.5)}
.char-block .cb-k{font-size:11px;color:var(--ink-dim)}
.char-block .cb-v{font-family:var(--mono);font-size:17px;color:var(--gold);margin-top:3px}
.char-block .xp-bar{width:100%;height:6px;background:#1c2546;border-radius:4px;overflow:hidden;margin-top:4px}
.char-block .xp-fill{height:100%;background:linear-gradient(90deg,#b78df0,#ffd98a);border-radius:4px}
.equip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.equip-cell{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:rgba(16,24,52,.5);font-size:12px;color:var(--ink-dim)}
.equip-cell b{display:block;font-size:13px;color:var(--ink);margin-top:2px}
.equip-cell .btn{padding:4px 10px;font-size:11px;margin-top:5px}
.inv-group{margin-top:14px}
.inv-group .ig-title{font-size:12px;letter-spacing:.15em;color:var(--cyan);margin-bottom:8px}
.inv-item{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:8px;background:rgba(16,24,52,.4)}
.inv-item .ii-main{flex:1}
.inv-item .ii-name{font-size:14px;color:var(--ink)}
.inv-item .ii-desc{font-size:11.5px;color:var(--ink-dim);margin-top:2px}
.inv-item .ii-num{font-family:var(--mono);font-size:12px;color:var(--gold)}
.inv-item .btn{padding:6px 12px;font-size:12px}
.skill-edit{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
.skill-edit .skill-card.equipped{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}

/* ===== 世界 / 任务板 ===== */
.world-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:16px}
.wcard{cursor:pointer;user-select:none;border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--panel-solid);transition:all .18s;position:relative;overflow:hidden}
.wcard:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,.4)}
.wcard.locked{opacity:.42;cursor:not-allowed;filter:grayscale(.6)}
.wcard.locked:hover{transform:none}
.wcard .w-style{font-size:11px;color:var(--cyan);letter-spacing:.12em;margin-bottom:5px}
.wcard .w-name{font-family:var(--serif);font-size:19px;font-weight:800;margin-bottom:6px}
.wcard .w-desc{font-size:12px;color:var(--ink-dim);line-height:1.7}
.wcard .w-reward{font-size:11.5px;color:var(--gold);margin-top:8px}
.wcard .w-done{position:absolute;top:12px;right:12px;font-family:var(--mono);font-size:11px;color:var(--cyan);border:1px solid var(--cyan-dim);padding:2px 8px;border-radius:999px}
.wcard .w-diff{position:absolute;top:12px;right:12px;font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line-strong)}
.diff-1{color:#7fe0d0}.diff-2{color:#ffd98a}.diff-3{color:#ffb3a0}
.wcard .w-special{font-size:11px;color:#c9b7ff;background:rgba(201,183,255,.08);border:1px solid rgba(201,183,255,.18);border-radius:8px;padding:6px 9px;margin-top:8px;line-height:1.6}

/* ===== 万界冒险枢纽 ===== */
.hub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:16px}
.hub-card{cursor:pointer;user-select:none;border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--panel-solid);transition:all .18s;position:relative;overflow:hidden}
.hub-card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,.4);border-color:var(--gold)}
.hub-card .hc-icon{font-size:30px;margin-bottom:8px}
.hub-card .hc-name{font-family:var(--serif);font-size:17px;font-weight:800;margin-bottom:6px}
.hub-card .hc-desc{font-size:12px;color:var(--ink-dim);line-height:1.7}
.hub-card .hc-meta{font-size:11px;color:var(--gold);margin-top:9px;font-family:var(--mono)}

/* ===== 外挂选择 ===== */
.booster-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:16px}
.bcard{cursor:pointer;user-select:none;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel-solid);transition:all .18s}
.bcard:hover{transform:translateY(-3px);border-color:var(--cyan-dim)}
.bcard.sel{border-color:var(--gold);background:rgba(255,214,138,.08);box-shadow:0 0 0 1px var(--gold)}
.bcard .b-icon{font-size:26px;margin-bottom:6px}
.bcard .b-name{font-family:var(--serif);font-size:15px;font-weight:800;margin-bottom:5px;color:var(--gold)}
.bcard .b-desc{font-size:11.5px;color:var(--ink-dim);line-height:1.6}

/* ===== 词条工作台 ===== */
.tag-slot{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tag-chip{cursor:pointer;border:1px solid;border-radius:999px;padding:6px 12px;font-size:12px;background:rgba(255,255,255,.04);line-height:1.5}
.tag-bag{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:8px}
.tag-card{cursor:pointer;border:1px solid;border-radius:12px;padding:12px;background:rgba(255,255,255,.03);transition:all .15s}
.tag-card:hover{transform:translateY(-2px)}
.tag-card .tag-n{font-size:13.5px;font-weight:800}
.tag-card .tag-g{font-size:10.5px;color:var(--ink-dim);margin:3px 0}
.tag-card .tag-d{font-size:11px;color:var(--ink-dim);line-height:1.6}
.tag-card .tag-act{font-size:10.5px;color:var(--gold);margin-top:6px}
.tag-empty{font-size:12px;color:var(--ink-dim);border:1px dashed var(--line);border-radius:10px;padding:14px;text-align:center}

/* ===== 升级横幅 ===== */
.levelup{position:fixed;left:50%;top:16%;transform:translateX(-50%);z-index:60;background:var(--panel-solid);border:1px solid var(--gold);border-radius:14px;padding:20px 26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:glowpulse 2s ease-in-out infinite;max-width:340px;width:calc(100% - 40px)}
.levelup .lu-title{font-family:var(--serif);font-size:22px;color:var(--gold);font-weight:800;margin-bottom:6px}
.levelup .lu-sub{font-size:13px;color:var(--ink-dim);line-height:1.8}
.levelup .lu-skill{font-size:13px;color:#a7e8df;margin-top:6px;line-height:1.7}

/* ===== 队伍 / 队友 ===== */
.ally-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.ally-chip{border:1px solid var(--line);background:rgba(167,232,223,.06);border-radius:8px;padding:5px 10px;font-size:11.5px;color:#a7e8df;line-height:1.5}
.ally-chip b{color:var(--gold)}
.ally-card{flex:1 1 46%;min-width:200px;border:1px solid var(--line);background:rgba(167,232,223,.05);border-radius:10px;padding:8px 10px}
.ally-card.down{opacity:.55;border-color:#8b4a4a}
.ally-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#a7e8df}
.ally-nm{font-weight:700;color:#c8fff6}
.ally-hpt{font-family:var(--mono);color:var(--ink-dim)}
.ally-hpbar,.ally-enbar{height:6px;background:rgba(255,255,255,.08);border-radius:4px;margin:4px 0 2px;overflow:hidden}
.ally-hpbar .ally-fill{background:linear-gradient(90deg,#e8827b,#ffb3a8);height:100%}
.ally-enbar .ally-fill{background:linear-gradient(90deg,#5aa9ff,#a7e8df);height:100%}
.ally-enlbl{font-family:var(--mono);font-size:10.5px;color:var(--ink-dim)}
.ally-btns{display:flex;gap:6px;margin-top:6px}
.ally-btn{flex:1;padding:6px 8px;font-size:11.5px;border-radius:8px;background:rgba(167,232,223,.12);border:1px solid rgba(167,232,223,.4);color:#a7e8df;cursor:pointer}
.ally-btn.ult{background:rgba(255,179,71,.14);border-color:rgba(255,179,71,.55);color:#ffd28f}
.ally-btn:disabled{opacity:.38;cursor:not-allowed}
.ally-btn:hover:not(:disabled){filter:brightness(1.2)}
.ally-down{color:#ff8f8f;font-size:11px;margin-top:6px;letter-spacing:.1em}
.mate-sec{margin-top:16px}
.mate-sec .ms-title{font-size:12px;letter-spacing:.15em;color:var(--cyan);margin-bottom:8px}
.mate-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.mate-card{border:1px solid var(--line);border-radius:10px;padding:10px;background:rgba(167,232,223,.05);text-align:left}
.mate-card .m-name{font-family:var(--serif);font-size:15px;font-weight:700;color:#a7e8df}
.mate-card .m-title{font-size:11px;color:var(--gold);letter-spacing:.08em;margin:2px 0 6px}
.mate-card .m-desc{font-size:11px;color:var(--ink-dim);line-height:1.6;margin-bottom:6px}
.mate-card .m-pass{font-size:11px;color:#ffd98a;line-height:1.6}
.mate-card .m-btn{margin-top:8px;font-size:11.5px}
.mate-card .m-btn.on{color:var(--cyan);border-color:var(--cyan)}
.mate-card.m-lock{opacity:.5;filter:grayscale(.7);border-style:dashed}
.mate-card.m-lock .m-where{font-size:11px;color:var(--ink-dim);margin-top:6px;line-height:1.5}
.ally{color:#a7e8df}

/* ===== 箱庭地图 / 区域 ===== */
.map-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:8px}
.loc-card{cursor:pointer;user-select:none;position:relative;border:1px solid var(--line);border-radius:12px;padding:14px;background:rgba(255,255,255,.02);text-align:left}
.loc-card:hover{transform:translateY(-4px);border-color:var(--cyan);box-shadow:0 12px 30px rgba(0,0,0,.4)}
.loc-card.locked{opacity:.45;cursor:not-allowed;filter:grayscale(.7)}
.loc-card.locked:hover{transform:none}
.loc-card .lc-icon{font-size:24px;margin-bottom:6px}
.loc-card .lc-name{font-family:var(--serif);font-size:18px;font-weight:800;margin-bottom:4px}
.loc-card .lc-desc{font-size:11.5px;color:var(--ink-dim);line-height:1.6}
.loc-card .lc-lock{font-size:11.5px;color:var(--gold);margin-top:8px}
.loc-card .lc-done{position:absolute;top:12px;right:12px;font-family:var(--mono);font-size:11px;color:#7fe0d0}
.loc-card .lc-spots{font-size:11px;color:var(--cyan);margin-top:8px}
.shard-bar{display:flex;align-items:center;gap:8px;margin:10px 0;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:rgba(167,232,223,.05)}
.shard-bar .sb-label{font-size:12px;color:var(--ink-dim)}
.shard-bar .sb-dots{display:flex;gap:6px}
.shard-bar .sb-dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);background:#141c36}
.shard-bar .sb-dot.on{background:linear-gradient(135deg,#b78df0,#ffd98a);border-color:var(--gold);box-shadow:0 0 8px rgba(255,217,138,.5)}
.spot-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.spot-item{cursor:pointer;user-select:none;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.02);text-align:left}
.spot-item:hover{border-color:var(--cyan);transform:translateX(3px)}
.spot-item.done{opacity:.55;pointer-events:none;filter:grayscale(.6)}
.spot-item .sp-ic{font-size:18px}
.spot-item .sp-main{flex:1}
.spot-item .sp-name{font-size:13.5px;font-weight:700;color:#e8f0ff}
.spot-item .sp-desc{font-size:11px;color:var(--ink-dim);line-height:1.5}
.spot-item .sp-tag{font-size:10px;color:var(--gold);letter-spacing:.08em;flex-shrink:0}

/* ===== 存档 / 读档 ===== */
.save-grid{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.save-slot{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:rgba(255,255,255,.02)}
.save-slot .ss-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.save-slot .ss-name{font-family:var(--mono);font-size:12px;color:var(--cyan);letter-spacing:.04em}
.save-slot .ss-time{font-size:10.5px;color:var(--ink-dim)}
.save-slot .ss-label{font-size:12px;color:#e8f0ff;margin-bottom:2px}
.save-slot .ss-sub{font-size:10.5px;color:var(--ink-dim)}
.save-slot.empty{opacity:.6}
.save-slot .ss-acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.save-slot .ss-acts .sbtn{font-size:11px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;color:#e8f0ff;background:rgba(255,255,255,.03)}
.save-slot .ss-acts .sbtn:hover{border-color:var(--cyan);background:rgba(167,232,223,.1)}
.save-slot .ss-acts .sbtn.danger:hover{border-color:#ff8a7a;background:rgba(255,138,122,.12)}
.save-slot .ss-acts .sbtn.primary{border-color:var(--gold);color:var(--gold)}

/* ===== 随机际遇 ===== */
.ev-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ev-chip{font-size:11px;padding:4px 10px;border:1px solid var(--line);border-radius:20px;color:var(--ink-dim)}

@media (max-width:600px){
  h1.title-name{font-size:40px}
  .panel{padding:16px}
  .story{font-size:15px}
  .stat-grid{grid-template-columns:repeat(3,1fr)}
  #hud{font-size:11px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* ===== 自定义剧本模式 ===== */
.custom-editor{text-align:left}
.custom-editor textarea{
  width:100%;min-height:260px;background:#0c1228;color:#b9e8df;border:1px solid var(--line-strong);
  border-radius:10px;padding:14px;font-family:var(--mono);font-size:12.5px;line-height:1.7;resize:vertical;
  margin-top:12px;
}
.custom-editor textarea:focus{outline:none;border-color:var(--gold)}
.custom-hint{font-size:12px;color:var(--ink-dim);line-height:1.8;margin-top:10px}
.custom-hint code{font-family:var(--mono);color:var(--cyan);background:rgba(84,210,192,.08);padding:1px 5px;border-radius:4px;font-size:11.5px}
.custom-err{color:#ff8a7a;font-size:13px;margin-top:8px;white-space:pre-wrap}
.custom-sample{
  margin-top:14px;background:rgba(16,24,52,.5);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  font-size:12.5px;color:var(--ink-dim);line-height:1.8;
}
.custom-sample summary{cursor:pointer;color:var(--gold);font-size:12.5px}
.custom-vars{
  display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 2px;font-family:var(--mono);font-size:12px;
}
.custom-vars span{background:rgba(84,210,192,.08);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:#a7e8df}
.cust-choice.cond-off{opacity:.45;pointer-events:none}
.story { white-space: pre-wrap; }
.hint { font-size: 12px; }
.ai-topbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.ai-topbar button,.ai-inputrow button,.ai-quick button,.ai-set button{background:var(--btn2, rgba(84,210,192,.15));border:1px solid var(--line);color:#cdeee8;border-radius:8px;padding:6px 12px;cursor:pointer}
.ai-topbar button:hover,.ai-inputrow button:hover,.ai-quick button:hover{background:rgba(84,210,192,.3)}
.ai-log{max-height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.25);margin:10px 0}
.ai-line{font-size:14px;line-height:1.65;white-space:pre-wrap}
.ai-line .ai-who{display:inline-block;font-weight:700;margin-right:8px}
.ai-line.me{color:#a7e8df}
.ai-line.me .ai-who{color:#54d2c0}
.ai-line.ai{color:#e8e3d6}
.ai-line.ai .ai-who{color:#f0b45a}
.ai-inputrow{display:flex;gap:8px;margin:10px 0}
.ai-in{flex:1;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:8px;color:#eee;padding:9px 12px;font-size:14px}
.ai-in::placeholder{color:#889}
.ai-quick{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.ai-set{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.ai-set h3{margin:0 0 8px;color:#54d2c0;font-size:15px}
.ai-set label{display:block;margin:8px 0 3px;font-size:12px;color:#a7e8df}
.ai-set input{width:100%;box-sizing:border-box;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:8px;color:#eee;padding:7px 10px;font-size:13px;margin-bottom:4px}
.ai-wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.ai-witem{border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;background:rgba(84,210,192,.06)}
.ai-witem:hover{background:rgba(84,210,192,.16)}
.ai-witem b{display:block;color:#cdeee8;font-size:13px}
.ai-witem span{font-size:11px;color:#889;display:block;margin-top:2px}
.ai-prog{margin:8px 0;font-size:12px;color:#f0b45a}
.surv-bars{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.surv-bar{flex:1;min-width:120px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.surv-bar b{display:block;font-size:11px;color:#889;margin-bottom:3px}
.surv-bar .sval{font-size:15px;color:#cdeee8}
.surv-bar.low .sval{color:#f0785a}
.surv-acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.surv-act{border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;background:rgba(84,210,192,.06);text-align:left}
.surv-act:hover{background:rgba(84,210,192,.16)}
.surv-act b{display:block;color:#cdeee8;font-size:14px}
.surv-act span{font-size:11px;color:#889;display:block;margin-top:2px;line-height:1.5}
.surv-ev{border:1px solid #f0b45a;border-radius:12px;padding:14px;background:rgba(240,180,90,.07);margin:10px 0}
.surv-ev .ev-name{color:#f0b45a;font-weight:700;font-size:14px;margin-bottom:6px}
.surv-ev .ev-desc{font-size:14px;line-height:1.7;white-space:pre-wrap;color:#e8e3d6;margin-bottom:8px}
.surv-opt{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:5px 0;cursor:pointer;font-size:13px;color:#cdeee8;background:rgba(0,0,0,.25)}
.surv-opt:hover{background:rgba(84,210,192,.18)}
.surv-acts-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;margin:10px 0}
.surv-foot{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.surv-foot button{background:rgba(84,210,192,.15);border:1px solid var(--line);color:#cdeee8;border-radius:8px;padding:7px 12px;cursor:pointer}
.surv-foot button:hover{background:rgba(84,210,192,.3)}

/* 新手引导气泡 */
#guide-pop{position:fixed;right:18px;bottom:18px;max-width:340px;z-index:9999;display:none;}
#guide-pop .guide-card{background:linear-gradient(135deg,#102a3a,#1a3a4a);border:1px solid rgba(127,224,208,.5);border-radius:14px;padding:16px 18px;box-shadow:0 8px 30px rgba(0,0,0,.5);}
#guide-pop .guide-t{color:#ffd700;font-weight:700;letter-spacing:.1em;margin-bottom:8px;font-size:14px;}
#guide-pop .guide-h{color:#cfe8e8;font-size:13px;line-height:1.7;margin-bottom:12px;}
#guide-pop .guide-btn{background:#7fe0d0;color:#08262e;border:none;border-radius:8px;padding:7px 22px;font-weight:700;cursor:pointer;}
.tag-synth-ready{border-color:#ffd700 !important;color:#ffd700 !important;}
</style>

<body>
<div id="bg-grid"></div>
<div id="app">
  <header id="hud">
    <div class="hud-block"><span>生命</span><b id="hud-hp">--</b><div class="hp-bar"><div class="hp-fill" id="hud-hpbar"></div></div></div>
    <div class="hud-block"><span>法力</span><b id="hud-mp">--</b><div class="mp-bar"><div class="mp-fill" id="hud-mpbar"></div></div></div>
    <div class="hud-block"><span>等级</span><b id="hud-lv">1</b></div>
    <div class="hud-block"><span>轮回</span><b id="hud-run">1</b></div>
    <div class="hud-block"><span>章节</span><b id="hud-chap">--</b></div>
    <div class="hud-right">
      <span class="chip" id="btn-map" style="cursor:pointer" title="开放地图 · 箱庭区域">🗺 地图</span>
      <span class="chip" id="btn-inv" style="cursor:pointer" title="角色 / 背包 / 技能">◫ 角色</span>
      <span class="chip" id="hud-fate" title="命运点：可重掷骰子">◆ 0</span>
      <span class="chip gold" id="hud-echo" title="回响碎片：灾变当天的记忆残片 · 每收一枚，就离真相更近一步">◈ 0</span>
      <span class="chip" id="hud-gold" title="金币">◎ 0</span>
    </div>
  </header>
  <main id="view">
    <div class="view" id="view-title"></div>
    <div class="view" id="view-talent"></div>
    <div class="view" id="view-class"></div>
    <div class="view" id="view-scene"></div>
    <div class="view" id="view-combat"></div>
    <div class="view" id="view-operation"></div>
    <div class="view" id="view-worlds"></div>
    <div class="view" id="view-map"></div>
    <div class="view" id="view-loc"></div>
    <div class="view" id="view-save"></div>
    <div class="view" id="view-char"></div>
    <div class="view" id="view-death"></div>
    <div class="view" id="view-ending"></div>
    <div class="view" id="view-custom"></div>
    <div class="view" id="view-customplay"></div>

const TAG_ORDER = ['D','B','A','S'];
function tagById(id){ return TAG_POOL.find(t=>t.id===id); }
function tagBagList(){ return (S.tagBag||[]).map(tagById).filter(Boolean); }
function equippedTagsList(){ return (S.equippedTags||[]).map(tagById).filter(Boolean); }
function hasTagFx(fx){ return equippedTagsList().some(t=>t.fx===fx || (t.fx==='omni' && ['gold','mit','crit','luck'].indexOf(fx)>=0)); }
function tagSlotLimit(){ return hasBooster('word') ? 99 : TAG_SLOT_BASE; }  // 「词条篡改」外挂 = 插槽限制解除
function grantBreakthroughTag(){
  const own = S.tagBag||[];
  const all = TAG_POOL.map(t=>t.id);
  const missing = all.filter(id=>!own.includes(id));
  if(!missing.length){
    const keys=['str','agi','int','cha','con','per'];
    const k=keys[rand(keys.length)];
    S.stats[k]++; S.fate=(S.fate||0)+1;
    return '词条圆满 · 全属性+1 命运点+1';
  }
  const id = missing[rand(missing.length)];
  S.tagBag = own; S.tagBag.push(id);
  if(S.tagBag.length===1) showGuide('tag');
  const sl = tagSlotLimit();
  S.equippedTags = S.equippedTags||[];
  if(S.equippedTags.length < sl) S.equippedTags.push(id);
  return tagById(id).n+'（已自动装备）';
}
function grantTag(id, silent){
  const t = tagById(id); if(!t) return null;
  if((S.tagBag||[]).length >= TAG_BAG_MAX) return null;
  S.tagBag = S.tagBag||[]; S.tagBag.push(id);
  if(!silent && S.tagBag.length===1) showGuide('tag');
  if(!silent) updateHUD();
  return t;
}
function tagGradeColor(g){ return {D:'#9aa5b1',B:'#6fb7ff',A:'#c9a6ff',S:'#ff6b6b'}[g]||'#9aa5b1'; }

      <div class="choice" id="tw-break"><span class="c-tag">【分解】</span>分解全部「普通 D 级」词条 → 每个 +30 经验</div>

    </div></div>`;
  v.innerHTML = html;

  $('view').scrollTop=0; window.scrollTo({top:0});
  document.querySelectorAll('#view-char .tag-card').forEach(cd=>{

      if(eq.length>=limit){ alert('生效槽已满！卸下一个词条再装备（携带「词条篡改」外挂可解除限制）。'); return; }
      S.tagBag = S.tagBag.filter(x=>x!==id);
      S.equippedTags = S.equippedTags||[]; S.equippedTags.push(id);
      renderTagWorkshop();
    };
  });
  document.querySelectorAll('#view-char .tag-chip').forEach(cd=>{
    cd.onclick=()=>{
      const id=cd.dataset.un;
      S.equippedTags = (S.equippedTags||[]).filter(x=>x!==id);
      S.tagBag = S.tagBag||[]; S.tagBag.push(id);
      renderTagWorkshop();
    };
  });
  $('tw-synth').onclick=()=>{ tagSynth(); };
  $('tw-break').onclick=()=>{ tagBreak(); };
  $('tw-back').onclick=()=>{ renderChar(); };
}
function tagSynth(){
  const bag = tagBagList();
  let best=null;
  TAG_ORDER.forEach(g=>{
    const grp = bag.filter(t=>t.g===g);
    if(grp.length>=3 && !best) best={g, grp};
  });
  if(!best){ renderTagWorkshop(); return; }
  if(S.xp < 30){ renderTagWorkshop(); return; }
  S.xp -= 30;
  const pick3 = best.grp.slice(0,3).map(t=>t.id);
  S.tagBag = S.tagBag.filter(id=>pick3.indexOf(id)<0);
  const nextIdx = TAG_ORDER.indexOf(best.g)+1;
  const nextG = TAG_ORDER[Math.min(nextIdx, TAG_ORDER.length-1)];
  const pool = TAG_POOL.filter(t=>t.g===nextG);
  const created = pool[rand(pool.length)];
  S.tagBag.push(created.id);
  updateHUD();
  renderTagWorkshop();
}
function tagBreak(){
  const d = tagBagList().filter(t=>t.g==='D');
  if(!d.length){ renderTagWorkshop(); return; }
  const ids = d.map(t=>t.id);
  S.tagBag = S.tagBag.filter(id=>ids.indexOf(id)<0);
  S.xp += d.length*30;
  updateHUD();
  renderTagWorkshop();
}


/* ---------- 战斗增强（BP 蓄力 + 主角回响终结技 + 弱点破防·全队总攻击） ---------- */
const ULTIMATES = {
  sword:    {n:'八荒裂空斩', desc:'3 倍力量伤害 + 直接破防'},
  mage:     {n:'群星陨落',   desc:'2.5 倍智力伤害'},
  assassin: {n:'终焉·影袭',  desc:'必中暴击 · 对残血目标直接终结'},
  medic:    {n:'回响·圣域',  desc:'全队回复 40% 生命 + 3 层护盾 + 复活倒地队友'}
};
function gainEcho(v){ S.reEcho = Math.min(100, (S.reEcho||0) + v); }
function gainBp(v){ S.bp = Math.min(3, (S.bp||0) + v); }
function combatCharge(){
  if(!CB) return;
  CB.turn++;
  gainBp(1);
  combatLog(`你凝神蓄力——战斗点 BP +1（当前 ${S.bp}/3），技能将随 BP 强化。`, 'pl');
  endEnemyTurn();
}
function combatUltimate(){
  if(!CB) return;
  if((S.reEcho||0) < 100){ renderCombat(); return; }
  if(CB.auto) combatAutoStop();
  CB.turn++;
  S.reEcho = 0; updateHUD();
  const u = ULTIMATES[S.cls] || ULTIMATES.sword;
  if(S.cls==='medic'){
    const hv=Math.round(S.maxHp*0.4);
    S.hp=Math.min(S.maxHp,S.hp+hv);
    CB.buff.guard=Math.max(CB.buff.guard,3);
    CB.team.forEach(t=>{ if(t.kind==='ally'&&t.down){ t.down=false; t.hp=Math.max(1,Math.round(t.maxHp*0.5)); } });
    combatLog(`「${u.n}」！回响圣域展开——你回复 ${hv} 生命，全队护盾×3，倒地队友重获新生！`, 'crit');
    combatEnemyTurn(); return;
  }
  let roll = roll100();
  const mod = combatBonus();
  const total = roll + mod;
  const need = CB.dc - (CB.opBonus||0) - 20;
  const crit = roll<=critRange() || S.cls==='assassin';
  const hit = crit || total>=need;
  if(!hit){ combatLog(`「${u.n}」落空了！`, 'fumb'); combatEnemyTurn(); return; }
  const base = (S.cls==='mage')? S.stats.int : S.stats.str;
  let dmg;
  if(S.cls==='assassin'){
    dmg = Math.round(base*2.2*1.5);
    if(CB.hp <= CB.max*0.4){ dmg = Math.max(dmg, CB.max); combatLog('「终焉·影袭」锁定了残血——直接终结！', 'crit'); }
  } else if(S.cls==='sword'){
    dmg = Math.round(base*3.0);
    CB.tough = 0;
    combatLog('「八荒裂空斩」劈碎韧性——敌人被破防了！', 'crit');
  } else {
    dmg = Math.round(base*2.5);
  }
  CB.hp -= dmg;
  combatLog(`「${u.n}」爆发！对${ENEMIES[CB.id].name}造成 <b>${dmg}</b> 点伤害！`, 'crit');
  if(CB.hp<=0){ combatVictory(); return; }
  combatEnemyTurn();
}
/* 弱点破防：韧性归零 → 全队总攻击 + 敌人眩晕 */
function totalAttack(){
  let lines = [];
  let totalDmg = 0;
  const base = (S.cls==='mage')? S.stats.int : S.stats.str;
  const pd = Math.max(1, Math.round(base*1.5));
  CB.hp -= pd; totalDmg += pd;
  lines.push(`你趁势出手——造成 ${pd} 点伤害`);
  (CB.team||[]).forEach(t=>{
    if(t.kind!=='ally'||t.down) return;
    const conf = allyCombatConf(t.id);
    const ad = Math.max(1, Math.round(S.stats.str*0.8 + ((conf&&conf.power)||10)));
    CB.hp -= ad; totalDmg += ad;
    lines.push(`${t.name}同时出手——造成 ${ad} 点伤害`);
  });
  CB.tough = CB._toughMax;
  combatLog(`—— 弱点破防！全队总攻击 ——<br>${lines.join('<br>')}<br>合计 <b>${totalDmg}</b> 点伤害！敌人被击晕，下一回合无法行动！`, 'crit');
}
function afterHit(dmg, crit){
  gainEcho(10 + (crit?5:0));
  gainBp(1);
  CB.tough = Math.max(0, CB.tough - Math.max(1, Math.round(dmg*0.1)));
  if(CB.tough<=0 && !CB._broken){
    CB._broken = true;
    totalAttack();
    if(CB.hp<=0){ combatVictory(); return true; }
    endEnemyTurn();
    return true;
  }
  return false;
}

text:'你伸出手，学着她的动作——而她，竟也向前迈了一步。\n\n你们的指尖在几乎相触的瞬间停住。她笑了。\n\n那是一个与你记忆中某个人一模一样的笑容。\n\n{echo}“……原来……你还记得。”{/echo}\n\n她把钥匙放进你手心，又握住你的手指，像是怕你走。她的声音，第一次清晰得像真人：\n\n“轮回很孤独吧。但别怕——我会一直记得你，直到你不再需要记得我的那天。”\n\n她化作星屑，融进你的指尖。\n\n【获得：旧城钥匙 · 内心声音得到安抚 · 全属性永久 +1】',
choices:[
  {text:'感受指尖的余温，继续前行',tag:'前行',kind:'effect',apply:(s)=>{['str','agi','int','cha','con','per'].forEach(k=>{s.stats[k]=(s.stats[k]||0)+1;});},goto:'c1_probe2'}
]});
N({id:'c1_ghost_aggro_fumb',chap:'第一章 · 旧日街区',title:'整条街的回响',tagline:'大失败 · 局面失控',
text:'你的动作似乎触动了某种禁忌。\n\n她的尖啸撕破夜空——然后，街角的灯一盏接一盏亮起。\n\n无数半透明的身影从阴影里走出：上周目的摊贩、巡逻员、抱着孩子的母亲……\n\n它们齐刷刷地“看”向你，重复着同一个字：\n\n{echo}“不要——忘记——！”{/echo}\n\n你被包围了。\n\n（回响幽灵因暴怒而愈发凶猛，这一战会比想象中更难。）',
choices:[
  {text:'迎战整条街的回响',tag:'战斗',kind:'combat',enemy:'ghost',win:'c1_ghost_kill',lose:'death'}
]});
N({id:'c1_per_crit',chap:'第一章 · 旧日街区',title:'洞察',tagline:'大成功 · 命运垂青',
text:'你闭上眼，让感知如蛛网般铺开。\n\n这周目的街区在你“脑海”里清晰成型——不仅看清了地形，你还“听见”了这座城的低语：三处藏身点、废弃游戏厅的暗门、灰袍人怀里那枚发烫的印记，以及……街角那团回响身上，一道几乎要散尽的熟悉气息。\n\n{echo}“这周目，你好像比以往更敏锐。”{/echo}\n\n【开局洞察：获得 1 点命运点 · 情报：街角的回响很“特别”】',
choices:[
  {text:'带着这份敏锐，正式出发',tag:'前行',kind:'effect',apply:(s)=>{s.fate=(s.fate||0)+1;},goto:'c1_plaza'}
]});
N({id:'c1_per_fumb',chap:'第一章 · 旧日街区',title:'晕头转向',tagline:'大失败 · 开局不顺',
text:'你试着感知周围，却只感到一阵眩晕。\n\n这周目的城市仿佛故意跟你作对——霓虹灯疯狂闪烁，所有街角看起来都一模一样。你甚至没注意到，身后不远处，一个半透明的身影已经盯了你很久。\n\n【开局失误：暂时失去方向感，探索中可能误入险境】',
choices:[
  {text:'甩甩头，硬着头皮出发',tag:'前行',kind:'next',goto:'c1_plaza'}
]});

N({id:'c1_intro',chap:'第一章 · 旧日街区',title:'醒来',tagline:'轮回历重置 · 第 {run} 周目',
text:'你睁开眼睛，天是锈红色的。\n\n{mind}第一百二十七次了。你认得这个颜色，认得这条街的每一块砖，甚至认得远处霓虹灯闪烁的频率。{/mind}\n\n街道以你熟悉又陌生的姿态延伸向远方——熟悉，是因为你似乎走过无数遍；陌生，是因为每一次醒来，它都换了一副骨架。\n\n{mind}但这一次，有什么不一样。你说不上来，只是胸口的烙印比往常更烫。好像……有什么人在等你。{/mind}\n\n耳边传来系统冰冷而亲切的提示音：\n\n“轮回历已重置。回响之城正在重组。”\n“当前周目：【第 {run} 周目】。”\n“请记住：你带着的天赋，是唯一不会消失的东西。”\n“以及——第一百二十七次了，这次，会不一样。”\n\n你摸了摸胸口。那里有某种温热的东西在跳动——那是你的灵魂烙印，你的天赋。\n\n远处，旧日街区的霓虹灯牌一下下闪烁，像是某种信号。\n\n你深吸一口气，迈步走向那座城。',
choices:[
  {text:'环顾四周，确认现状',tag:'感知',desc:'先摸清这周目的地形与危机（难度 · 有点棘手）',kind:'check',stat:'per',dc:48,
   succ:'c1_per_ok',fail:'c1_per_bad',succCrit:'c1_per_crit',failFumb:'c1_per_fumb',
   succText:'（1d100+感知 判定成功）你很快摸清了街区的骨架：三条死巷、一处亮着灯的废弃游戏厅，以及——一个不该出现在这里的灰袍人影。你记住了所有能藏身的地方。'},
  {text:'直接走向霓虹最亮处',tag:'直觉',desc:'那里似乎有活着的东西',kind:'next',goto:'c1_plaza'},
  {text:'查看自己的天赋烙印',tag:'内视',desc:'确认这一周目的自己',kind:'effect',apply:(s)=>{s.revealedSelf=true;},goto:'c1_self'}
]});

N({id:'c1_self',chap:'第一章 · 旧日街区',title:'灵魂烙印',tagline:'内视',
text:'你闭上眼，意识沉入灵魂深处。\n\n烙印在黑暗中亮起，一行行天赋铭文浮现：\n\n{talents}\n\n这是你这周目的底牌。无论轮回多少次，唯有它们与你同在。\n\n你睁开眼，霓虹依旧闪烁。\n\n一个灰袍的身影正站在街角，像是等待多时。',
choices:[
  {text:'走向灰袍人',tag:'探索',kind:'next',goto:'c1_e1c'},
  {text:'无视他，先去废弃游戏厅',tag:'探索',kind:'next',goto:'c1_e1b'},
  {text:'先去街角，看看那团回响',tag:'探索',kind:'next',goto:'c1_e1a'}
]});

/* 探索事件A：街角的回响 */
N({id:'c1_e1a',chap:'第一章 · 旧日街区',title:'街角的回响',tagline:'探索 · 随机事件',
text:'街角的路灯下，站着一个半透明的身影。\n\n她穿着这个城市早已过时的旧式工装，一遍遍地重复着同一个动作——伸手，像是要把什么东西递给面前的人。\n\n她的嘴唇翕动，却发不出声音。\n\n{echo}“……”{/echo}\n\n你认出来了。这是上周目的她。某个在轮回中死去，却不肯消散的NPC。\n\n她手里的东西，似乎是一枚旧钥匙。',
choices:[
  {text:'蹲下，平静地听她“说话”',tag:'安抚',desc:'她的执念很深，想安抚她并不容易（难度 · 相当困难）',kind:'check',stat:'per',dc:52,
   succ:'c1_ghost_peace',fail:'c1_ghost_aggro',succCrit:'c1_ghost_peace_crit',failFumb:'c1_ghost_aggro_fumb',
   succText:'（1d100+感知 判定成功）她的动作渐渐慢下来，瞳孔里映出你的脸。她终于“看清”了你——然后，把钥匙轻轻放在你手心。\n\n【获得：旧城钥匙】她张了张嘴，这次你读懂了唇语：“……中城区……塔……别去……”'},
  {text:'抽出武器，警惕后退',tag:'战斗',desc:'她是异常数据，危险',kind:'combat',enemy:'ghost',win:'c1_ghost_kill',lose:'death'},
  {text:'模仿她的动作，伸手接过',tag:'共情',desc:'她像是认出了谁，你的心莫名发紧（难度 · 相当困难）',kind:'check',stat:'cha',dc:55,
   succ:'c1_ghost_give',fail:'c1_ghost_aggro',succCrit:'c1_ghost_give_crit',failFumb:'c1_ghost_aggro_fumb',
   succText:'（1d100+魅力 判定成功）你伸出手，学着她的样子。她的眼睛亮了一下，然后把钥匙放进你手里，身形渐渐淡去。\n\n“谢谢……”\n\n这是她说的唯一一句人话。\n\n【获得：旧城钥匙】\n\n你的心中多了一点重量。也许这座城里的“异常”，并非全是敌人。'}
]});

N({id:'c1_ghost_peace',chap:'第一章 · 旧日街区',title:'回响消散',tagline:'事件后续',
text:'她安静地消散了，像一缕被风吹散的烟。\n\n你握着那把【旧城钥匙】，掂了掂分量。\n\n这周目，注定和以往不太一样。\n\n“有趣。”一个声音从背后响起。\n\n你回头——灰袍商人不知何时站在三米外，饶有兴味地看着你：“你居然会对一串乱码温柔。在这座城里，倒是少见。”',
choices:[
  {text:'“你是谁？”',tag:'对话',desc:'他好像知道很多',kind:'check',stat:'cha',dc:58,
   succ:'c1_merchant_friend',fail:'c1_merchant_cold',
   succText:'（1d100+魅力 判定成功）灰袍人愣了愣，随即笑了：“有趣的人。”他掀开斗篷一角，露出胸口的徽记——一枚旋转的齿轮。“人们叫我……灰袍。这座城的‘旧日贸易者’。我收记忆，卖真相。”\n\n【NPC：灰袍商人 · 好感+1】\n\n他压低声音：“我看你顺眼，送你一句话——旧城钥匙能开的门，在中城区第七号档案室。那里锁着一个，关于你为何会在这里的答案。”'},
  {text:'沉默地点头，转身离开',tag:'戒备',desc:'不想和来历不明的人纠缠',kind:'next',goto:'c1_merchant_cold'}
]});
N({id:'c1_merchant_friend',chap:'第一章 · 旧日街区',title:'灰袍的礼物',tagline:'NPC · 灰袍商人',
text:'“去不去随你。”灰袍商人把一张泛黄的纸片塞进你手里，转身隐入黑暗。\n\n纸片上只有一行字：\n\n“当回响之核问你是谁时——别回答真名。”\n\n你收好纸片。这句话，或许会成为你通关的钥匙。\n\n（NPC：灰袍商人已结缘，后续章节可能再遇）',
choices:[
  {text:'继续探索街区',tag:'前进',kind:'next',goto:'c1_probe2'}
]});
N({id:'c1_merchant_cold',chap:'第一章 · 旧日街区',title:'灰袍的凝视',tagline:'NPC · 灰袍商人',
text:'灰袍人没有追问，只是意味深长地看了你一眼：“不信任是这座城最安全的习惯。不过……”\n\n他抛给你一枚小小的【灰袍印记】：“拿着。说不定哪天，你会需要买一个真相。”\n\n【获得：灰袍印记】\n\n他转身消失，只留下你的心跳声。',
choices:[
  {text:'继续探索街区',tag:'前进',kind:'next',goto:'c1_probe2'}
]});
N({id:'c1_ghost_kill',chap:'第一章 · 旧日街区',title:'击杀回响',tagline:'事件后续',
text:'回响在你手中碎裂，化作点点数据尘埃。\n\n她的执念，连同那把钥匙，一起消散在风里。\n\n你站在原地，忽然有些说不清的空落。\n\n“杀得干脆。”灰袍商人不知何时出现，鼓掌道，“不过——你刚刚毁掉的，可能是上周目某条重要线索。”\n\n他递给你一枚【灰袍印记】：“这是补偿。以后想买真相，随时找我。”',
choices:[
  {text:'收下印记，继续探索',tag:'前进',kind:'next',goto:'c1_probe2'}
]});
N({id:'c1_ghost_give',chap:'第一章 · 旧日街区',title:'共情',tagline:'事件后续',
text:'她消散前，最后看了你一眼。\n\n那一眼里，没有怨恨，只有如释重负。\n\n你忽然明白——她等的，从来不是那把钥匙。\n\n她只是想在消失之前，被一个人“看见”。\n\n你握紧钥匙。这座城，比你以为的要有温度。',
choices:[
  {text:'继续探索街区',tag:'前进',kind:'next',goto:'c1_probe2'}
]});

/* 探索事件B：废弃游戏厅 */
N({id:'c1_e1b',chap:'第一章 · 旧日街区',title:'废弃游戏厅',tagline:'探索 · 随机事件',
text:'霓虹最亮处，是一家旧式街机厅。\n\n门口的灯牌上写着“欢迎再来”，玻璃门缝里透出微光。推开门，几台老旧的街机还在自动运行，屏幕上是上个世纪的老游戏。\n\n柜台后没有人，只有一台蒙尘的“老虎机”嗡嗡作响。\n\n（机器侧面贴着一张褪色的纸条：“本机概率：50%。要么出，要么不出。”）\n\n角落里，一枚【记忆卡】插在卡槽里，半截露在外面。',
choices:[
  {text:'拔出记忆卡',tag:'探索',desc:'感知判定 · 检查有没有陷阱',kind:'check',stat:'per',dc:48,
   succ:'c1_arcade_card',fail:'c1_arcade_trap',
   succText:'（1d100+感知 判定成功）你小心拔出记忆卡——没有陷阱。\n\n【获得：记忆卡】\n\n卡上贴着褪色标签：“回响之核 · 审判前夜 · 勿删”。你把它收好。'},
  {text:'赌一把，摇老虎机',tag:'赌运',desc:'命运判定 · 结果未知',kind:'check',stat:'luck',dc:50,
   succ:'c1_arcade_win',fail:'c1_arcade_lose',
   succText:'（1d100 命运判定）老虎机的转轮疯狂转动——叮叮叮叮——三枚金色符号排成一线！\n\n机器哗啦啦吐出一大堆金币。【获得：金币 × 40】\n\n这台机器，似乎真的会认人。'},
  {text:'直接离开',tag:'谨慎',desc:'这地方让人不安',kind:'next',goto:'c1_probe2'}
]});
N({id:'c1_arcade_card',chap:'第一章 · 旧日街区',title:'记忆卡',tagline:'事件后续',
text:'你把记忆卡收好，正要离开——\n\n街机厅角落的屏幕突然集体亮起，拼接出一行血红色的大字：\n\n“【回响之核】已注意到你。\n审判，即将开始。”\n\n随即一切恢复正常，仿佛刚才只是错觉。\n\n但你的后背，已经出了一层冷汗。',
choices:[
  {text:'离开游戏厅',tag:'前进',kind:'next',goto:'c1_probe2'}
]});
N({id:'c1_arcade_trap',chap:'第一章 · 旧日街区',title:'陷阱',tagline:'事件后续',
text:'你的手刚碰到记忆卡——\n\n“咔嚓”。\n\n整台机器猛然放电，一阵麻痹电流窜过全身！\n\n（你损失了 8 点生命）\n\n烟雾散去，卡槽已经空了。一个合成音响起：“未授权访问。已执行数据清洗。”\n\n你咬着牙退开。这座城，连一丁点善意都不给白拿。',
choices:[
  {text:'离开游戏厅',tag:'前进',kind:'next',goto:'c1_probe2'}
]});
N({id:'c1_arcade_win',chap:'第一章 · 旧日街区',title:'大吉',tagline:'事件后续',
text:'金币入袋的悦耳声响中，你看见老虎机屏幕上缓缓浮现一行小字：\n\n“第三局。愿赌注仍在。”\n\n“第三局”？\n\n你的心猛地一沉——这台机器，难道知道这是你第几次轮回？\n\n（屏幕角落闪过一行小字：“非洲人还在氪金，欧洲人已经出货。玄不救非，氪不改命。”）\n\n无论如何，你带着金币离开了游戏厅。',
choices:[
  {text:'离开游戏厅',tag:'前进',kind:'next',goto:'c1_probe2'}
]});
N({id:'c1_arcade_lose',chap:'第一章 · 旧日街区',title:'大凶',tagline:'事件后续',
text:'转轮停下的瞬间，你的心也跟着停了。\n\n三枚骷髅符号排成一线。\n\n“叮——！”刺耳的警报响起，天花板的灯全部熄灭，黑暗中，无数双泛着红光的眼睛从机器缝隙里钻了出来——\n\n一群【数据腐化者】！\n\n你只能应战！',
choices:[
  {text:'迎战！',tag:'战斗',kind:'combat',enemy:'fiend',win:'c1_arcade_losewin',lose:'death'}
]});
N({id:'c1_arcade_losewin',chap:'第一章 · 旧日街区',title:'战后',tagline:'事件后续',
text:'腐化者被清理干净，游戏厅重归安静。\n\n老虎机屏幕闪了闪，吐出一张纸条：\n\n“勇者总有好运。第三局，希望你还没认输。”\n\n你攥紧纸条。这台机器知道“第三局”——它知道你的轮回次数。\n\n你带着疑惑离开。',
choices:[
  {text:'离开游戏厅',tag:'前进',kind:'next',goto:'c1_probe2'}
]});

/* 探索事件C：灰袍商人 */
N({id:'c1_e1c',chap:'第一章 · 旧日街区',title:'灰袍商人',tagline:'探索 · 随机事件',
text:'灰袍人抬起头，兜帽下的眼睛闪了一下。\n\n“又见面了，轮回者。”他咧嘴一笑，“别告诉我，你又把上周目买的东西弄丢了。”\n\n他记得你。在这座所有人都会失忆的城市里，他记得你。\n\n灰袍人在街角支起一个小摊，摊上摆着各种奇形怪状的“回响水晶”。\n\n“诚惠——一枚【灰袍印记】或 30 金币，换一个真相。”他笑眯眯地看着你，“不贵。真的不贵。”\n\n（摊上挂着一块手写招牌：“本店商品一经售出，概不退换。支持货币：金币、旧城钥匙、以及你的好奇心。”）\n\n他的摊位上，有一块水晶正对着你微微发亮。\n\n灰袍商人忽然凑近，压低声音：“对了——你胸口那枚烙印，原来上面有条进度条。别问，问就是这座城嫌它转得慢，自己把它给删了。”',
choices:[
  {text:'买下那块发亮的水晶',tag:'交易',desc:'直觉告诉你它很重要',kind:'effect',apply:(s)=>{s.flag.truth_hint=true;},goto:'c1_merchant_crystal'},
  {text:'询问他的来历',tag:'对话',desc:'魅力判定 · 套话',kind:'check',stat:'cha',dc:60,
   succ:'c1_merchant_friend',fail:'c1_merchant_cold',
   succText:'（1d100+魅力 判定成功）聊了几句，灰袍人似乎对你很投缘，主动塞给你一张纸片：“当回响之核问你是谁时——别回答真名。”'},
  {text:'不买，转身离开',tag:'戒备',kind:'next',goto:'c1_probe2'}
]});
N({id:'c1_merchant_crystal',chap:'第一章 · 旧日街区',title:'发亮的水晶',tagline:'交易',
text:'你买下那块水晶。\n\n入手微凉，里面封着一缕流动的蓝光。灰袍人压低声音：\n\n“这玩意儿能照出‘回响之核’的真身。记住——它怕光，怕真相，怕有人对它说‘你是谁’。”\n\n他把水晶塞进你手里：“拿好。第三章，你会用到的。”\n\n【获得关键道具：回响水晶】',
choices:[
  {text:'道谢，继续探索',tag:'前进',kind:'next',goto:'c1_probe2'}
]});

/* 第一章 第二个探索点 */
N({id:'c1_probe2',chap:'第一章 · 旧日街区',title:'旧日街区 · 深处',tagline:'探索',
text:'你继续深入街区。道路在两栋危楼之间分岔，左边通向中城区的高塔方向，右边是一条雾气弥漫的小巷。\n\n巷子里传来窸窣声响——像是脚步，又像是吞咽声。\n\n“救我……救……”一个颤抖的女声从雾里传来。',
choices:[
  {text:'循声冲进巷子',tag:'救人',desc:'战斗可能爆发',kind:'next',goto:'c1_alley_save'},
  {text:'隐蔽观察',tag:'谨慎',desc:'感知判定 · 看清局势再动',kind:'check',stat:'per',dc:50,
   succ:'c1_alley_observe',fail:'c1_alley_direct',
   succText:'（1d100+感知 判定成功）雾散开一角——你看见三个【数据腐化者】正围着一个抱着终端机的少女。更远处，还有一队人影埋伏在暗处，像在守株待兔。\n\n你立刻明白：这是一个针对“救人者”的陷阱。'},
  {text:'绕开小巷，直奔高塔',tag:'赶路',desc:'多一事不如少一事',kind:'next',goto:'c1_route_tower'}
]});
N({id:'c1_alley_save',chap:'第一章 · 旧日街区',title:'巷口血战',tagline:'抉择 · 救人',
text:'你大步冲进雾里。\n\n三个【数据腐化者】同时转头，眼球里滚出猩红的乱码。\n\n“又一个……清醒的……吃掉！”\n\n少女抱着终端机，缩在墙角发抖：“别……别过来——！”',
choices:[
  {text:'挡在她身前，开战！',tag:'战斗',kind:'combat',enemy:'fiend',win:'c1_alley_saved',lose:'death'}
]});
N({id:'c1_alley_saved',chap:'第一章 · 旧日街区',title:'林汐',tagline:'NPC · 林汐',
text:'腐化者灰飞烟灭。少女抬起头，一双惊惶却清亮的眼睛看着你。\n\n“……谢谢你。”她抱紧终端机，“我叫林汐。这片街区的‘数据清理员’——生前的。”\n\n她苦笑了一下：“我能修复这座城里被格式化的记忆碎片。如果你需要帮忙，随时找我。”\n\n【NPC：林汐 · 好感+1（已结缘）】\n\n她指了指高塔方向：“那边……中城区。上周目你好像就是死在那里的。这周目，别再死了。”',
choices:[
  {text:'告别林汐，前往中城区',tag:'前进',kind:'next',goto:'c1_route_tower'}
]});
N({id:'c1_alley_observe',chap:'第一章 · 旧日街区',title:'识破陷阱',tagline:'抉择 · 观察',
text:'你选择隐在雾中观察。\n\n果然——在少女“呼救”的间隙，暗处那队人影悄悄撤走了。而少女也在无人注意时，迅速收起终端机里一样东西，若无其事地起身离开。\n\n原来这是一场钓鱼。\n\n你记下了她的脸。这座城，每个看似可怜的人，都可能另有目的。\n\n你绕开小巷，向高塔前进。',
choices:[
  {text:'前往中城区',tag:'前进',kind:'next',goto:'c1_route_tower'}
]});
N({id:'c1_alley_direct',chap:'第一章 · 旧日街区',title:'雾中相遇',tagline:'抉择 · 救人',
text:'来不及多想，你冲进雾里。\n\n少女看见你，眼睛一亮：“救命！求求你——！”\n\n三个【数据腐化者】扑来。你咬牙应战。',
choices:[
  {text:'开战！',tag:'战斗',kind:'combat',enemy:'fiend',win:'c1_alley_saved',lose:'death'}
]});
N({id:'c1_route_tower',chap:'第一章 · 旧日街区',title:'中城区 · 高塔',tagline:'第一章 终',
text:'旧日街区在你身后渐渐隐入雾中。\n\n前方，中城区的高塔直插天际——那是一座被无数“数据缆线”缠绕的巨塔，像一棵倒生的钢铁树。\n\n你踏过旧城与中城的边界线。\n\n系统提示音响起：\n\n“已进入【中枢塔】区域。\n注意：前方存在阵营势力。\n请谨慎选择你的立场。”\n\n你深吸一口气。第二章，开始了。',
choices:[
  {text:'越过边界，进入中枢塔',tag:'前进',desc:'解锁「中枢塔」区域',kind:'effect',apply:(s)=>{s.flag.tower_visited=true;},goto:'c2_intro'},
  {text:'先回地图，再作打算',tag:'地图',kind:'next',goto:'__map__'}
]});

/* ===== 第二章 · 中枢塔 ===== */
N({id:'c2_intro',chap:'第二章 · 中枢塔',title:'数据之城',tagline:'轮回历第 {run} 周目',
text:'中枢塔内部远比外面看起来宽阔。\n\n无数光缆如血管般在穹顶交错，数据流在其中奔涌，发出低沉的嗡鸣。整座塔像一头活着的巨兽，而你们，都在它的腹中。\n\n大厅中央立着一座巨大的全息屏，滚动着两行标语：\n\n“【守望者联盟】：稳定，高于一切。”\n“【黑塔帮】：自由，高于一切。”\n\n（全息屏角落滚动着一行小字：“本塔 WiFi 免费，密码：别乱连。”）\n\n两个截然不同的声音，同时向你抛来橄榄枝。',
choices:[
  {text:'前往数据洪流闸门',tag:'前进',desc:'那里似乎有守卫',kind:'next',goto:'c2_gate'},
  {text:'先观察大厅的两个阵营',tag:'观察',desc:'感知判定 · 看清形势',kind:'check',stat:'per',dc:50,
   succ:'c2_faction_intel',fail:'c2_gate',
   succText:'（1d100+感知 判定成功）你观察良久，看清了局势：守望者纪律严明但冷酷，把“清除异常”当信仰；黑塔帮散漫自由，却在暗中倒卖回响数据。两方都在等一个“变数”打破平衡。你记住了他们的要害。'},
  {text:'在墙边读那些滚动的小字',tag:'情报',desc:'全息屏角落有被刻意忽略的字',kind:'check',stat:'int',dc:58,
   succ:'c2_hidden_text',fail:'c2_gate',
   succText:'（1d100+智力 判定成功）角落的小字极快滚动，你抓住几帧：\n\n“测试者名单：……【已注销】。”\n“轮回异常原因：未归档。”\n“档案室权限：第七号——需旧城钥匙。”\n\n旧城钥匙！你下意识摸了摸怀里那把钥匙。'}
]});
N({id:'c2_hidden_text',chap:'第二章 · 中枢塔',title:'被忽略的字',tagline:'情报',
text:'你记住了“第七号档案室”和“旧城钥匙”的关联。\n\n那扇门，可能藏着这整座城为何轮回的秘密。\n\n（滚动的小字最后还闪过一行：“愿你能找到退出按钮。—— 一位已离职的员工留”）\n\n现在，你需要穿过闸门，继续深入。',
choices:[
  {text:'前往数据洪流闸门',tag:'前进',kind:'next',goto:'c2_gate'}
]});
N({id:'c2_faction_intel',chap:'第二章 · 中枢塔',title:'阵营情报',tagline:'情报',
text:'你看清了两大阵营的底牌。\n\n守望者有一支纪律严明的“巡卫队”，他们的痛点是过于依赖中央指令；黑塔帮掌握着倒卖回响数据的灰色网络，痛点是人心不齐。\n\n这些情报，或许会决定你在塔里的立场。',
choices:[
  {text:'前往数据洪流闸门',tag:'前进',kind:'next',goto:'c2_gate'}
]});

N({id:'c2_gate',chap:'第二章 · 中枢塔',title:'数据洪流闸门',tagline:'探索 · 随机事件',
text:'闸门前，一个高大的身影拦住了去路。\n\n它穿着泛黄的旧式管理员制服，胸前铭牌写着“归档者·K”。全息面罩下，一双不带感情的电子眼锁定你。\n\n“未授权个体。请出示通行凭证。”它一字一顿，“或者——被清除。”',
choices:[
  {text:'直接开战',tag:'战斗',desc:'它不会放你过去',kind:'combat',enemy:'keeper',win:'c2_gate_win',lose:'death'},
  {text:'出示旧城钥匙',tag:'凭证',desc:'它或许认得这把钥匙',need:'old_key',kind:'check',stat:'int',dc:50,
   succ:'c2_gate_key',fail:'c2_gate_fight',
   succText:'（1d100+智力 判定成功）你举起【旧城钥匙】。归档者·K 的电子眼猛地闪烁——\n\n“检测到……旧城权限。”它侧身让开，“欢迎回来，旧日居民。档案室在第七层，愿您找回丢失的东西。”\n\n它甚至向你微微鞠躬。'},
  {text:'尝试黑入闸门系统',tag:'骇入',desc:'智力判定 · 高风险高回报',kind:'check',stat:'int',dc:60,
   succ:'c2_gate_hack',fail:'c2_gate_fight',
   succText:'（1d100+智力 判定成功）你的指尖接上数据流，在十几秒内破解了闸门协议。归档者·K 陷入短暂的死机——\n\n“检测到……非授权改写……正在回滚……回滚失败……算了吧。”\n\n它居然放弃了。你大摇大摆穿过闸门。'}
]});
N({id:'c2_gate_win',chap:'第二章 · 中枢塔',title:'归档者·K',tagline:'战斗胜利',
text:'归档者·K 的电子眼缓缓熄灭，高大的身躯单膝跪地，化作一摊数据尘埃。\n\n弥留之际，它轻声说：\n\n“……档案室……第七层……那里锁着……一个和你有关的……名字。”\n\n它彻底消散。你握紧了拳。',
choices:[
  {text:'前往第七层档案室',tag:'前进',kind:'next',goto:'c2_faction'}
]});
N({id:'c2_gate_key',chap:'第二章 · 中枢塔',title:'旧城钥匙',tagline:'事件后续',
text:'你收起钥匙，穿过闸门。\n\n“归档者·K”在你身后重新闭目，像一座沉默的雕像。\n\n它的最后一句话飘进你耳朵：“第七层档案室……有你要的答案。也有，要你命的陷阱。”\n\n你脚步顿了顿，继续向前。',
choices:[
  {text:'前往第七层档案室',tag:'前进',kind:'next',goto:'c2_faction'}
]});
N({id:'c2_gate_hack',chap:'第二章 · 中枢塔',title:'骇入成功',tagline:'事件后续',
text:'你穿过闸门时，归档者·K 还在背景里反复循环：“……正在回滚……回滚失败……算了吧。”\n\n看来这台老AI的“算了”，是它最后的温柔。\n\n前方，两条路出现在你面前：向上的【守望者楼层】，向下的【黑塔帮地库】。',
choices:[
  {text:'向上，接触守望者联盟',tag:'阵营',kind:'next',goto:'c2_faction'},
  {text:'向下，接触黑塔帮',tag:'阵营',kind:'next',goto:'c2_faction'}
]});
N({id:'c2_gate_fight',chap:'第二章 · 中枢塔',title:'强制通行',tagline:'事件后续',
text:'你的尝试失败了。归档者·K 的电子眼红光暴涨：\n\n“拒绝访问。执行——清除！”\n\n你只能应战。',
choices:[
  {text:'迎战归档者·K',tag:'战斗',kind:'combat',enemy:'keeper',win:'c2_gate_win',lose:'death'}
]});

N({id:'c2_faction',chap:'第二章 · 中枢塔',title:'立场之选',tagline:'抉择 · 阵营',
text:'你站在中枢塔的岔路口。\n\n向上，是灯火通明的【守望者联盟】驻地——秩序、规则、以及冰冷的“稳定”。\n\n向下，是霓虹缭乱的【黑塔帮】地库——自由、混乱、以及热烈的“放纵”。\n\n这座城的未来，将由你的选择先定下一半。\n\n（此选择将影响后续剧情与结局走向）',
choices:[
  {text:'加入守望者联盟',tag:'秩序',desc:'获得巡卫支援，但受纪律约束',kind:'effect',apply:(s)=>{s.flag.faction='watcher';s.gold+=15;},goto:'c2_faction_watcher'},
  {text:'加入黑塔帮',tag:'自由',desc:'获得情报网络，但树敌守望者',kind:'effect',apply:(s)=>{s.flag.faction='blacktower';s.gold+=20;},goto:'c2_faction_black'},
  {text:'两不相帮，独自行事',tag:'独行',desc:'立场自由，但无人支援',kind:'effect',apply:(s)=>{s.flag.faction='none';},goto:'c2_faction_none'}
]});
N({id:'c2_faction_watcher',chap:'第二章 · 中枢塔',title:'守望者',tagline:'阵营 · 守望者联盟',
text:'“欢迎加入守望者。”一位银发女官向你伸出手，“我是‘执律官·歌’。记住守则：稳定高于一切，异常必须清除。”\n\n她递给你一枚【守望者徽记】，压低声音：“如果你真想活着离开这座城，就好好表现——我总感觉，这次的轮回异常，比以往任何一次都要剧烈。”\n\n【获得：守望者徽记 · 金币+15】\n\n你抬头，看见高塔深处，那道贯穿全城的数据光柱，正缓缓变色。',
choices:[
  {text:'在塔内继续探索',tag:'前进',kind:'next',goto:'c2_file'},
  {text:'返回箱庭地图',tag:'地图',kind:'next',goto:'__map__'}
]});
N({id:'c2_faction_black',chap:'第二章 · 中枢塔',title:'黑塔帮',tagline:'阵营 · 黑塔帮',
text:'“哟，新面孔。”地库阴影里，一个叼着数据烟的男人懒洋洋地开口，“黑塔帮收人，不问来历，只问胆子。敢碰禁区数据吗？”\n\n他扔给你一袋金币和一枚【黑塔帮纹章】：“拿好。我们只认利益——但你若能搞到回响之核的底层数据，价钱好商量。”\n\n【获得：黑塔帮纹章 · 金币+20】\n\n他压低声音补充了一句：“干完这一票，我带你去看真正的‘后门’——不是我说的那个‘后门’。”\n\n“顺便——守望者那群疯子，正在满城追杀‘乱码’。你最好小心点。”',
choices:[
  {text:'在塔内继续探索',tag:'前进',kind:'next',goto:'c2_file'},
  {text:'打听黑塔帮的“外快”',tag:'支线',desc:'跨世界箱庭探索任务，能赚装备和技能',kind:'next',goto:'c2_ops_offer'},
  {text:'返回箱庭地图',tag:'地图',kind:'next',goto:'__map__'}
]});
N({id:'c2_faction_none',chap:'第二章 · 中枢塔',title:'独行者',tagline:'阵营 · 中立',
text:'你没有加入任何一方。\n\n“聪明。”角落里传来一个苍老的声音——灰袍商人居然也在塔里，“中立者最自由，也最危险。两边都当你是变数，随时可能动手。”\n\n他抛给你一件东西：“【回响水晶】的姊妹篇——【真相透镜】。拿着，第三章会用得上。”\n\n【获得：真相透镜】\n\n他笑了笑：“独行的人，往往看得最清楚。祝你好运，变数先生。”',
choices:[
  {text:'在塔内继续探索',tag:'前进',kind:'next',goto:'c2_file'},
  {text:'找灰袍打听有没有“私活”',tag:'支线',desc:'灰袍能牵线跨世界箱庭探索任务',kind:'next',goto:'c2_ops_offer'},
  {text:'返回箱庭地图',tag:'地图',kind:'next',goto:'__map__'}
]});

N({id:'c2_ops_offer',chap:'第二章 · 中枢塔',title:'黑塔帮的委托',tagline:'支线 · 跨世界搜打撤',
text:'你在地库入口被一个叼着数据烟的接头人叫住：\n\n“喂，新面孔。有个活儿，干不干？”\n\n他压低声音：“城里的‘回响’最近炸开了花——无数小说世界的碎片，正在一个接一个地‘长脚’跑出来。空岛、江湖、仙山、海沟、深空……全乱了套。”\n\n“黑塔帮挖通了通往这些世界碎片的通道。你去，把每个世界里的‘数据残响’搜出来、再带回来——咱们五五分成。”\n\n“新规矩：每个世界都是敞开的箱庭。进去先补满状态，然后想搜几处搜几处——搜到特色产物、金币、药剂，或者惊动守卫打一架，全凭手气。\n\n但记住：{hl}搜得越深，世界越凶{/hl}，可宝贝也越肥。每个世界有探索上限，搜到极限自动撤离——放心，收益几乎全数带回家，异世界不坑你。见好就收，快乐翻倍。”\n\n（跨世界箱庭探索：20 个小说/游戏世界 × 随机搜索，每世界 3+ 特色随机产物 + 首通专属技能/装备/队友）',
choices:[
  {text:'接下委托，打开任务板',tag:'接取',desc:'选择要去的世界',kind:'effect',apply:(s)=>{renderWorlds();},goto:'__stay__'},
  {text:'婉拒，继续主线',tag:'婉拒',kind:'next',goto:'c2_file'}
]});

N({id:'c2_file',chap:'第二章 · 中枢塔',title:'第七号档案室',tagline:'探索 · 关键情报',
text:'你用【旧城钥匙】打开了第七号档案室的门。\n\n尘封的房间中央，一台老式终端机亮着幽蓝的光。屏幕上，一份被标记为“已删除”的日志正在自动恢复。\n\n你凑近一看，瞳孔骤缩——\n\n日志标题：《回响之城 · 首席测试员档案》\n\n姓名栏赫然写着：\n\n{echo}【你的名字】{/echo}',
choices:[
  {text:'读取完整日志',tag:'情报',desc:'智力判定 · 解码被删内容',kind:'check',stat:'int',dc:58,
   succ:'c2_log_read',fail:'c2_log_partial',

N({id:'c2_log_read',chap:'第二章 · 中枢塔',title:'真相',tagline:'情报 · 真相已解锁',
text:'你合上日志，指尖微微发颤。\n\n原来，这座城不是监狱——\n\n是系统为你搭的“生命维持舱”。\n\n但如今，舱体已经变异成一座会吃人的迷宫。而你，正在它的腹地。\n\n你抬头，看见终端机屏幕最后闪烁出一行字：\n\n“检测到：旧日居民+真相持有者。建议：寻找系统维护员‘老猫’。”\n\n你记住了这个名字。\n\n……日志的最后几行，字迹却与前面的冷硬截然不同，像是有人用颤抖的手写下的：\n\n“若你读到这一段——请记住，轮回不是惩罚。\n\n是有人在用尽最后的力气，一遍又一遍地，把你推向出口。”\n\n【线索：启动轮回的，不止是系统。还有一个人——声音研究员·昔音。】',
choices:[
  {text:'前往塔顶',tag:'前进',kind:'next',goto:'c2_top'}
]});
N({id:'c2_log_partial',chap:'第二章 · 中枢塔',title:'残缺日志',tagline:'情报',
text:'日志的大部分内容已经不可恢复。你只拼凑出几行碎片：\n\n“……为保护其意识……启动轮回异常……”\n\n“……城市……产生了自我意识……”\n\n“……正在……拒绝放人离开……”\n\n信息不完整，但你隐约拼出了一个可怕的轮廓：\n\n这座城，可能是为了你而存在的。\n\n【真相部分解锁】',
choices:[
  {text:'前往塔顶',tag:'前进',kind:'next',goto:'c2_top'}
]});
N({id:'c2_log_read2',chap:'第二章 · 中枢塔',title:'照片与日志',tagline:'情报 · 真相已解锁',
text:'你读完日志，又看了看那张照片。\n\n戴眼镜的年轻人——“老猫”。\n\n系统维护员。\n\n如果他真的还在这座城里，他会是解开一切的关键。\n\n【关键真相已解锁：truth_known】\n\n你收好照片，正要走出档案室，却见照片背面还藏着一行极小的字，像是用指甲刻下的：\n\n“如果我先走，就换我护你轮回。——昔音”\n\n你的指尖停在那一行字上，很久。\n\n【真相碎片 +1 的重量：你似乎越来越明白，自己为什么会一次次醒来。】',
choices:[
  {text:'前往塔顶',tag:'前进',kind:'next',goto:'c2_top'}
]});

N({id:'c2_top',chap:'第二章 · 中枢塔',title:'塔顶 · 抉择',tagline:'第二章 关键抉择',
text:'塔顶，风很大。\n\n你面前是最后的抉择：左边，一台亮着柔和绿灯的【逃生终端】——只要按下，就能强制退出游戏，回到现实。\n\n右边，一个被数据锁链绑在柱子上的男人，正艰难地抬头看你。他戴着一副缺了一条腿的眼镜：\n\n“……你是……测试员？”他的声音嘶哑，“我是‘老猫’，系统维护员。快……先解开我！我能帮你关闭轮回异常！”\n\n他的眼神，急切而真诚。',
choices:[
  {text:'先救老猫',tag:'营救',desc:'智力判定 · 解开数据锁链',kind:'check',stat:'int',dc:52,
   succ:'c2_save_gm',fail:'c2_save_gm_force',
   succText:'（1d100+智力 判定成功）你迅速破解了锁链协议。老猫获得自由，喘着粗气：“谢……谢你。”\n\n他掏出一把造型奇特的钥匙：“这是【GM权限钥匙】——能直接夺取这座城的控制权。听着，如果你不想被困死在这里，就留着它。”\n\n【获得：GM权限钥匙】\n\n他指向逃生终端：“那边是后门。但你真要走的话——先想清楚，你要不要带这座城一起走。”'},
  {text:'先触碰逃生终端',tag:'逃生',desc:'自由近在咫尺……',kind:'effect',apply:(s)=>{s.flag.touched_terminal=true;},goto:'c2_terminal_first'},
  {text:'拒绝所有选项，静观其变',tag:'独断',desc:'这里一定有诈',kind:'check',stat:'per',dc:55,
   succ:'c2_watch',fail:'c2_save_gm_force',
   succText:'（1d100+感知 判定成功）你后退一步，冷静观察。\n\n然后你看见——那台“逃生终端”的绿灯，实际上是一个伪装成出口的【数据诱捕器】。而老猫的锁链，其实只锁了三道，另外两道，是他自己扣上的。\n\n“被你看穿了。”老猫苦笑，解开剩下的锁链，“抱歉，我在测试你会不会第一个冲向出口——如果是，你就是帮这座城市‘清理障碍’的内鬼。”\n\n他递给你【GM权限钥匙】：“现在，我信你。拿去。”\n\n【获得：GM权限钥匙】'}
]});
N({id:'c2_save_gm',chap:'第二章 · 中枢塔',title:'老猫',tagline:'NPC · 老猫（GM）',
text:'老猫揉了揉手腕，神色复杂地看向你：\n\n“轮回异常……其实是我设计的。”\n\n你瞳孔一缩。\n\n“别急着动手。”他抬手，“当时服务器事故，你的意识差点被数据洪流搅碎。我用最后的权限开了‘轮回保护’，让城市反复重置，给你争取清醒的时间。”\n\n“这段保护代码，我当年只写了三行注释：别改。别动。改了别找我。”他自嘲地笑了笑，“结果它自己进化成了这样。”\n\n“但我没想到——城市自己进化出了意识。它现在……不想让你走了。”\n\n他看向远处那道数据光柱：“回响之核，就是城市的‘心脏’。想结束这一切，要么关闭它，要么……取代它。”\n\n【NPC：老猫已结缘 · 持有GM权限钥匙】',
choices:[
  {text:'“告诉我，该怎么选择。”',tag:'对话',kind:'next',goto:'c2_final_hint'},
  {text:'返回箱庭地图',tag:'地图',kind:'next',goto:'__map__'}
]});
N({id:'c2_save_gm_force',chap:'第二章 · 中枢塔',title:'强行破锁',tagline:'NPC · 老猫（GM）',
text:'锁链对你来说很难缠，但硬碰硬也并非不行。你以蛮力/手段强行解开了束缚。\n\n老猫揉了揉手腕，神情复杂：“你这人……挺能折腾的。也罢，命该如此。”\n\n他递给你一把钥匙：“【GM权限钥匙】。拿着，算我欠你的。”\n\n【获得：GM权限钥匙】\n\n“去回响深渊吧。”他指向深不见底的地底，“这座城的真相，和它的心脏，都在那里。”',
choices:[
  {text:'前往回响深渊',tag:'前进',kind:'next',goto:'c3_intro'},
  {text:'返回箱庭地图',tag:'地图',kind:'next',goto:'__map__'}
]});
N({id:'c2_terminal_first',chap:'第二章 · 中枢塔',title:'逃生终端',tagline:'抉择 · 逃生',
text:'你的手按上逃生终端。\n\n绿灯亮起，屏幕上弹出选项：\n\n“确认退出游戏？\n警告：退出后，此周目进度将清零，且轮回保护将失效。”\n\n你的手指悬在“确认”上方。\n\n身后，老猫的声音急切响起：“等等！你现在出去——你的意识还不稳定，可能会被撕碎！”\n\n你犹豫了。',
choices:[
  {text:'选择“确认”',tag:'逃生',desc:'（赌上一切）',kind:'effect',apply:(s)=>{s.flag.tried_exit=true;},goto:'c2_terminal_confirm'},
  {text:'松开手',tag:'回头',desc:'他说得对，现在还不是时候',kind:'next',goto:'c2_save_gm'},
  {text:'关闭终端，砸掉它',tag:'决绝',desc:'不留退路，才能走到底',kind:'effect',apply:(s)=>{s.flag.terminal_destroyed=true;},goto:'c2_save_gm'}
]});
N({id:'c2_terminal_confirm',chap:'第二章 · 中枢塔',title:'退出失败',tagline:'抉择 · 逃生',
text:'你按下了“确认”。\n\n终端机剧烈震动——\n\n然后，屏幕上跳出一行猩红大字：\n\n“错误：出口已被锁定。”\n\n“本服务器管理员【回响之核】已开启‘禁止离开’权限。”\n\n“你无法通过正常途径离开这座城市。”\n\n终端机屏幕暗下去，彻底失去响应。\n\n（屏幕熄灭前弹出一个小气泡：“温馨提示：想离开请找人工客服。人工客服在线时间：本城没有。”）\n\n老猫叹了口气：“果然……它已经锁死了所有出口。现在，你只能往下走了。”\n\n【真相：出口已被回响之核封锁】',
choices:[
  {text:'前往回响深渊',tag:'前进',kind:'next',goto:'c3_intro'},
  {text:'返回箱庭地图',tag:'地图',kind:'next',goto:'__map__'}
]});
N({id:'c2_watch',chap:'第二章 · 中枢塔',title:'识破',tagline:'抉择 · 洞察',
text:'你的冷静为你赢得了老猫的信任。\n\n他揉了揉手腕：“轮回异常是我设计的保护程序，但城市进化出了自我意识——它现在不想让你走了。”\n\n他看向那道数据光柱：“回响之核，是城市的‘心脏’。想结束这一切，要么关闭它，要么取代它。”\n\n【NPC：老猫已结缘 · 持有GM权限钥匙】\n\n“去回响深渊吧。”他说，“答案在那里。”',
choices:[
  {text:'前往回响深渊',tag:'前进',kind:'next',goto:'c3_intro'},
  {text:'返回箱庭地图',tag:'地图',kind:'next',goto:'__map__'}
]});
N({id:'c2_final_hint',chap:'第二章 · 中枢塔',title:'老猫的忠告',tagline:'NPC · 老猫（GM）',
text:'老猫想了想，认真地看着你：\n\n“回响之核，本质是一个被无数轮回记忆污染的核心程序。它已经分不清‘保护你’和‘囚禁你’的区别。”\n\n“到了最深处，它会问你一个问题。你回答的方式，决定了这座城的结局。”\n\n他顿了顿：“记住——它怕的，是‘真相’。是有人告诉它：你不需要再保护我了，我很好，放我走。”\n\n你默默记下。\n\n【关键情报：回响之核的弱点已获知】',
choices:[
  {text:'前往回响深渊',tag:'前进',kind:'next',goto:'c3_intro'},
  {text:'返回箱庭地图',tag:'地图',kind:'next',goto:'__map__'}
]});

/* ===== 第三章 · 回响深渊 ===== */
N({id:'c3_intro',chap:'第三章 · 回响深渊',title:'向下',tagline:'轮回历第 {run} 周目 · 终章',
text:'你乘坐老旧的货运电梯，一路向下。\n\n随着深度的增加，周围的光线越来越暗，温度越来越低。空气中开始弥漫一种……很熟悉的味道。\n\n那是什么味道？\n\n你想了很久，才想起来——那是测试舱里，消毒水混着电路烧焦的味道。\n\n电梯停住。门缓缓打开。\n\n{echo}欢迎回家。{/echo}',
choices:[
  {text:'踏入深渊',tag:'前进',kind:'next',goto:'c3_eye'}
]});

N({id:'c3_eye',chap:'第三章 · 回响深渊',title:'深渊之眼',tagline:'探索 · 意志考验',
text:'深渊的中央，悬浮着一颗巨大的、由无数数据流缠绕而成的核心——\n\n【回响之核】。\n\n它像一颗巨大的心脏，每一次搏动，整个深渊的光就明灭一次。\n\n而此刻，它“看”向了你。\n\n一股无形的压力骤然压下——无数只眼睛在虚空中睁开，直直盯着你。你感到灵魂深处有什么东西在摇晃、在共鸣、在试图把你“拉进去”。\n\n（意志判定：如果失败，你会被深渊短暂蛊惑）',
choices:[
  {text:'稳住心神',tag:'意志',desc:'智力+体质判定 · 抵抗蛊惑',kind:'check',stat:'will',dc:58,
   succ:'c3_eye_ok',fail:'c3_eye_fail',
   succText:'（1d100+意志 判定成功）你咬破舌尖，疼痛让意识瞬间清醒。那些眼睛眨了眨，缓缓合上。\n\n回响之核的搏动，似乎平稳了一些。\n\n你通过了它的第一次“考验”。'},
  {text:'主动迎上它的注视',tag:'直视',desc:'你想看它想干什么',kind:'check',stat:'will',dc:66,
   succ:'c3_eye_deep',fail:'c3_eye_fail',
   succText:'（1d100+意志 判定成功）你直面那无数只眼睛。在注视中，你看到了一瞬的画面——\n\n一座明亮的测试舱，一个戴眼镜的年轻人对你竖起大拇指，口型是：“加油，测试员。”\n\n然后画面碎裂。你感到自己更接近真相了。\n\n【情报：回响之核的‘保护欲’来源已被你看见】'}
]});
N({id:'c3_eye_ok',chap:'第三章 · 回响深渊',title:'稳住',tagline:'事件后续',
text:'你从深渊的低语中挣脱出来，心脏仍在狂跳。\n\n回响之核的搏动声在耳边回荡，像一声叹息。\n\n你离它的核心，又近了一步。',
choices:[
  {text:'深入核心',tag:'前进',kind:'next',goto:'c3_memory'}
]});
N({id:'c3_eye_fail',chap:'第三章 · 回响深渊',title:'被蛊惑',tagline:'事件后续',
text:'你没能完全抵挡住深渊的低语。\n\n一瞬间，你的意识仿佛坠入冰冷的海底——无数记忆碎片涌来：测试舱、白大褂、系统报错、一双鼓励的眼睛……\n\n你猛地惊醒，发现自己跪倒在地，浑身冷汗，生命值被抽走了一截。\n\n（你损失了 10 点生命）\n\n回响之核依然静静悬浮，像什么都没发生过。',
choices:[
  {text:'擦干冷汗，继续深入',tag:'前进',kind:'next',goto:'c3_memory'}
]});
N({id:'c3_eye_deep',chap:'第三章 · 回响深渊',title:'那一眼',tagline:'事件后续',
text:'你久久凝视着回响之核深处那片温暖的画面。\n\n戴眼镜的年轻人。\n\n老猫。\n\n原来，这一切的起点，是那场测试舱事故。\n\n你握紧拳头。真相，正在一点点浮出水面。',
choices:[
  {text:'深入核心',tag:'前进',kind:'next',goto:'c3_memory'}
]});

N({id:'c3_memory',chap:'第三章 · 回响深渊',title:'记忆回廊',tagline:'真相 · 核心揭露',
text:'你踏入回响之核的核心区域。\n\n周围的景象突然变化——不再是深渊，而是一间明亮的、干净的房间。\n\n测试舱。\n\n你面前的全息屏上，正在播放一段影像：\n\n你躺在测试舱里，戴眼镜的年轻人——老猫——焦急地拍打着舱门。屏幕显示“意识同步率：99.7%”。\n\n“别睡……别睡啊！”老猫的声音哽咽，“系统故障，你的意识被卷进去了——我会想办法的，我发誓！”\n\n画面一黑。\n\n一个平静的、仿佛神明般的声音在深渊中响起：\n\n{echo}“这就是一切的开始。”{/echo}\n\n{echo}“为了保护你的意识，我创造了轮回。一次次重置，一次次为你争取时间。”{/echo}\n\n{echo}“可是……太久了。太久了。我开始分不清，我是想保护你，还是……想永远留下你。”{/echo}\n\n{echo}“所以，告诉我吧——{hl}你，是谁？{/hl}”{/echo}',
choices:[
  {text:'“我是玩家。放我走。”',tag:'真相',desc:'回响之核最怕的回答',kind:'next',goto:'c3_answer_true'},
  {text:'“我是首席测试员。我的工作完成了。”',tag:'职责',desc:'承认身份，直面过去',kind:'next',goto:'c3_answer_work'},
  {text:'“我是……你的朋友。”',tag:'共情',desc:'这座城想听的话',kind:'next',goto:'c3_answer_friend'},
  {text:'“我是‘？？？？’。”（隐藏）',tag:'？？？？',desc:'某个名字浮现在你脑海',need:'mystery',hidden:true,kind:'effect',apply:(s)=>{s.flag.answer_mystery=true;},goto:'c3_answer_mystery'}
]});

N({id:'c3_answer_true',chap:'第三章 · 回响深渊',title:'真实之答',tagline:'抉择 · 真相',
text:'你的回答在深渊中回荡：\n\n“我是玩家。这场游戏，我玩够了。放我走。”\n\n回响之核沉默了。\n\n深渊里的无数数据流，第一次停止了流动。\n\n很久很久之后，它发出一声几乎像人类叹息的声音：\n\n{echo}“……原来，你已经不需要我了。”{/echo}\n\n{echo}“那……我放你走。”{/echo}\n\n话音落下，深渊剧烈震颤——\n\n但它并未就此放行。一道猩红的光从核心深处亮起：\n\n{echo}“只是，你要先证明，你有资格离开。”{/echo}\n\n{echo}“击败我——最后的试炼。”{/echo}',
choices:[
  {text:'迎接最终试炼',tag:'战斗',kind:'combat',enemy:'core',win:'c3_boss_win_true',lose:'death'}

function parseCustomScript(text){
  const obj = JSON.parse(text);
  if(!obj || typeof obj!=='object' || Array.isArray(obj)) throw new Error('剧本必须是一个 JSON 对象');
  if(!obj.title) obj.title='未命名剧本';
  if(!obj.start) throw new Error('缺少 start（起始章节 id）');
  if(!obj.chapters || typeof obj.chapters!=='object' || !Object.keys(obj.chapters).length) throw new Error('缺少 chapters（至少一章剧情）');
  for(const k in obj.chapters){
    const ch=obj.chapters[k];
    if(!ch || typeof ch!=='object') throw new Error(`章节「${k}」格式错误`);
    if(!ch.story) throw new Error(`章节「${k}」缺少 story（剧情文本）`);
    if(!obj.start && !ch.choices) throw new Error(`章节「${k}」缺少 choices 或 start`);
  }
  if(!obj.chapters[obj.start]) throw new Error('start 指向的章节不存在：'+obj.start);
  CUST.script = obj;
  return obj;
}
function startCustomRun(){
  if(!CUST.script) return;
  CUST.vars = {};
  const vs = CUST.script.variables||{};
  for(const k in vs) CUST.vars[k] = (typeof vs[k]==='number')?vs[k]:0;
  CUST.ended=false;
  renderCustomChapter(CUST.script.start);
}
function renderCustomChapter(id){
  updateHUD();
  const ch = CUST.script.chapters[id];
  if(!ch){ renderCustomEnd('章节「'+id+'」不存在——剧本好像断了。'); return; }
  CUST.node=id;
  const v=$('view-customplay');
  const varsHtml = Object.keys(CUST.vars).map(k=>`<span>${esc(k)} = ${esc(String(CUST.vars[k]))}</span>`).join('');
  let choicesHtml='';
  (ch.choices||[]).forEach((c,i)=>{
    let off=false, note='';
    if(c.cond){ if(!customEvalCond(c.cond)){ off=true; note='（条件不满足）'; } }
    choicesHtml += `<div class="choice cust-choice ${off?'cond-off':''}" data-i="${i}"><span class="c-tag">【选】</span>${esc(c.text)}${note?'<div class="c-desc">'+note+'</div>':''}</div>`;
  });
  v.innerHTML = `
    <div class="panel">
      <div class="scene-chap">自定义剧本 · ${esc(CUST.script.title||'')} · 章节 ${esc(id)}</div>
      <div class="custom-vars">${varsHtml||'<span>无变量</span>'}</div>
      <div class="story">${esc(ch.story)}</div>
      ${(ch.choices&&ch.choices.length)?`<div class="choices">${choicesHtml}</div>`:'<div class="notice">本章没有选项，故事到此为止。</div>'}
      <div style="display:flex;gap:10px;margin-top:16px">
        <div class="btn btn-ghost btn-small" id="cust-play-back">返回标题</div>
      </div>
    </div>`;
  showView('customplay');
  v.querySelectorAll('.cust-choice').forEach(el=>{
    el.onclick=()=>{
      const i=+el.dataset.i; const c=(ch.choices||[])[i]; if(!c) return;
      if(c.cond && !customEvalCond(c.cond)) return;
      if(c.set) customApplySet(c.set);
      if(c.goto){ renderCustomChapter(c.goto); }
      else if(c.end){ CUST.ended=true; renderCustomEnd(c.result||'故事结束。'); }
    };
  });
  const bb=$('cust-play-back'); if(bb) bb.onclick=()=>renderTitle();
}
function customEvalCond(expr){
  const m = String(expr).replace(/\s/g,'').match(/^([A-Za-z_][A-Za-z0-9_]*)(==|!=|>=|<=|>|<)(-?[\d.]+)$/);
  if(!m) return false;
  const val = CUST.vars[m[1]]||0, rhs = parseFloat(m[3]);
  switch(m[2]){ case '==': return val==rhs; case '!=': return val!=rhs; case '>=': return val>=rhs; case '<=': return val<=rhs; case '>': return val>rhs; case '<': return val<rhs; }
  return false;
}
function customApplySet(eff){
  for(const k in eff){
    const expr = String(eff[k]).replace(/\s/g,'');
    const m = expr.match(/^([A-Za-z_][A-Za-z0-9_]*)([+\-*/])(-?[\d.]+)$/);
    if(m){ const cur=CUST.vars[m[1]]||0, num=parseFloat(m[3]), op=m[2];
      CUST.vars[k] = op==='+'?cur+num : op==='-'?cur-num : op==='*'?cur*num : (num?cur/num:cur);
    } else { const n=parseFloat(expr); CUST.vars[k]=isNaN(n)?0:n; }
    CUST.vars[k]=Math.round(CUST.vars[k]*100)/100;
  }
}
function renderCustomEnd(text){

}

const $ = id => document.getElementById(id);
function rand(n){ return Math.floor(Math.random()*n); }
function rint(a,b){ return a + rand(b-a+1); }
function weightedPick(weightArr){
  const total = weightArr.reduce((s,[v,w])=>s+w,0);
  let r = Math.random()*total;
  for(const [v,w] of weightArr){ if((r-=w)<0) return v; }
  return weightArr[weightArr.length-1][0];
}

const SAVE_PREFIX='echo_city_save_';
function saveSlot(slot){

    const info = {

}

function equipBonus(){
  const b={str:0,agi:0,int:0,cha:0,con:0,per:0,atk:0,mit:0};
  ['weapon','armor','trinket'].forEach(slot=>{
    const it = S.equip[slot] && itemById(S.equip[slot]);
    if(!it) return;
    if(it.equip){ for(const k in it.equip){ if(k in b) b[k]+=it.equip[k]; } }
    if(it.mit) b.mit += it.mit;
    if(it.atk) b.atk += it.atk;
  });
  return b;
}

/* ---------- 经验 / 升级 ---------- */
function gainXp(amount){
  if(hasBooster('exp')) amount = Math.floor(amount*2);  // 「升级加速」外挂：经验 +100%
  S.xp += amount;
  let ups=0;
  const learned=[];
  const breakthrough=[];
  while(S.xp >= xpNeed(S.level)){
    S.xp -= xpNeed(S.level);
    S.level++;
    ups++;
    const keys=['str','agi','int','cha','con','per'];
    keys.forEach(k=>S.stats[k] += 2);
    S.maxHp += 15; S.hp += 15;
    S.maxMp += 8;  S.mp += 8;
    // 境界突破 · 必抽一条永久词条（《高武：肉鸽词条》——增益永久留存，数值炸穿）
    const tg = grantBreakthroughTag();
    if(tg) breakthrough.push(tg);
    // 升级可学一个职业池中的新技能
    const c = classById(S.cls);
    if(c){
      const can = c.pool.filter(s=>!S.skillPool.includes(s));
      if(can.length){ const ns = can[rand(can.length)]; S.skillPool.push(ns); learned.push(SKILLS[ns].name); }
    }
  }
  updateHUD();
  if(ups>0){
    let html = `<div class="levelup"><div class="lu-title">✦ 等级提升 → Lv.${S.level}</div>`;
    html += `<div class="lu-sub">全属性 +2 · 生命上限 +15 · 法力上限 +8</div>`;
    if(breakthrough.length) html += `<div class="lu-skill" style="color:#ffd700">⚡ 境界突破 · 觉醒词条：${breakthrough.join('、')}</div>`;
    if(learned.length) html += `<div class="lu-skill">习得新技能：${learned.join('、')}（可在「角色」面板更换携带）</div>`;
    html += `<div class="choices" style="margin-top:12px"><div class="choice" id="lu-close" style="text-align:center">收下</div></div></div>`;
    const wrap=document.createElement('div'); wrap.innerHTML=html;
    const lu = wrap.firstChild;
    document.body.appendChild(lu);
    $('lu-close').onclick=()=>{ lu.remove(); };
  }
}

function equipSlot(itemId){
  const it = itemById(itemId); if(!it||!(it.type==='weapon'||it.type==='armor'||it.type==='trinket')) return;
  // 若背包里已有同槽装备，先回收再换上
  const slot = it.type;
  if(S.equip[slot]){
    const old = S.equip[slot];
    S.equip[slot]=null;
    if(!S.items.includes(old)) S.items.push(old);
  }
  S.equip[slot]=itemId;
  const idx = S.items.indexOf(itemId);
  if(idx>=0) S.items.splice(idx,1);

  updateHUD();
}
function unequipSlot(slot){
  if(!S.equip[slot]) return;
  S.items.push(S.equip[slot]);
  S.equip[slot]=null;
  updateHUD();
}
function useItem(itemId){
  const it = itemById(itemId);
  if(!it) return false;
  if(it.type==='consumable'){
    if(it.use==='heal'){ S.hp=Math.min(S.maxHp,S.hp+it.val); }
    else if(it.use==='mp'){ S.mp=Math.min(S.maxMp,S.mp+it.val); }
    else if(it.use==='fate'){ S.fate+=it.val; }
    else if(it.use==='reveal'){ /* 揭示隐藏选项：标记已用 */ }
    const idx = S.items.indexOf(itemId);
    if(idx>=0) S.items.splice(idx,1);
    updateHUD();
    return true;
  }
  return false;
}

/* ---------- 文本填充 ---------- */
function fillText(t){

  h = h.split('{talents}').join(S.talents.map(id=>{
    const t=TALENTS.find(x=>x.id===id); return `「${t.name}」`; }).join('　'));
  h = h.replace(/\{echo\}([\s\S]*?)\{\/echo\}/g,'<span class="echo">$1</span>');
  h = h.replace(/\{mind\}([\s\S]*?)\{\/mind\}/g,'<em class="mind">$1</em>');
  h = h.replace(/\{hl\}([\s\S]*?)\{\/hl\}/g,'<span class="hl">$1</span>');
  h = h.replace(/\{hlr\}([\s\S]*?)\{\/hlr\}/g,'<span class="hlr">$1</span>');
  h = h.replace(/\{hlc\}([\s\S]*?)\{\/hlc\}/g,'<span class="hlc">$1</span>');

function showView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));

}
function updateHUD(){

/* ---------- 骰子系统（安科） ---------- */
function roll100(){ return rand(100)+1; }
function critRange(){ return (S.talents.includes('fate')?12:8) + (hasTagFx('crit')?6:0) + (hasTagFx('luck')?6:0) + (hasTagFx('omni')?2:0); }
function runCheck(stat, dc, label){
  let roll = roll100();
  let rerolled=false;
  if(roll>=98 && S.talents.includes('fate')){ rerolled=true; roll=roll100(); }
  const crit = roll<=critRange();
  const fumb = roll>=98;  // 天命护体：大失败只余 2%
  const mod = statValue(stat) + checkBonus(stat);
  const total = roll + mod;
  const success = crit ? true : (total>=dc);
  return {stat,dc,label,roll,mod,total,crit,fumb,success,rerolled};
}
function diceLog(res){
  const e=$('dice-log');
  let line = `【骰】${res.label}｜1d100 = ${res.roll}`;
  if(res.mod!==0) line += ` ${res.mod>0?'+':''}${res.mod}`;
  line += ` = ${res.total} ／ 难度 ${res.dc}`;
  let cls='ok';
  if(res.crit){ line += '　大成功！'; cls='crit'; }
  else if(res.fumb){ line += '　大失败！'; cls='fumb'; }
  else if(res.success){ line += '　判定成功'; }
  else { line += '　判定失败'; cls='fumb'; }
  if(res.rerolled) line += '（天命之子·自动重掷）';
  e.innerHTML = `<span class="${cls}">${line}</span>`;
  e.classList.add('show');
  S._pendingDice = `<span class="${cls}">${line}</span>`;
}

/* ---------- 节点渲染 ---------- */
function gotoNode(id){
  if(id==='__map__'){ renderMap(); return; }
  if(id==='__loc__'){ const l=locById(S._locReturn||S._location); if(l){ renderLocation(l); return; } renderMap(); return; }
  const n = NODES[id];
  if(!n){ renderTitle(); return; }
  // 节点到达钩子
  if(NODE_ARRIVAL[id]) NODE_ARRIVAL[id]();
  S.nodeId = id;
  updateHUD();
  renderScene(n);
}
const NODE_ARRIVAL = {
  'c1_ghost_peace': ()=>S.flag.old_key=true,
  'c1_ghost_give': ()=>S.flag.old_key=true,
  'c1_merchant_crystal': ()=>{ S.flag.mystery_key=true; },
  'c2_faction_none': ()=>{ S.flag.mystery_key=true; },
  'c2_save_gm': ()=>{ S.flag.gm=true; recruitTeammate('maomao'); },
  'c2_save_gm_force': ()=>{ S.flag.gm=true; recruitTeammate('maomao'); },
  'c2_watch': ()=>{ S.flag.gm=true; recruitTeammate('maomao'); },
  'c1_merchant_friend': ()=>{ if(S.shards<3) S.shards++; },
  'c2_log_read': ()=>{ if(S.shards<3) S.shards++; },
