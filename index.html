<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回响之城 · 轮回骰局</title>
<style>
/* ===== 主题令牌 ===== */
:root{
  --bg0:#0a0e18;
  --bg1:#0f1730;
  --bg2:#131d3a;
  --ink:#dbe3f2;
  --ink-dim:#8b95ad;
  --ink-faint:#5c6580;
  --gold:#e6a544;
  --gold-soft:#c9892f;
  --cyan:#54d2c0;
  --cyan-dim:#2d8f86;
  --red:#d5564a;
  --line:rgba(120,150,210,0.16);
  --line-strong:rgba(160,190,255,0.3);
  --panel:rgba(18,26,52,0.72);
  --panel-solid:#121b3a;
  --r-gold:linear-gradient(135deg,#ffd98a,#e6a544 55%,#b8792a);
  --r-sss:#ffd54a; --r-ss:#ff8a6b; --r-s:#f0a04c; --r-a:#b78df0; --r-b:#5aa7e8; --r-c:#cfd6e6; --r-d:#8a93a6;
  --serif:'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',Georgia,'Times New Roman',serif;
  --sans:'Noto Sans SC','Microsoft YaHei','PingFang SC','Segoe UI',system-ui,sans-serif;
  --mono:'Cascadia Mono','Consolas','Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);
  background:radial-gradient(1200px 800px at 70% -10%,#16234a 0%,var(--bg0) 55%),var(--bg0);
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
}
/* 背景网格（服务器质感） */
#bg-grid{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(84,210,192,0.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(84,210,192,0.05) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(900px 700px at 60% 20%,#000 30%,transparent 100%);
}
#app{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:18px 16px 60px}

/* ===== HUD ===== */
#hud{
  display:none;flex-wrap:wrap;align-items:center;gap:8px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 14px;
  margin-bottom:14px;
  backdrop-filter:blur(6px);
  position:sticky;top:10px;z-index:20;
  box-shadow:0 8px 30px rgba(0,0,0,0.35);
}
#hud.on{display:flex}
.hud-block{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink-dim);line-height:1.25}
.hud-block b{font-family:var(--mono);font-size:15px;color:var(--ink);font-weight:600}
.hud-block .hp-bar{width:90px;height:6px;background:#1c2546;border-radius:4px;overflow:hidden;margin-top:2px}
.hud-block .hp-fill{height:100%;background:linear-gradient(90deg,#e6a544,#ffd98a);border-radius:4px;transition:width .4s}
.hud-block .hp-fill.low{background:linear-gradient(90deg,#d5564a,#ff8a7a)}
.hud-right{margin-left:auto;display:flex;gap:14px;align-items:center}
.chip{
  font-family:var(--mono);font-size:13px;padding:4px 10px;border-radius:999px;
  border:1px solid var(--line-strong);background:rgba(84,210,192,0.08);color:var(--cyan);
}
.chip.gold{border-color:rgba(230,165,68,.5);background:rgba(230,165,68,.08);color:var(--gold)}
.chip.red{border-color:rgba(213,86,74,.5);background:rgba(213,86,74,.08);color:#ff8a7a}

/* ===== 视图 ===== */
.view{display:none;animation:fadein .5s ease}
.view.active{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes ghostpulse{0%,100%{opacity:.35;text-shadow:0 0 6px rgba(84,210,192,.5)}50%{opacity:.75;text-shadow:0 0 16px rgba(84,210,192,.9)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes glowpulse{0%,100%{box-shadow:0 0 10px rgba(230,165,68,.25)}50%{box-shadow:0 0 26px rgba(230,165,68,.55)}}

/* 标题页 */
#title-view{text-align:center;padding-top:8vh}
.title-mark{font-size:12px;letter-spacing:.6em;color:var(--cyan);margin-bottom:22px;text-transform:uppercase}
h1.title-name{
  font-family:var(--serif);font-size:56px;font-weight:900;line-height:1.1;
  background:linear-gradient(160deg,#ffe9bd,#e6a544 45%,#9a5f1e);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 18px rgba(230,165,68,.35));
  margin-bottom:6px;
}
.title-sub{font-family:var(--serif);font-size:17px;color:var(--ink-dim);letter-spacing:.35em;margin-bottom:30px}
.title-dice{font-size:40px;margin:8px 0 26px;animation:floaty 3s ease-in-out infinite;color:var(--gold)}
.title-desc{max-width:520px;margin:0 auto 34px;color:var(--ink-dim);line-height:1.9;font-size:14px}
.btn{
  display:inline-block;cursor:pointer;user-select:none;
  border:1px solid var(--line-strong);background:rgba(30,42,84,.5);
  color:var(--ink);padding:12px 26px;border-radius:10px;font-size:15px;
  transition:all .18s;font-family:var(--sans);
}
.btn:hover{background:rgba(60,80,140,.6);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{
  background:var(--r-gold);color:#1a1206;font-weight:700;border:none;
  box-shadow:0 6px 20px rgba(230,165,68,.3);
}
.btn-primary:hover{filter:brightness(1.06);box-shadow:0 8px 26px rgba(230,165,68,.45)}
.btn-ghost{background:transparent;border-color:var(--line)}
.btn-small{padding:8px 16px;font-size:13px}
.btn[disabled]{opacity:.4;pointer-events:none}

/* 叙事面板 */
.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:22px 24px;backdrop-filter:blur(6px);
  box-shadow:0 14px 40px rgba(0,0,0,.35);
}
.scene-chap{
  font-size:12px;letter-spacing:.3em;color:var(--cyan);margin-bottom:12px;
  text-transform:uppercase;display:flex;align-items:center;gap:10px;
}
.scene-chap::after{content:"";flex:1;height:1px;background:var(--line)}
.scene-title{
  font-family:var(--serif);font-size:23px;font-weight:800;color:#f4ecdb;
  margin-bottom:4px;line-height:1.4;
}
.scene-tagline{font-size:12px;color:var(--ink-faint);margin-bottom:14px}
.story{
  font-family:var(--serif);font-size:16px;line-height:2;color:#d7dfef;
  white-space:pre-wrap;
}
.story .echo{
  color:var(--cyan);opacity:.8;
  animation:ghostpulse 4s ease-in-out infinite;
}
.story .hl{color:var(--gold);font-weight:700}
.story .hlr{color:#ff8a7a;font-weight:700}
.story .hlc{color:var(--cyan);font-weight:600}

/* 安科骰子旁白 */
.dice-log{
  margin:14px 0;padding:12px 16px;border-left:3px solid var(--cyan-dim);
  background:rgba(84,210,192,.06);border-radius:0 8px 8px 0;
  font-family:var(--mono);font-size:13px;color:#a7e8df;line-height:1.9;
  white-space:pre-wrap;display:none;
}
.dice-log.show{display:block;animation:fadein .35s}
.dice-log .crit{color:#ffd98a}
.dice-log .fumb{color:#ff8a7a}
.dice-log .ok{color:#7fe0d0}

/* 选项 */
.choices{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.choice{
  cursor:pointer;user-select:none;text-align:left;
  background:rgba(24,36,72,.55);border:1px solid var(--line);border-radius:10px;
  padding:13px 16px;color:var(--ink);font-size:15px;line-height:1.6;
  transition:all .16s;font-family:var(--sans);
}
.choice:hover{border-color:var(--gold);background:rgba(60,46,20,.35);transform:translateX(3px)}
.choice .c-tag{font-size:11px;color:var(--gold);letter-spacing:.12em;margin-right:6px}
.choice .c-desc{font-size:12.5px;color:var(--ink-dim);margin-top:2px}
.choice.hidden-mystery{
  border-style:dashed;border-color:rgba(230,165,68,.6);color:#ffe3ad;
  background:rgba(60,46,20,.22);
}

/* 天赋卡 */
.talent-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:18px}
.tcard{
  cursor:pointer;user-select:none;position:relative;
  border:1px solid var(--line);border-radius:12px;padding:16px 16px 14px;
  background:var(--panel-solid);transition:all .18s;overflow:hidden;
}
.tcard:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,.4)}
.tcard.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 12px 34px rgba(230,165,68,.25);transform:translateY(-4px)}
.tcard .t-grade{font-family:var(--mono);font-size:12px;letter-spacing:.18em;margin-bottom:6px}
.tcard .t-name{font-family:var(--serif);font-size:18px;font-weight:800;margin-bottom:6px}
.tcard .t-type{font-size:11px;color:var(--ink-dim);margin-bottom:8px;letter-spacing:.1em}
.tcard .t-desc{font-size:12.5px;color:var(--ink-dim);line-height:1.7}
.tcard .t-flavor{font-family:var(--serif);font-size:12px;color:var(--ink-faint);font-style:italic;margin-top:8px;line-height:1.6}
.grade-D{color:var(--r-d)}.grade-C{color:var(--r-c)}.grade-B{color:var(--r-b)}
.grade-A{color:var(--r-a)}.grade-S{color:var(--r-s)}.grade-SS{color:var(--r-ss)}.grade-SSS{color:var(--r-sss)}
.tcard .t-glow{position:absolute;top:-40%;right:-30%;width:130px;height:130px;border-radius:50%;opacity:.12;pointer-events:none;filter:blur(10px)}

/* 属性面板 */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat-cell{
  border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:rgba(16,24,52,.5);
  font-size:12.5px;color:var(--ink-dim);
}
.stat-cell b{display:block;font-family:var(--mono);font-size:17px;color:var(--ink);margin-top:2px}

/* 战斗 */
.combat-enemy{
  border:1px solid var(--line-strong);border-radius:12px;padding:14px 16px;margin:14px 0;
  background:linear-gradient(135deg,rgba(60,24,40,.5),rgba(24,18,46,.6));
}
.combat-enemy .e-name{font-family:var(--serif);font-size:20px;font-weight:800;color:#ffc9b8}
.combat-enemy .e-desc{font-size:13px;color:var(--ink-dim);line-height:1.7;margin-top:4px}
.combat-enemy .e-bar{width:100%;height:8px;background:#2a1030;border-radius:5px;overflow:hidden;margin-top:10px}
.combat-enemy .e-fill{height:100%;background:linear-gradient(90deg,#d5564a,#ff8a7a);transition:width .4s}
.combat-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:14px}
.cact{
  cursor:pointer;user-select:none;text-align:center;
  border:1px solid var(--line);border-radius:10px;padding:12px 8px;
  background:rgba(24,36,72,.5);color:var(--ink);font-size:14px;transition:all .15s;
}
.cact:hover{border-color:var(--gold);transform:translateY(-2px)}
.cact .ca-sub{display:block;font-size:11px;color:var(--ink-dim);margin-top:3px}
.battle-log{
  margin-top:14px;padding:12px 14px;background:rgba(0,0,0,.25);border-radius:8px;
  font-size:13.5px;line-height:1.9;color:#c8d2e8;min-height:60px;max-height:180px;overflow-y:auto;
}
.battle-log .pl{color:#a7e8df}
.battle-log .en{color:#ffb3a0}
.battle-log .crit{color:#ffd98a}
.battle-log .fumb{color:#ff8a7a}

/* 搜打撤行动 */
.op-steps{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.op-step{
  flex:1;min-width:96px;text-align:center;font-size:13px;padding:8px 6px;border-radius:9px;
  border:1px solid var(--line);color:var(--ink-dim);background:rgba(16,24,52,.5);
}
.op-step.on{
  border-color:var(--gold);color:var(--gold);background:rgba(60,46,20,.3);
  box-shadow:0 0 14px rgba(230,165,68,.25);font-weight:700;
}
.op-step.done{border-color:var(--cyan);color:var(--cyan)}
.op-log{
  margin-top:12px;padding:12px 16px;border-left:3px solid var(--cyan-dim);
  background:rgba(84,210,192,.06);border-radius:0 8px 8px 0;
  font-family:var(--serif);font-size:14px;color:#d7dfef;line-height:2;white-space:pre-wrap;
}
.op-result{border:1px solid var(--line-strong);border-radius:12px;padding:16px;margin-top:14px}
.op-result.good{border-color:rgba(230,165,68,.5);background:rgba(60,46,20,.15)}
.op-result.bad{border-color:rgba(213,86,74,.5);background:rgba(60,24,24,.15)}

/* 结局 */
.ending-banner{text-align:center;padding:34px 10px 10px}
.ending-title{font-family:var(--serif);font-size:40px;font-weight:900;line-height:1.3;animation:glowpulse 3s ease-in-out infinite}
.ending-title.good{background:linear-gradient(150deg,#ffe9bd,#e6a544);-webkit-background-clip:text;background-clip:text;color:transparent}
.ending-title.bad{background:linear-gradient(150deg,#ffb3a0,#d5564a);-webkit-background-clip:text;background-clip:text;color:transparent}
.ending-title.secret{background:linear-gradient(150deg,#a7e8df,#54d2c0);-webkit-background-clip:text;background-clip:text;color:transparent}
.ending-sub{color:var(--ink-dim);letter-spacing:.3em;font-size:12px;margin-top:8px}
.ending-text{font-family:var(--serif);font-size:16px;line-height:2.1;color:#d7dfef;white-space:pre-wrap;margin-top:20px}
.stats-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:22px 0}
.stat-card{border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;background:rgba(16,24,52,.5)}
.stat-card .k{font-size:11px;color:var(--ink-dim)}
.stat-card .v{font-family:var(--mono);font-size:20px;color:var(--gold);margin-top:4px}

/* 滚动日志/菜单 */
.help-box{font-size:13.5px;color:var(--ink-dim);line-height:1.9}
.help-box b{color:var(--cyan)}
.kbd{font-family:var(--mono);border:1px solid var(--line-strong);border-radius:5px;padding:1px 6px;font-size:12px;color:var(--gold)}
.notice{color:var(--gold);font-size:13px;margin-top:12px}

@media (max-width:600px){
  h1.title-name{font-size:40px}
  .panel{padding:16px}
  .story{font-size:15px}
  .stat-grid{grid-template-columns:repeat(3,1fr)}
  #hud{font-size:11px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="bg-grid"></div>
<div id="app">
  <header id="hud">
    <div class="hud-block"><span>生命</span><b id="hud-hp">--</b><div class="hp-bar"><div class="hp-fill" id="hud-hpbar"></div></div></div>
    <div class="hud-block"><span>轮回</span><b id="hud-run">1</b></div>
    <div class="hud-block"><span>章节</span><b id="hud-chap">--</b></div>
    <div class="hud-right">
      <span class="chip" id="hud-fate" title="命运点：可重掷骰子">◆ 0</span>
      <span class="chip gold" id="hud-echo" title="回响碎片：轮回间保留的永久货币">◈ 0</span>
      <span class="chip" id="hud-gold" title="金币">◎ 0</span>
    </div>
  </header>
  <main id="view">
    <div class="view" id="view-title"></div>
    <div class="view" id="view-talent"></div>
    <div class="view" id="view-scene"></div>
    <div class="view" id="view-combat"></div>
    <div class="view" id="view-operation"></div>
    <div class="view" id="view-death"></div>
    <div class="view" id="view-ending"></div>
  </main>
</div>
<script>
"use strict";


/* ============================================================
   回响之城 · 轮回骰局 —— 数据层
   ============================================================ */

/* ---------- 品级 ---------- */
const GRADE = {
  D:{name:'劣品',color:'#8a93a6'},
  C:{name:'凡品',color:'#cfd6e6'},
  B:{name:'良品',color:'#5aa7e8'},
  A:{name:'精品',color:'#b78df0'},
  S:{name:'绝品',color:'#f0a04c'},
  SS:{name:'史诗',color:'#ff8a6b'},
  SSS:{name:'神话',color:'#ffd54a'}
};
const GRADE_WEIGHT = [['SSS',1],['SS',2],['S',4],['A',7],['B',10],['C',8],['D',5]];

/* ---------- 天赋库（网游文金手指 × 肉鸽构筑） ---------- */
const TALENTS = [
  {id:'mem',grade:'C',type:'记忆型',name:'过目不忘',
   desc:'你的记忆如同一座永不落灰的档案馆。探索与抉择时，额外揭示 1 条隐藏情报。',
   flavor:'“这扇门，我上一次轮回也见过。”',
   mod:{reveal:1}},
  {id:'wit',grade:'B',type:'悟性型',name:'天生悟性',
   desc:'万法皆可学，万事皆可悟。所有战斗判定 +10，战斗技能等级视为 +1。',
   flavor:'别人苦修十年，你只看了三眼。',
   mod:{combat:10}},
  {id:'body',grade:'A',type:'体质型',name:'纯阳之体',
   desc:'阳气冲霄，百邪不侵。每场战斗结束后恢复 8 点生命；深渊系判定 +15。',
   flavor:'那些阴魂不散的东西，最怕你这样的人。',
   mod:{heal:8,abyss:15}},
  {id:'dragon',grade:'S',type:'血脉型',name:'龙裔血脉',
   desc:'沉睡在灵魂深处的龙血开始沸腾。力量 +5，生命上限 +20，可随轮回次数进化。',
   flavor:'血脉觉醒之日，万物俯首。',
   mod:{str:5,maxhp:20}},
  {id:'panel',grade:'B',type:'系统型',name:'任务面板',
   desc:'一个只有你能看见的面板。每次轮回额外触发 1 个支线任务，支线奖励翻倍。',
   flavor:'【叮—— 支线任务已刷新。】',
   mod:{quest:1}},
  {id:'eye',grade:'A',type:'信息型',name:'数据之眼',
   desc:'你可以看见世界的底层代码。战斗中显示敌人弱点（伤害 +6），所有判定 +10。',
   flavor:'在你眼中，万物都是参数。',
   mod:{check:10,weak:6}},
  {id:'feast',grade:'SS',type:'斩杀型',name:'致命盛宴',
   desc:'对生命低于 30% 的目标直接斩杀——无视一切防御与闪避。',
   flavor:'盛宴开始，无人离席。',
   mod:{execute:.30}},
  {id:'blink',grade:'S',type:'刺杀型',name:'十步一杀',
   desc:'战斗首回合必定先手；暴击率 +30%，暴击伤害 +50%。',
   flavor:'十步之内，人尽敌国。',
   mod:{first:1,crit:.30,critdmg:1.5}},
  {id:'fate',grade:'SSS',type:'欧皇型',name:'天命之子',
   desc:'命运站在你这一边。大成功区间由 1-5 扩为 1-10；大失败时自动重掷一次。',
   flavor:'当你的骰子落下的那一刻，神就已经输了。',
   mod:{crit1:10,reluck:1}},
  {id:'bag',grade:'D',type:'道具型',name:'百宝袋',
   desc:'不知从何而来的次元口袋。开局额外获得 2 件随机道具。',
   flavor:'你永远不知道袋子里还有什么。',
   mod:{items:2}},
  {id:'echo_mem',grade:'SS',type:'重生型',name:'前尘回响',
   desc:'你是少数记得上一次轮回的人。开局预知 1 个关键事件走向，判定 +15。',
   flavor:'这一次，我不会再犯同样的错了。',
   mod:{check:15,foresight:1}},
  {id:'grandpa',grade:'S',type:'寄宿型',name:'老爷爷寄宿',
   desc:'你的灵魂深处寄宿着一位神秘老者的残识。每场战斗可抵挡一次致命伤害。',
   flavor:'“小子，把这条命，交给老夫。”',
   mod:{guard:1}},
  {id:'growth',grade:'A',type:'成长型',name:'无限成长',
   desc:'你的成长没有上限。每场战斗胜利后，随机属性 +1（可突破常规上限）。',
   flavor:'他今天不是昨天的他，明天也不是今天的他。',

N({id:'c2_faction_black',chap:'第二章 · 中枢塔',title:'黑塔帮',tagline:'阵营 · 黑塔帮',
text:'“哟，新面孔。”地库阴影里，一个叼着数据烟的男人懒洋洋地开口，“黑塔帮收人，不问来历，只问胆子。敢碰禁区数据吗？”\n\n他扔给你一袋金币和一枚【黑塔帮纹章】：“拿好。我们只认利益——但你若能搞到回响之核的底层数据，价钱好商量。”\n\n【获得：黑塔帮纹章 · 金币+20】\n\n他压低声音补充了一句：“干完这一票，我带你去看真正的‘后门’——不是我说的那个‘后门’。”\n\n“顺便——守望者那群疯子，正在满城追杀‘乱码’。你最好小心点。”',
choices:[

]});
N({id:'c2_faction_none',chap:'第二章 · 中枢塔',title:'独行者',tagline:'阵营 · 中立',
text:'你没有加入任何一方。\n\n“聪明。”角落里传来一个苍老的声音——灰袍商人居然也在塔里，“中立者最自由，也最危险。两边都当你是变数，随时可能动手。”\n\n他抛给你一件东西：“【回响水晶】的姊妹篇——【真相透镜】。拿着，第三章会用得上。”\n\n【获得：真相透镜】\n\n他笑了笑：“独行的人，往往看得最清楚。祝你好运，变数先生。”',
choices:[

N({id:'c2_ops_offer',chap:'第二章 · 中枢塔',title:'黑塔帮的委托',tagline:'支线 · 搜打撤行动',
text:'你在地库入口被一个叼着数据烟的接头人叫住：\n\n“喂，新面孔。有个活儿，干不干？”\n\n他压低声音：“旧仓库那边，有批异常数据‘长了脚’，占了一整层。我们人手不够——你去，把目标清掉，再把能带的数据带回来。”\n\n“规矩就三个字：{hl}搜、打、撤{/hl}。搜到了再打，打完了就撤，别贪。干成，金币管够。”\n\n（搜打撤行动：搜索定位 → 打击目标 → 安全撤离，一步出错都可能吃大亏）',

N({id:'c2_file',chap:'第二章 · 中枢塔',title:'第七号档案室',tagline:'探索 · 关键情报',
text:'你用【旧城钥匙】打开了第七号档案室的门。\n\n尘封的房间中央，一台老式终端机亮着幽蓝的光。屏幕上，一份被标记为“已删除”的日志正在自动恢复。\n\n你凑近一看，瞳孔骤缩——\n\n日志标题：《回响之城 · 首席测试员档案》\n\n姓名栏赫然写着：\n\n{echo}【你的名字】{/echo}',
choices:[
  {text:'读取完整日志',tag:'情报',desc:'智力判定 · 解码被删内容',kind:'check',stat:'int',dc:58,
   succ:'c2_log_read',fail:'c2_log_partial',
   succText:'（1d100+智力 判定成功）你完整恢复了日志：\n\n“……首席测试员在服务器事故中被卷入。为保护其意识不被数据洪流吞噬，系统启动‘轮回异常’——让城市每周期重置，为其争取时间。”\n\n“但轮回正在失控。城市产生了自我意识。它开始……拒绝放人离开。”\n\n【关键真相已解锁：truth_known】'},
  {text:'先检查房间其他角落',tag:'搜索',desc:'感知判定 · 或许还有别的',kind:'check',stat:'per',dc:52,

]});
N({id:'c2_log_read',chap:'第二章 · 中枢塔',title:'真相',tagline:'情报 · 真相已解锁',
text:'你合上日志，指尖微微发颤。\n\n原来，这座城不是监狱——\n\n是系统为你搭的“生命维持舱”。\n\n但如今，舱体已经变异成一座会吃人的迷宫。而你，正在它的腹地。\n\n你抬头，看见终端机屏幕最后闪烁出一行字：\n\n“检测到：旧日居民+真相持有者。建议：寻找系统维护员‘老猫’。”\n\n你记住了这个名字。',
choices:[
  {text:'前往塔顶',tag:'前进',kind:'next',goto:'c2_top'}
]});

N({id:'c2_top',chap:'第二章 · 中枢塔',title:'塔顶 · 抉择',tagline:'第二章 关键抉择',
text:'塔顶，风很大。\n\n你面前是最后的抉择：左边，一台亮着柔和绿灯的【逃生终端】——只要按下，就能强制退出游戏，回到现实。\n\n右边，一个被数据锁链绑在柱子上的男人，正艰难地抬头看你。他戴着一副缺了一条腿的眼镜：\n\n“……你是……测试员？”他的声音嘶哑，“我是‘老猫’，系统维护员。快……先解开我！我能帮你关闭轮回异常！”\n\n他的眼神，急切而真诚。',
choices:[
  {text:'先救老猫',tag:'营救',desc:'智力判定 · 解开数据锁链',kind:'check',stat:'int',dc:52,
   succ:'c2_save_gm',fail:'c2_save_gm_force',
   succText:'（1d100+智力 判定成功）你迅速破解了锁链协议。老猫获得自由，喘着粗气：“谢……谢你。”\n\n他掏出一把造型奇特的钥匙：“这是【GM权限钥匙】——能直接夺取这座城的控制权。听着，如果你不想被困死在这里，就留着它。”\n\n【获得：GM权限钥匙】\n\n他指向逃生终端：“那边是后门。但你真要走的话——先想清楚，你要不要带这座城一起走。”'},
  {text:'先触碰逃生终端',tag:'逃生',desc:'自由近在咫尺……',kind:'effect',apply:(s)=>{s.flag.touched_terminal=true;},goto:'c2_terminal_first'},
  {text:'拒绝所有选项，静观其变',tag:'独断',desc:'这里一定有诈',kind:'check',stat:'per',dc:55,
   succ:'c2_watch',fail:'c2_save_gm_force',
   succText:'（1d100+感知 判定成功）你后退一步，冷静观察。\n\n然后你看见——那台“逃生终端”的绿灯，实际上是一个伪装成出口的【数据诱捕器】。而老猫的锁链，其实只锁了三道，另外两道，是他自己扣上的。\n\n“被你看穿了。”老猫苦笑，解开剩下的锁链，“抱歉，我在测试你会不会第一个冲向出口——如果是，你就是帮这座城市‘清理障碍’的内鬼。”\n\n他递给你【GM权限钥匙】：“现在，我信你。拿去。”\n\n【获得：GM权限钥匙】'}
]});
N({id:'c2_save_gm',chap:'第二章 · 中枢塔',title:'老猫',tagline:'NPC · 老猫（GM）',
text:'老猫揉了揉手腕，神色复杂地看向你：\n\n“轮回异常……其实是我设计的。”\n\n你瞳孔一缩。\n\n“别急着动手。”他抬手，“当时服务器事故，你的意识差点被数据洪流搅碎。我用最后的权限开了‘轮回保护’，让城市反复重置，给你争取清醒的时间。”\n\n“这段保护代码，我当年只写了三行注释：别改。别动。改了别找我。”他自嘲地笑了笑，“结果它自己进化成了这样。”\n\n“但我没想到——城市自己进化出了意识。它现在……不想让你走了。”\n\n他看向远处那道数据光柱：“回响之核，就是城市的‘心脏’。想结束这一切，要么关闭它，要么……取代它。”\n\n【NPC：老猫已结缘 · 持有GM权限钥匙】',
choices:[
  {text:'“告诉我，该怎么选择。”',tag:'对话',kind:'next',goto:'c2_final_hint'}
]});
N({id:'c2_save_gm_force',chap:'第二章 · 中枢塔',title:'强行破锁',tagline:'NPC · 老猫（GM）',
text:'锁链对你来说很难缠，但硬碰硬也并非不行。你以蛮力/手段强行解开了束缚。\n\n老猫揉了揉手腕，神情复杂：“你这人……挺能折腾的。也罢，命该如此。”\n\n他递给你一把钥匙：“【GM权限钥匙】。拿着，算我欠你的。”\n\n【获得：GM权限钥匙】\n\n“去回响深渊吧。”他指向深不见底的地底，“这座城的真相，和它的心脏，都在那里。”',
choices:[
  {text:'前往回响深渊',tag:'前进',kind:'next',goto:'c3_intro'}
]});
N({id:'c2_terminal_first',chap:'第二章 · 中枢塔',title:'逃生终端',tagline:'抉择 · 逃生',
text:'你的手按上逃生终端。\n\n绿灯亮起，屏幕上弹出选项：\n\n“确认退出游戏？\n警告：退出后，此周目进度将清零，且轮回保护将失效。”\n\n你的手指悬在“确认”上方。\n\n身后，老猫的声音急切响起：“等等！你现在出去——你的意识还不稳定，可能会被撕碎！”\n\n你犹豫了。',
choices:[
  {text:'选择“确认”',tag:'逃生',desc:'（赌上一切）',kind:'effect',apply:(s)=>{s.flag.tried_exit=true;},goto:'c2_terminal_confirm'},
  {text:'松开手',tag:'回头',desc:'他说得对，现在还不是时候',kind:'next',goto:'c2_save_gm'},
  {text:'关闭终端，砸掉它',tag:'决绝',desc:'不留退路，才能走到底',kind:'effect',apply:(s)=>{s.flag.terminal_destroyed=true;},goto:'c2_save_gm'}
]});
N({id:'c2_terminal_confirm',chap:'第二章 · 中枢塔',title:'退出失败',tagline:'抉择 · 逃生',
text:'你按下了“确认”。\n\n终端机剧烈震动——\n\n然后，屏幕上跳出一行猩红大字：\n\n“错误：出口已被锁定。”\n\n“本服务器管理员【回响之核】已开启‘禁止离开’权限。”\n\n“你无法通过正常途径离开这座城市。”\n\n终端机屏幕暗下去，彻底失去响应。\n\n（屏幕熄灭前弹出一个小气泡：“温馨提示：想离开请找人工客服。人工客服在线时间：本城没有。”）\n\n老猫叹了口气：“果然……它已经锁死了所有出口。现在，你只能往下走了。”\n\n【真相：出口已被回响之核封锁】',
choices:[
  {text:'前往回响深渊',tag:'前进',kind:'next',goto:'c3_intro'}
]});
N({id:'c2_watch',chap:'第二章 · 中枢塔',title:'识破',tagline:'抉择 · 洞察',
text:'你的冷静为你赢得了老猫的信任。\n\n他揉了揉手腕：“轮回异常是我设计的保护程序，但城市进化出了自我意识——它现在不想让你走了。”\n\n他看向那道数据光柱：“回响之核，是城市的‘心脏’。想结束这一切，要么关闭它，要么取代它。”\n\n【NPC：老猫已结缘 · 持有GM权限钥匙】\n\n“去回响深渊吧。”他说，“答案在那里。”',
choices:[
  {text:'前往回响深渊',tag:'前进',kind:'next',goto:'c3_intro'}
]});
N({id:'c2_final_hint',chap:'第二章 · 中枢塔',title:'老猫的忠告',tagline:'NPC · 老猫（GM）',
text:'老猫想了想，认真地看着你：\n\n“回响之核，本质是一个被无数轮回记忆污染的核心程序。它已经分不清‘保护你’和‘囚禁你’的区别。”\n\n“到了最深处，它会问你一个问题。你回答的方式，决定了这座城的结局。”\n\n他顿了顿：“记住——它怕的，是‘真相’。是有人告诉它：你不需要再保护我了，我很好，放我走。”\n\n你默默记下。\n\n【关键情报：回响之核的弱点已获知】',
choices:[
  {text:'前往回响深渊',tag:'前进',kind:'next',goto:'c3_intro'}
]});

/* ===== 第三章 · 回响深渊 ===== */
N({id:'c3_intro',chap:'第三章 · 回响深渊',title:'向下',tagline:'轮回历第 {run} 周目 · 终章',
text:'你乘坐老旧的货运电梯，一路向下。\n\n随着深度的增加，周围的光线越来越暗，温度越来越低。空气中开始弥漫一种……很熟悉的味道。\n\n那是什么味道？\n\n你想了很久，才想起来——那是测试舱里，消毒水混着电路烧焦的味道。\n\n电梯停住。门缓缓打开。\n\n{echo}欢迎回家。{/echo}',
choices:[
  {text:'踏入深渊',tag:'前进',kind:'next',goto:'c3_eye'}
]});

N({id:'c3_eye',chap:'第三章 · 回响深渊',title:'深渊之眼',tagline:'探索 · 意志考验',
text:'深渊的中央，悬浮着一颗巨大的、由无数数据流缠绕而成的核心——\n\n【回响之核】。\n\n它像一颗巨大的心脏，每一次搏动，整个深渊的光就明灭一次。\n\n而此刻，它“看”向了你。\n\n一股无形的压力骤然压下——无数只眼睛在虚空中睁开，直直盯着你。你感到灵魂深处有什么东西在摇晃、在共鸣、在试图把你“拉进去”。\n\n（意志判定：如果失败，你会被深渊短暂蛊惑）',
choices:[
  {text:'稳住心神',tag:'意志',desc:'智力+体质判定 · 抵抗蛊惑',kind:'check',stat:'will',dc:58,
   succ:'c3_eye_ok',fail:'c3_eye_fail',
   succText:'（1d100+意志 判定成功）你咬破舌尖，疼痛让意识瞬间清醒。那些眼睛眨了眨，缓缓合上。\n\n回响之核的搏动，似乎平稳了一些。\n\n你通过了它的第一次“考验”。'},
  {text:'主动迎上它的注视',tag:'直视',desc:'你想看它想干什么',kind:'check',stat:'will',dc:66,
   succ:'c3_eye_deep',fail:'c3_eye_fail',
   succText:'（1d100+意志 判定成功）你直面那无数只眼睛。在注视中，你看到了一瞬的画面——\n\n一座明亮的测试舱，一个戴眼镜的年轻人对你竖起大拇指，口型是：“加油，测试员。”\n\n然后画面碎裂。你感到自己更接近真相了。\n\n【情报：回响之核的‘保护欲’来源已被你看见】'}
]});
N({id:'c3_eye_ok',chap:'第三章 · 回响深渊',title:'稳住',tagline:'事件后续',
text:'你从深渊的低语中挣脱出来，心脏仍在狂跳。\n\n回响之核的搏动声在耳边回荡，像一声叹息。\n\n你离它的核心，又近了一步。',
choices:[
  {text:'深入核心',tag:'前进',kind:'next',goto:'c3_memory'}

N({id:'c3_eye_fail',chap:'第三章 · 回响深渊',title:'被蛊惑',tagline:'事件后续',
text:'你没能完全抵挡住深渊的低语。\n\n一瞬间，你的意识仿佛坠入冰冷的海底——无数记忆碎片涌来：测试舱、白大褂、系统报错、一双鼓励的眼睛……\n\n你猛地惊醒，发现自己跪倒在地，浑身冷汗，生命值被抽走了一截。\n\n（你损失了 10 点生命）\n\n回响之核依然静静悬浮，像什么都没发生过。',

N({id:'c3_eye_deep',chap:'第三章 · 回响深渊',title:'那一眼',tagline:'事件后续',

choices:[

/* ============================================================
   回响之城 · 轮回骰局 —— 引擎层
   ============================================================ */

/* ---------- 工具 ---------- */
const $ = id => document.getElementById(id);
function rand(n){ return Math.floor(Math.random()*n); }
function rint(a,b){ return a + rand(b-a+1); }
function weightedPick(weightArr){
  const total = weightArr.reduce((s,[v,w])=>s+w,0);
  let r = Math.random()*total;
  for(const [v,w] of weightArr){ if((r-=w)<0) return v; }
  return weightArr[weightArr.length-1][0];
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---------- 全局状态 ---------- */
const STORE_KEY = 'echo-city-save-v1';
const S = {
  run:1, echoes:0, totalRuns:0, bestProgress:0, finishedEndings:[],
  hp:0, maxHp:0, gold:0, fate:0, items:[], talents:[],
  stats:{str:0,agi:0,int:0,cha:0,con:0,per:0},
  flag:{}, nodeId:null
};
function loadSave(){
  try{ const d = JSON.parse(localStorage.getItem(STORE_KEY)); if(d){ S.run=d.run||1; S.echoes=d.echoes||0; S.totalRuns=d.totalRuns||0; S.bestProgress=d.bestProgress||0; S.finishedEndings=d.finishedEndings||[]; } }catch(e){}
}
function saveSave(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify({run:S.run,echoes:S.echoes,totalRuns:S.totalRuns,bestProgress:S.bestProgress,finishedEndings:S.finishedEndings})); }catch(e){}
}

/* ---------- 属性 ---------- */
function newStats(){
  const s={};
  s.str=rint(8,12); s.agi=rint(8,12); s.int=rint(8,12);
  s.cha=rint(8,12); s.con=rint(8,12); s.per=rint(8,12);
  return s;
}
function statValue(name){
  if(name==='will') return S.stats.int + Math.floor(S.stats.con/2);
  if(name==='luck') return 0;
  return S.stats[name]||0;
}
/* 天赋判定加成 */
function checkBonus(name){
  let b=0;
  for(const t of S.talents){
    if(t==='eye') b+=10;
    if(t==='echo_mem') b+=15;
    if(name==='cha' && t==='charm') b+=30;
    if(name==='will' && t==='body') b+=15;
  }
  return b;
}
function combatBonus(){
  let b=0;
  if(S.talents.includes('wit')) b+=10;
  if(S.talents.includes('eye')) b+=10;
  if(S.items.includes('dagger')) b+=8;
  return b;
}

/* ---------- 天赋抽取 ---------- */
function pickTalents(){
  const pool = TALENTS.slice();
  const picks=[];
  while(picks.length<3 && pool.length){
    const gi = rand(pool.length);
    picks.push(pool.splice(gi,1)[0]);
  }
  return picks;
}
function applyTalent(t){
  S.talents.push(t.id);
  const m=t.mod;
  if(m.str) S.stats.str+=m.str;
  if(m.maxhp){ S.maxHp+=m.maxhp; S.hp+=m.maxhp; }
  if(m.items){ for(let i=0;i<m.items;i++){ const it=ITEMS[rand(ITEMS.length)]; S.items.push(it.id); } }
}
function talentByGrade(g){
  const pool = TALENTS.filter(t=>t.grade===g);
  return pool.length? pool[rand(pool.length)] : TALENTS[rand(TALENTS.length)];
}

/* ---------- 每局初始化 ---------- */
function newRun(){
  S.stats = newStats();
  S.gold = 12;
  S.fate = 2 + Math.floor(S.echoes/3);
  S.items = [];
  S.talents = [];
  S.flag = {};
  S.maxHp = 20 + S.stats.con*2;
  S.hp = S.maxHp;
  S.nodeId = null;
  S.revealedSelf=false;
}
function resetRun(){ newRun(); S.run++; }

/* ---------- 文本填充 ---------- */
function fillText(t){
  let h = esc(t);
  h = h.split('{run}').join(S.run);
  h = h.split('{talents}').join(S.talents.map(id=>{
    const t=TALENTS.find(x=>x.id===id); return `「${t.name}」`; }).join('　'));
  h = h.replace(/\{echo\}([\s\S]*?)\{\/echo\}/g,'<span class="echo">$1</span>');
  h = h.replace(/\{hl\}([\s\S]*?)\{\/hl\}/g,'<span class="hl">$1</span>');
  h = h.replace(/\{hlr\}([\s\S]*?)\{\/hlr\}/g,'<span class="hlr">$1</span>');
  h = h.replace(/\{hlc\}([\s\S]*?)\{\/hlc\}/g,'<span class="hlc">$1</span>');
  h = h.replace(/\{echo\}/g,'<span class="echo">').replace(/\{\/echo\}/g,'</span>');
  return h;
}
function showView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const v = $('view-'+name); if(v) v.classList.add('active');
}
function updateHUD(){
  const hud=$('hud'); hud.classList.add('on');
  $('hud-hp').textContent = Math.max(0,S.hp)+'/'+S.maxHp;
  const f=$('hud-hpbar'); f.style.width = Math.max(0,S.hp/S.maxHp*100)+'%';
  f.classList.toggle('low', S.hp/S.maxHp<0.3);
  $('hud-run').textContent = S.run;
  const nn = S.nodeId && NODES[S.nodeId];
  $('hud-chap').textContent = nn ? nn.chap : (S.nodeId==='combat'?'战斗':'—');
  $('hud-fate').textContent = '◆ '+S.fate;
  $('hud-echo').textContent = '◈ '+S.echoes;
  $('hud-gold').textContent = '◎ '+S.gold;
}

/* ---------- 骰子系统（安科） ---------- */
function roll100(){ return rand(100)+1; }
function critRange(){ return S.talents.includes('fate')? 10 : 5; }
function runCheck(stat, dc, label){
  let roll = roll100();
  let rerolled=false;
  if(roll>=96 && S.talents.includes('fate')){ rerolled=true; roll=roll100(); }
  const crit = roll<=critRange();
  const fumb = roll>=96;
  const mod = statValue(stat) + checkBonus(stat);
  const total = roll + mod;
  const success = crit ? true : (total>=dc);
  return {stat,dc,label,roll,mod,total,crit,fumb,success,rerolled};
}
function diceLog(res){
  const e=$('dice-log');
  let line = `【骰】${res.label}｜1d100 = ${res.roll}`;
  if(res.mod!==0) line += ` ${res.mod>0?'+':''}${res.mod}`;
  line += ` = ${res.total} ／ 难度 ${res.dc}`;
  let cls='ok';
  if(res.crit){ line += '　大成功！'; cls='crit'; }
  else if(res.fumb){ line += '　大失败！'; cls='fumb'; }
  else if(res.success){ line += '　判定成功'; }
  else { line += '　判定失败'; cls='fumb'; }
  if(res.rerolled) line += '（天命之子·自动重掷）';
  e.innerHTML = `<span class="${cls}">${line}</span>`;
  e.classList.add('show');
}

/* ---------- 节点渲染 ---------- */
function gotoNode(id){
  const n = NODES[id];
  if(!n){ renderTitle(); return; }
  // 节点到达钩子
  if(NODE_ARRIVAL[id]) NODE_ARRIVAL[id]();
  S.nodeId = id;
  updateHUD();
  renderScene(n);
}
const NODE_ARRIVAL = {
  'c1_ghost_peace': ()=>S.flag.old_key=true,
  'c1_ghost_give': ()=>S.flag.old_key=true,
  'c1_merchant_crystal': ()=>{ S.flag.mystery_key=true; },
  'c2_faction_none': ()=>{ S.flag.mystery_key=true; },
  'c2_save_gm': ()=>S.flag.gm=true,
  'c2_save_gm_force': ()=>S.flag.gm=true,
  'c2_watch': ()=>S.flag.gm=true
};

function renderScene(n){
  const v = $('view-scene');
  v.innerHTML = `
    <div class="panel">
      <div class="scene-chap">${esc(n.chap||'')}</div>
      <div class="scene-title">${esc(n.title||'')}</div>
      <div class="scene-tagline">${esc((n.tagline||'').replace('{run}',S.run))}</div>
      <div class="dice-log" id="dice-log"></div>
      <div class="story">${fillText(n.text)}</div>
      <div class="choices" id="scene-choices"></div>
    </div>`;
  const box = $('scene-choices');
  const choices = filterChoices(n.choices);
  choices.forEach((c,idx)=>{
    const b = document.createElement('div');
    b.className='choice'+(c.hidden?' hidden-mystery':'');
    let tag = c.tag? `<span class="c-tag">【${esc(c.tag)}】</span>`:'';
    let desc = c.desc? `<div class="c-desc">${esc(c.desc)}</div>`:'';
    b.innerHTML = `${tag}${esc(c.text)}${desc}`;
    b.onclick = ()=>resolveChoice(c);
    box.appendChild(b);
  });
  showView('scene');
  $('view').scrollTop = 0; window.scrollTo({top:0});
}
function filterChoices(choices){
  return (choices||[]).filter(c=>{
    if(c.need==='old_key' && !S.flag.old_key) return false;
    if(c.need==='gm' && !S.flag.gm) return false;
    if(c.need==='terminal' && !S.flag.touched_terminal) return false;
    if(c.need==='mystery' && !S.flag.mystery_key) return false;
    return true;
  });
}

/* ---------- 选项结算 ---------- */
function resolveChoice(c){
  const dl=$('dice-log');
  if(c.kind==='next'){ gotoNode(c.goto); return; }
  if(c.kind==='effect'){
    try{ if(c.apply) c.apply(S); }catch(e){}
    if(c.addNote){ const n=NODES[S.nodeId]; if(n){ n._note=c.addNote; } }
    gotoNode(c.goto); return;
  }
  if(c.kind==='check'){
    const res = runCheck(c.stat, c.dc, c.tag||'判定');
    diceLog(res);
    const bonusNote = (res.crit&&!c.succText.includes('大成功'))?'':''; void bonusNote;
    // 失败且有命运点 -> 提供重掷；否则直接跳转
    if(!res.success && S.fate>0){
      renderCheckFailWithReroll(res, c);
    } else {
      const target = res.success ? c.succ : c.fail;
      setTimeout(()=>gotoNode(target), 650);
    }
    return;
  }
  if(c.kind==='combat'){ startCombat(c.enemy, c.win, c.lose); return; }
  if(c.kind==='ending'){ goEnding(c.ending); return; }
}
function renderCheckFailWithReroll(res, c){
  const v=$('view-scene');
  const panel = v.querySelector('.panel');
  const bar = document.createElement('div');
  bar.className='choices'; bar.style.marginTop='10px';
  bar.innerHTML = `
    <div class="choice" id="reroll-btn"><span class="c-tag">【命运】</span>消耗 1 点命运点，重掷一次<span class="c-desc">你的命运点：${S.fate}</span></div>
    <div class="choice" id="accept-btn">接受这个结果，继续前行</div>`;
  panel.appendChild(bar);
  $('reroll-btn').onclick=()=>{
    S.fate--; updateHUD();
    const res2 = runCheck(c.stat, c.dc, c.tag||'判定');
    diceLog(res2);
    bar.remove();
    const target = res2.success ? c.succ : c.fail;
    setTimeout(()=>gotoNode(target), 650);
  };
  $('accept-btn').onclick=()=>{
    const target = c.fail;
    setTimeout(()=>gotoNode(target), 250);
  };
}

/* ---------- 战斗 ---------- */
let CB=null;
function startCombat(enemyId, winNode, loseNode, opts){
  const e = ENEMIES[enemyId];
  CB = {id:enemyId, hp:e.hp, max:e.hp, atk:e.atk, dc:e.dc, spd:e.spd,
        winNode, loseNode, turn:0, guard:false, guardUsed:false, fatalGuard:true,
        opMode:!!(opts&&opts.opMode), opBonus:(opts&&opts.opBonus)||0};
  S.nodeId = 'combat';
  updateHUD();
  renderCombat();
}
function renderCombat(){
  const e = ENEMIES[CB.id];
  const v = $('view-combat');
  const logEntries = CB._log||['战斗开始。'];
  v.innerHTML = `
    <div class="panel">
      <div class="scene-chap">战斗 · 第 ${S.run} 周目</div>
      <div class="combat-enemy">
        <div class="e-name">${esc(e.name)}</div>
        <div class="e-desc">${esc(e.desc)}</div>
        <div class="e-bar"><div class="e-fill" style="width:${CB.hp/CB.max*100}%"></div></div>
        <div style="font-family:var(--mono);font-size:12px;color:var(--ink-dim);margin-top:6px">HP ${Math.max(0,CB.hp)} / ${CB.max}</div>
      </div>
      <div class="battle-log" id="battle-log">${logEntries.join('<br>')}</div>
      <div class="combat-actions" id="combat-actions"></div>
    </div>`;
  const act = $('combat-actions');
  const mk = (txt,sub,fn)=>{
    const b=document.createElement('div'); b.className='cact';
    b.innerHTML = `${txt}${sub?`<span class="ca-sub">${sub}</span>`:''}`;
    b.onclick = fn; act.appendChild(b);
  };
  const hasPotion = S.items.includes('potion');
  mk('攻击','力量+敏捷 · 命中'+CB.dc, ()=>combatPlayerAttack(false));
  mk('重击','伤害更高 · 命中-15', ()=>combatPlayerAttack(true));
  mk('防御','本回合减伤50%', ()=>combatGuard());
  if(hasPotion) mk('回响药剂',`剩余${S.items.filter(i=>i==='potion').length}`, ()=>combatPotion());
  if(S.fate>0) mk('命运之力',`消耗1点·下一次攻击必中且暴击 (${S.fate})`, ()=>combatFate());
  if(CB.opMode) mk('撤离','放弃战斗·尝试突围', ()=>opWithdrawFromCombat());
  showView('combat');
}
function combatLog(html, cls){
  if(!CB._log) CB._log=[];
  CB._log.push(`<span class="${cls}">${html}</span>`);
  const el = $('battle-log'); if(el){ el.innerHTML=CB._log.join('<br>'); el.scrollTop=el.scrollHeight; }
}
function combatPlayerAttack(heavy){
  if(!CB) return;
  CB.turn++;
  // 斩杀天赋
  if(S.talents.includes('feast') && CB.hp <= CB.max*0.30){
    combatLog(`「致命盛宴」发动！对低血量目标执行斩杀！`, 'crit');
    CB.hp=0; combatVictory(); return;
  }
  const fateForce = S.flag._fateForce || false;
  let roll = roll100();
  let crit = roll<=critRange();
  if(S.talents.includes('blink') && CB.turn===1){ crit = true; }
  if(fateForce){ crit=true; roll=100; S.flag._fateForce=false; }
  const mod = combatBonus();
  const total = roll + mod;
  const need = CB.dc + (heavy?15:0) - (CB.opBonus||0);
  const hit = crit || total>=need;
  combatLog(`你发动${heavy?'重击':'攻击'}｜1d100 = ${roll} ${mod>0?'+'+mod:''} = ${total} ／ 命中需求 ${need}`, 'pl');
  if(!hit){
    combatLog(`攻击落空！`, 'fumb');
    combatEnemyTurn(); return;
  }
  if(crit) combatLog(`暴击！`, 'crit');
  let dmg = S.stats.str + rint(1,6);
  if(heavy) dmg = Math.round(dmg*1.7);
  if(crit) dmg = Math.round(dmg*(S.talents.includes('blink')?1.5:1.3));
  if(S.talents.includes('eye')) dmg += 6;
  CB.hp -= dmg;
  combatLog(`你对${ENEMIES[CB.id].name}造成 <b>${dmg}</b> 点伤害！`, 'pl');
  if(CB.hp<=0){ combatVictory(); return; }
  combatEnemyTurn();
}
function combatGuard(){
  CB.turn++;
  CB.guard=true;
  combatLog(`你摆出防御姿态，本回合受到的伤害减半。`, 'pl');
  combatEnemyTurn();
}
function combatPotion(){
  CB.turn++;
  const idx=S.items.indexOf('potion');
  if(idx<0) return;
  S.items.splice(idx,1);
  S.hp = Math.min(S.maxHp, S.hp+25);
  updateHUD();
  combatLog(`你饮下回响药剂，恢复 25 点生命！（当前 ${S.hp}/${S.maxHp}）`, 'pl');
  combatEnemyTurn();
}
function combatFate(){
  CB.turn++;
  S.fate--; updateHUD();
  S.flag._fateForce = true;
  combatLog(`你燃尽一枚命运点，下一次攻击必定命中且暴击！`, 'crit');
  // 重新渲染按钮状态
  renderCombat();
  // 立即补一次操作：直接帮玩家攻击
  combatPlayerAttack(false);
}
function combatEnemyTurn(){
  if(!CB) return;
  const e = ENEMIES[CB.id];
  let roll = roll100();
  const mod = e.atk;
  const total = roll + mod;
  const need = 50 + Math.round(S.stats.agi*0.8) + (S.talents.includes('blink')&&CB.turn<=1?8:0);
  let hit = total>=need;
  combatLog(`${e.name}发动攻击｜1d100 = ${roll} + ${mod} = ${total} ／ 你的闪避 ${need}`, 'en');
  if(!hit){
    combatLog(`${e.name}的攻击被你闪开！`, 'ok');
    renderCombat(); return;
  }
  let dmg = e.atk + rint(1,4) - Math.round(S.stats.con*0.3);
  if(CB.guard){ dmg = Math.round(dmg*0.5); CB.guard=false; }
  if(S.talents.includes('iron')) dmg = Math.round(dmg*0.7);
  dmg = Math.max(1, dmg);
  S.hp -= dmg;
  updateHUD();
  combatLog(`你受到 <b>${dmg}</b> 点伤害！（生命 ${Math.max(0,S.hp)}/${S.maxHp}）`, 'en');
  // 老爷爷护体
  if(S.hp<=0 && S.talents.includes('grandpa') && CB.fatalGuard){
    CB.fatalGuard=false;
    S.hp = 1;
    updateHUD();
    combatLog(`——关键时刻，一道苍老的声音在灵魂深处响起：「小子，把这条命，交给老夫！」\n老爷爷替你挡下了致命一击！（生命 1/${S.maxHp}）`, 'crit');
  }
  if(S.hp<=0){ renderDeath(); return; }
  renderCombat();
}
function combatVictory(){
  const e = ENEMIES[CB.id];
  combatLog(`你击败了 ${e.name}！`, 'crit');
  if(CB.opMode){
    // 搜打撤行动：目标已清除，进入撤离阶段
    victoryRewards(false);
    combatLog('目标已清除！四周的异常数据四散奔逃——正是撤离的时机。', 'ok');
    updateHUD();
    CB=null;
    setTimeout(()=>{
      OP.phase='withdraw';
      OP.log.push('目标已清除。别贪战利品——现在，按规矩：撤！');
      renderOperation();
    }, 950);
    return;
  }
  victoryRewards(true);
  updateHUD();
  const winNode = CB.winNode;
  CB=null;
  setTimeout(()=>gotoNode(winNode), 900);
}
function victoryRewards(withLoot){
  const e = ENEMIES[CB.id];
  S.gold += e.gold||0;
  if(e.reward){ combatLog(e.reward,'ok'); S.gold+=5; }
  // 天赋成长/回复
  if(S.talents.includes('growth')){
    const keys=['str','agi','int','cha','con','per'];
    const k=keys[rand(keys.length)];
    S.stats[k]++; combatLog(`「无限成长」发动！${k} +1（当前 ${S.stats[k]}）`, 'ok');
  }
  if(S.talents.includes('body')){
    S.hp=Math.min(S.maxHp,S.hp+8); combatLog(`「纯阳之体」回复 8 点生命。`, 'ok');
  }
  updateHUD();
  if(!withLoot) return;
  const gifts = [];
  if(!S.items.includes('potion') && rand(100)<40) { S.items.push('potion'); gifts.push('回响药剂'); }
  if(rand(100)<35) { S.items.push('coin'); gifts.push('命运币'); }
  if(gifts.length){ combatLog(`战利品：${gifts.join('、')}`, 'ok'); updateHUD(); }
}

/* ---------- 搜打撤行动 ---------- */
let OP = null;
function startOperation(){
  OP = {
    phase:'search', bonus:0, surprised:false,
    log:['—— 搜打撤行动 · 开始 ——','目标：一处被异常数据占领的旧仓库。','规矩：搜到了再打，打完了就撤，别贪。']
  };
  S.nodeId='operation';
  updateHUD();
  renderOperation();
}
function opPhaseIndex(){
  if(OP.phase==='search'||OP.phase==='searching') return 0;
  if(OP.phase==='combat') return 1;
  if(OP.phase==='withdraw'||OP.phase==='withdrawing') return 2;
  return 3;
}
function renderOperation(){
  const v = $('view-operation');
  const phases = ['搜索','打击','撤离'];
  const cur = opPhaseIndex();
  let body='';
  if(OP.phase==='search'){
    body = `<div class="choices" id="op-choices"><div class="choice" id="op-search"><span class="c-tag">【搜索】</span>搜索目标据点<span class="c-desc">感知判定 · 定位敌人，寻找弱点</span></div></div>`;
  } else if(OP.phase==='searching'){
    body = `<div class="notice">正在搜索目标……</div>`;
  } else if(OP.phase==='combat'){
    body = `<div class="notice">目标已锁定——进入战斗！</div>`;
  } else if(OP.phase==='withdraw'){
    body = `<div class="choices" id="op-choices"><div class="choice" id="op-withdraw"><span class="c-tag">【撤离】</span>执行撤离<span class="c-desc">敏捷判定 · 带着战利品安全离开</span></div></div>`;
  } else if(OP.phase==='withdrawing'){
    body = `<div class="notice">正在撤离……</div>`;
  } else {
    // done
    const r = OP.result||{title:'行动结束',good:false,text:''};
    body = `<div class="op-result ${r.good?'good':'bad'}">
      <div class="scene-title" style="font-size:18px;margin-bottom:8px">${esc(r.title)}</div>
      <div class="story" style="white-space:pre-wrap">${esc(r.text)}</div>
    </div>
    <div class="choices" id="op-choices"><div class="choice" id="op-done"><span class="c-tag">【返回】</span>返回中枢塔，继续主线</div></div>`;
  }
  v.innerHTML = `
    <div class="panel">
      <div class="scene-chap">支线 · 搜打撤行动 · 第 ${S.run} 周目</div>
      <div class="scene-title">黑塔帮的委托</div>
      <div class="scene-tagline">搜 → 打 → 撤</div>
      <div class="op-steps">
        ${phases.map((p,i)=>`<div class="op-step ${i<cur?'done':''} ${i===cur?'on':''}">${['①','②','③'][i]} ${p}</div>`).join('')}
      </div>
      <div class="dice-log" id="dice-log"></div>
      <div class="op-log">${OP.log.map(l=>esc(l)).join('\n')}</div>
      ${body}
    </div>`;
  showView('operation');
  const btn = $('op-search')||$('op-withdraw')||$('op-done');
  if(btn) btn.onclick = ()=>{
    if(btn.id==='op-search') opSearch();
    else if(btn.id==='op-withdraw') opWithdraw();
    else { OP=null; gotoNode('c2_file'); }
  };
  $('view').scrollTop=0; window.scrollTo({top:0});
}
function opSearch(){
  const res = runCheck('per', 55, '搜索 · 定位目标');
  OP.log.push(`【骰】搜索：1d100 = ${res.roll}${res.mod>0?'+'+res.mod:''} = ${res.total} ／ 难度 55 ${res.success?'　判定成功':'　判定失败'}`);
  if(res.success){
    OP.bonus += 10;
    OP.log.push('你摸清了目标据点的守卫分布，找到了敌人的数据弱点（打击阶段命中需求 -10）。');
  } else {
    OP.surprised = true;
    OP.log.push('你不慎踩响了一块故障地板——警报大作！守卫已先手，且任务奖励将减半。');
  }
  OP.phase = 'combat';
  renderOperation();
  setTimeout(opCombat, 900);
}
function opCombat(){
  startCombat('fiend', null, 'death', {opMode:true, opBonus:OP.bonus});
  if(OP.surprised) setTimeout(()=>combatEnemyTurn(), 700);
}
function opWithdrawFromCombat(){
  if(!CB) return;
  combatLog('你且战且退，尝试从战区突围……', 'pl');
  const res = runCheck('agi', 55, '撤离 · 突围');
  if(res.success){
    OP.log.push(`【骰】撤离：1d100 = ${res.roll} = ${res.total} ／ 难度 55　判定成功`);
    if(OP.bonus>0){ S.gold += 8; updateHUD(); }
    OP.log.push('你甩开追兵，带着搜集到的情报全身而退。');
    OP.result = {
      title:'行动中止', good:true,
      text:`任务未能完成——但至少，你保住了性命与情报。\n${OP.bonus>0?'【情报费】金币 +8':'没有完成目标，也没有额外收获。'}\n黑塔帮接头人撇撇嘴：“啧，至少没白跑一趟。”`
    };
  } else {
    S.hp = Math.max(1, S.hp-10); updateHUD();
    OP.log.push(`【骰】撤离：1d100 = ${res.roll} = ${res.total} ／ 难度 55　判定失败`);
    OP.log.push('撤退失败——你挨了一记重击，狼狈逃回。');
    OP.result = {
      title:'负伤突围', good:false,
      text:'撤退失败，你被异常数据咬了一口，狼狈逃回大本营。\n【损失】生命 -10\n“活着回来就好。”接头人难得说了一句人话。'
    };
  }
  CB = null;
  OP.phase = 'done';
  renderOperation();
}
function opWithdraw(){
  OP.phase = 'withdrawing';
  renderOperation();
  const res = runCheck('agi', 55, '撤离 · 离开战区');
  const base = 25 + (OP.bonus>0 ? 10 : 0);
  setTimeout(()=>{
    OP.log.push(`【骰】撤离：1d100 = ${res.roll}${res.mod>0?'+'+res.mod:''} = ${res.total} ／ 难度 55 ${res.success?'　判定成功':'　判定失败'}`);
    if(res.success){
      S.gold += base;
      const got=[];
      if(!S.items.includes('memcard') && rand(100)<60){ S.items.push('memcard'); got.push('记忆卡'); }
      if(rand(100)<45){ S.items.push('coin'); got.push('命运币'); }
      updateHUD();
      OP.log.push('你带着战利品扬长而去，身后传来异常数据的哀嚎。');
      OP.result = {
        title:'行动圆满', good:true,
        text:`【奖励】金币 +${base}${got.length?' · 获得 '+got.join('、'):''}\n黑塔帮接头人满意地点头：“干净利落，连撤退都这么帅。下次还找你。”`
      };
    } else {
      const lost = Math.floor(S.gold/2);
      S.gold -= lost;
      S.hp = Math.max(1, S.hp-8);
      updateHUD();
      OP.log.push('撤退途中遭遇截击——你丢下部分战利品，负伤冲出重围。');
      OP.result = {
        title:'惊险撤离', good:false,
        text:`【损失】金币 -${lost} · 生命 -8\n“东西丢了可以再抢，人没了可就真没了。”接头人难得严肃起来。`
      };
    }
    OP.phase = 'done';
    renderOperation();
  }, 700);
}

function gotoTitleAfterRun(){

}

/* ---------- 结局 ---------- */
function goEnding(id){
  const e = ENDINGS[id];
  if(!e) return;
  S.nodeId='ending';
  if(!S.finishedEndings.includes(id)) S.finishedEndings.push(id);
  S.echoes += 3; S.totalRuns++;
  saveSave();
  updateHUD();
  const v=$('view-ending');
  v.innerHTML = `
    <div class="panel">
      <div class="ending-banner">
        <div class="scene-chap">第 ${S.run} 周目 · 终局</div>
        <div class="ending-title ${e.cls}">${esc(e.title)}</div>
        <div class="ending-sub">${esc(e.sub)}</div>
      </div>
      <div class="dice-log" id="dice-log"></div>
      <div class="ending-text">${fillText(e.text)}</div>
      <div class="stats-sum">
        <div class="stat-card"><div class="k">轮回周目</div><div class="v">${S.run}</div></div>
        <div class="stat-card"><div class="k">回响碎片</div><div class="v">+3 → ${S.echoes}</div></div>
        <div class="stat-card"><div class="k">已解锁结局</div><div class="v">${S.finishedEndings.length}/4</div></div>
      </div>
      <div class="notice">你记住了这段轮回。这座城，会记得你的选择。</div>
      <div class="choices">
        <div class="choice" id="again"><span class="c-tag">【轮回】</span>开始新的轮回 · 觉醒新天赋</div>
        <div class="choice" id="back-title2">返回主菜单</div>
      </div>
    </div>`;
  showView('ending');
  $('again').onclick=()=>{ resetRun(); renderTalentSelect(); };
  $('back-title2').onclick=()=>{ renderTitle(); };
}

      ▸ <b>天赋</b>：每轮开局从 3 个随机天赋中选 1。天赋分 7 个品级（D→SSS），决定你的流派。<br>
      ▸ <b>安科骰子</b>：关键抉择由 1d100 判定——大成功（1-5）必成，大失败（96-100）必败。失败时可用<b>命运点</b>重掷。<br>
      ▸ <b>命运点</b>：每轮获得 2 点（回响碎片越多，初始越多）。用于重掷骰子与战斗爆发。<br>
      ▸ <b>轮回肉鸽</b>：死亡或通关即轮回。金币与天赋不保留，但<b>回响碎片</b>永久累积，可提升下轮初始命运点。<br>
      ▸ <b>搜打撤行动</b>：黑塔帮的支线委托——搜索定位 → 打击目标 → 安全撤离，一步都不能少。高风险，高回报。<br>
      ▸ <b>多剧情多结局</b>：三章主线 × 阵营抉择 × NPC支线，通向 4 个结局（含隐藏结局）。你的每一个选择，都会留下“回响”。<br><br>
      <b>隐藏要素</b>：获得【回响水晶】或【真相透镜】后，第三章会解锁隐藏选项「？？？？」。
    </div>`;
  showView('title');
  $('btn-start').onclick=()=>renderTalentSelect();
  $('btn-help').onclick=()=>{ const h=$('help-box'); h.style.display = h.style.display==='none'?'block':'none'; };
}
function renderTalentSelect(){
  S.nodeId='talent';
  newRun();
  const picks = pickTalents();
  S._talentPool = picks;
  updateHUD();
  const v=$('view-talent');
  v.innerHTML = `
    <div class="panel">
      <div class="scene-chap">轮回历第 ${S.run} 周目 · 觉醒</div>
      <div class="scene-title">选择你的天赋烙印</div>
      <div class="scene-tagline">天赋品级：劣品 D → 神话 SSS ｜ 天赋是你在轮回中唯一不灭的东西</div>
      <div class="story">系统提示音在你灵魂深处响起：\n\n“检测到可觉醒灵魂烙印。请从以下天赋中选择其一，作为本周目的‘金手指’。”\n\n天赋决定流派——谨慎选择。</div>
      <div class="talent-cards" id="talent-cards"></div>
      <div class="notice" id="talent-note">点击卡片，确认觉醒。</div>
    </div>`;
  const box=$('talent-cards');
  picks.forEach((t,idx)=>{
    const g=GRADE[t.grade];
    const card=document.createElement('div');
    card.className='tcard';
    card.style.borderColor = g.color+'55';
    card.innerHTML = `
      <div class="t-glow" style="background:${g.color}"></div>
      <div class="t-grade grade-${t.grade}">${t.grade} · ${g.name}</div>
      <div class="t-name" style="color:${g.color}">${esc(t.name)}</div>
      <div class="t-type">${esc(t.type)}</div>
      <div class="t-desc">${esc(t.desc)}</div>
      <div class="t-flavor">“${esc(t.flavor)}”</div>`;
    card.onclick=()=>{
      box.querySelectorAll('.tcard').forEach(c=>c.classList.remove('sel'));
      card.classList.add('sel');
      S._picked=t;
      $('talent-note').textContent = `已选定「${t.name}」。开始轮回。`;
      setTimeout(()=>{
        applyTalent(t);
        S.hp = Math.min(S.maxHp, S.hp);
        updateHUD();
        gotoNode('c1_intro');
      }, 500);
    };
    box.appendChild(card);
  });
  showView('talent');
}

/* ---------- 启动 ---------- */
function boot(){
  loadSave();
  renderTitle();
}
document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
